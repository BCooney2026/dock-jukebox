<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dock Jukebox playback test</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 20px; }
  button { font: inherit; padding: 8px 14px; cursor: pointer; }
  input { font: inherit; padding: 8px; width: 320px; }
  #results { list-style: none; padding: 0; }
  #results li { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid #ddd; }
  #results img { width: 44px; height: 44px; }
  #results span { flex: 1; }
  #log { background: #f2f2f2; padding: 12px; white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 13px; }
  .row { margin-bottom: 20px; }
</style>
</head>
<body>

<h1>Dock Jukebox playback test</h1>

<div class="row">
  <button id="signin">Sign in to Apple Music</button>
  <span id="authstate">not signed in</span>
</div>

<div class="row">
  <input id="term" placeholder="Search for a song" value="ring of fire">
  <button id="search">Search</button>
</div>

<ul id="results"></ul>

<div class="row">
  <button id="pause">Pause</button>
  <button id="resume">Resume</button>
</div>

<div id="log">Loading MusicKit...</div>

<script src="https://js-cdn.music.apple.com/musickit/v3/musickit.js" data-web-components async></script>
<script>
// Developer token generated by make_music_token.py. Expires March 6, 2027.
const DEVELOPER_TOKEN = "eyJhbGciOiJFUzI1NiIsImtpZCI6IkMyTTZYTTU5OEIiLCJ0eXAiOiJKV1QifQ.eyJpc3MiOiJVOTY4TVdaSjhUIiwiaWF0IjoxNzg4NTY5OTIyLCJleHAiOjE4MDQzNDY5MjJ9.gO46sv13ANw3wBn7jodVOBEKpjgfdUEpWfvpCV254YFTbX-_TPYbxJTxo2XVFEYAZdyu_Obm8girpiJvTBal3g";

const logEl = document.getElementById("log");
let music = null;

function log(message) {
  logEl.textContent = message + "\n\n" + logEl.textContent;
}

document.addEventListener("musickitloaded", async () => {
  try {
    music = await MusicKit.configure({
      developerToken: DEVELOPER_TOKEN,
      app: { name: "Dock Jukebox", build: "1.0.0" }
    });
    log("MusicKit configured. Sign in next.");
    if (music.isAuthorized) {
      document.getElementById("authstate").textContent = "signed in";
    }
  } catch (err) {
    log("Configure failed: " + err.message);
  }
});

document.getElementById("signin").addEventListener("click", async () => {
  try {
    await music.authorize();
    document.getElementById("authstate").textContent = "signed in";
    log("Signed in. Music user token received.");
  } catch (err) {
    log("Sign in failed: " + err.message);
  }
});

document.getElementById("search").addEventListener("click", async () => {
  const term = document.getElementById("term").value;
  const list = document.getElementById("results");
  list.innerHTML = "";

  try {
    const response = await music.api.music("/v1/catalog/us/search", {
      term: term,
      types: ["songs"],
      limit: 10
    });

    const songs = response.data.results.songs ? response.data.results.songs.data : [];
    if (songs.length === 0) {
      log("No results for: " + term);
      return;
    }

    songs.forEach(song => {
      const art = song.attributes.artwork.url.replace("{w}", "88").replace("{h}", "88");
      const item = document.createElement("li");
      item.innerHTML =
        '<img src="' + art + '" alt="">' +
        "<span>" + song.attributes.name + " &middot; " + song.attributes.artistName + "</span>";

      const playButton = document.createElement("button");
      playButton.textContent = "Play";
      playButton.addEventListener("click", () => play(song.id, song.attributes.name));
      item.appendChild(playButton);

      list.appendChild(item);
    });

    log("Found " + songs.length + " songs.");
  } catch (err) {
    log("Search failed: " + err.message);
  }
});

async function play(songId, songName) {
  try {
    await music.setQueue({ song: songId, startPlaying: true });
    log("Playing: " + songName);
  } catch (err) {
    log("Playback failed: " + err.message);
  }
}

document.getElementById("pause").addEventListener("click", () => music.pause());
document.getElementById("resume").addEventListener("click", () => music.play());
</script>

</body>
</html>
