<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Cooney Provisions Video Jukebox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600&family=Josefin+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0c0a09;
    --amber: #ffa62b;
    --cream: #f7f1e6;
    --dim: rgba(247, 241, 230, 0.45);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--ink);
    color: var(--cream);
    font-family: Barlow, system-ui, sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }

  /* Blurred album art fills the wall behind everything, so every song
     repaints the whole screen in its own colors. */
  #backdrop {
    position: fixed;
    inset: -12%;
    background-size: cover;
    background-position: center;
    filter: blur(70px) saturate(1.5);
    opacity: 0;
    transform: scale(1.08);
    transition: opacity 1.4s ease;
  }
  #backdrop.on { opacity: 0.62; }

  #scrim {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(120% 90% at 22% 45%, rgba(0,0,0,0.15), rgba(0,0,0,0.82) 78%),
      linear-gradient(to top, rgba(0,0,0,0.9), rgba(0,0,0,0.25));
  }

  #videostage {
    display: none;
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 6;
    pointer-events: none;
  }
  #videostage.on { display: block; }

  #screen { position: absolute; inset: 0; }

  /* MusicKit injects its own video element and likes to position it over the
     whole page. Pin it inside the box instead. */
  #screen video {
    position: absolute !important;
    inset: 0 !important;
    width: 100% !important;
    height: 100% !important;
    object-fit: contain;
    background: #000;
    z-index: 1;
  }
  #screen > div {
    position: absolute !important;
    inset: 0 !important;
    width: 100% !important;
    height: 100% !important;
  }

  /* The YouTube fallback sits in the same box as the Apple video, underneath
     the title bar so the song and requester still read over the top of it. */
  #ytframe {
    display: none;
    position: absolute;
    inset: 0;
    z-index: 2;
    /* The stage above this is pointer-events: none, which used to mean taps
       aimed at the YouTube play button went straight through to the page and
       zoomed it instead. Videos should never need a tap, but when one stalls
       somebody has to be able to poke it. */
    pointer-events: auto;
  }
  #ytframe.on { display: block; }
  #ytframe iframe {
    width: 100%;
    height: 100%;
    border: 0;
  }

  /* ---- The celebration card ----------------------------------------------
     Full screen, between songs. Not a corner graphic and not a lower third:
     the point is that everybody in the building looks up, so it takes the
     whole picture for a few seconds the way a station ident would.

     Built out of the same parts as the bug, deliberately. Same amber, same
     scalloped disc, same hard outline. It should read as the same channel
     doing something bigger, not as a different app. */
  #celebrate {
    position: fixed;
    inset: 0;
    z-index: 12;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 2.5vh;
    background: #0c0a09;
    text-align: center;
    pointer-events: none;
  }
  #celebrate.on { display: flex; }

  #celebrate .kicker {
    font-family: 'Bebas Neue', system-ui, sans-serif;
    font-size: clamp(20px, 4.5vh, 54px);
    letter-spacing: 0.3em;
    color: var(--amber);
    opacity: 0;
    animation: celebKicker 700ms ease-out 250ms forwards;
  }
  #celebrate .who {
    font-family: 'Josefin Sans', 'Century Gothic', system-ui, sans-serif;
    font-weight: 700;
    font-size: clamp(44px, 13vh, 170px);
    line-height: 1;
    color: #fff;
    text-transform: uppercase;
    text-shadow: 3px 3px 0 rgba(0,0,0,0.85);
    opacity: 0;
    animation: celebWho 900ms cubic-bezier(0.2, 1.2, 0.3, 1) 500ms forwards;
  }
  #celebrate .years {
    font-family: 'Bebas Neue', system-ui, sans-serif;
    font-size: clamp(24px, 6.5vh, 80px);
    letter-spacing: 0.12em;
    color: var(--amber);
    opacity: 0;
    animation: celebKicker 700ms ease-out 1100ms forwards;
  }
  #celebrate .mark {
    width: 26vw;
    max-width: 520px;
    opacity: 0;
    animation: celebMark 900ms ease-out 1400ms forwards;
  }

  @keyframes celebKicker {
    0%   { opacity: 0; transform: translateY(14px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  @keyframes celebWho {
    0%   { opacity: 0; transform: scale(2.2); filter: blur(12px); }
    55%  { opacity: 1; transform: scale(0.94); filter: blur(0); }
    78%  { transform: scale(1.04); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes celebMark {
    0%   { opacity: 0; transform: translateY(20px); }
    100% { opacity: 0.85; transform: translateY(0); }
  }

  /* ---- The network bug --------------------------------------------------
     Bottom left, and it has to be. Broadcast convention would put a bug
     opposite the character generator, which would mean bottom right, and that
     is wrong here: .vright holds the up-next list and the requested-by credit
     and they are on screen for the WHOLE song. The lower third on the left is
     up for ten seconds and gone.

     That is the distinction that decides the corner. Sharing with something
     temporary works, because the bug does not arrive until
     BUG_DELAY_SECONDS, long after the titles have cleared. Sharing with
     something permanent does not, at any timing. If you ever shorten
     BUG_DELAY_SECONDS below about 16, check it against TITLE_DELAY_SECONDS
     plus TITLE_SECONDS.

     Two nested elements on purpose. #bug owns whether it is on screen at all,
     which is a plain opacity fade. #bugfx owns the entrance animation. Keeping
     them apart means an animation that plays with opacity, like the flash,
     cannot fight the fade, and adding a new animation later cannot break the
     showing and hiding. */
  #bug {
    z-index: 9;
    position: fixed;
    bottom: 4vh;
    left: 4vw;

    /* Sized purely as a share of the screen, with no upper cap. There used to
       be a 340px ceiling, which is invisible at 1920 wide and quietly halves
       the logo on a display that reports more than about 2000 CSS pixels. A
       bug should be the same fraction of the picture on every screen, which is
       what vw already does. The floor is only for reading the debug strip on a
       laptop, where 17vw would be too small to see. */
    width: 17vw;
    min-width: 150px;

    opacity: 0;
    pointer-events: none;

    /* One definition, referenced by the base style and by every animation that
       has to restate the resting look. It was written out in seven places, and
       seven copies of a value is six chances for the idle loop to end on a
       slightly different shadow than it started on and visibly jump. */
    --bug-shadow: drop-shadow(0 3px 11px rgba(0,0,0,0.9));
  }

  /* No transition, on purpose. The arrival animation starts at opacity 0 and
     brings the logo in, and the departure animation ends at opacity 0 and
     takes it away. A fade here would run alongside them and turn one movement
     into two overlapping ones, which is what made arriving and leaving feel
     disconnected from the animation in between. */
  /* 0.7, not higher. A bug is a watermark: at 0.86 with a hard drop shadow it
     was competing with the video rather than sitting on top of it. */
  #bug.up { opacity: 0.7; }

  #bugfx {
    position: relative;
    /* Matches the corner it is anchored to, so scaling and rotation pivot on
       the corner rather than dragging the logo away from it. */
    transform-origin: bottom left;
  }

  #bugfx img {
    width: 100%;
    display: block;
    filter: var(--bug-shadow);
  }

  /* The shimmer's moving highlight. Masked with the logo itself so the light
     travels across the letters and the boar instead of across a rectangle.
     Invisible unless the shimmer is the animation that got picked. */
  #bugsheen {
    position: absolute;
    inset: 0;
    opacity: 0;
    background: linear-gradient(
      100deg,
      transparent 38%,
      rgba(255,255,255,0.9) 50%,
      transparent 62%
    );
    background-size: 300% 100%;
    background-position: 130% 0;
    -webkit-mask-image: url(cp-music-tv.png);
    mask-image: url(cp-music-tv.png);
    -webkit-mask-size: 100% 100%;
    mask-size: 100% 100%;
    -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat;
  }

  /* ---- The bug's arrivals and departures --------------------------------
     Every animation comes in a pair. The bug arrives with the -in and leaves
     with the matching -out, so a punch in leaves by punching out and a slide
     from the left leaves to the left. One pair is chosen per appearance and
     the same pair is used at both ends.

     TWO RULES THAT KEEP THIS WORKING.
     Every -in starts at opacity 0 and ends on a clean, still, unmodified logo.
     The animation IS the entrance: there is no separate fade, which is what
     used to make arriving feel like two unrelated events.
     Every -out starts clean and ends at opacity 0, and carries
     animation-fill-mode: forwards so it holds there. That is why the logo is
     never seen to vanish: by the time anything removes it, it has already
     animated itself away.

     Adding a pair is: two keyframes, two .fx- rules, one name in
     BUG_ANIMATIONS. */

  /* Light sweeps across and leaves the logo behind it. */
  @keyframes bugShimmerIn {
    0%   { opacity: 0; }
    30%  { opacity: 0.5; }
    100% { opacity: 1; }
  }
  @keyframes bugShimmerSweep {
    0%   { background-position: 140% 0; opacity: 0; }
    10%  { opacity: 1; }
    85%  { opacity: 1; }
    100% { background-position: -140% 0; opacity: 0; }
  }
  .fx-shimmer-in #bugfx { animation: bugShimmerIn 1100ms ease-out; }
  .fx-shimmer-in #bugsheen { animation: bugShimmerSweep 1400ms ease-in-out; }

  /* The light comes back the other way and takes it with it. */
  @keyframes bugShimmerOut {
    0%   { opacity: 1; filter: brightness(1); }
    45%  { opacity: 1; filter: brightness(2.4); }
    100% { opacity: 0; filter: brightness(4); }
  }
  @keyframes bugShimmerSweepBack {
    0%   { background-position: -140% 0; opacity: 0; }
    12%  { opacity: 1; }
    100% { background-position: 140% 0; opacity: 0; }
  }
  .fx-shimmer-out #bugfx {
    animation: bugShimmerOut 1000ms ease-in forwards;
  }
  .fx-shimmer-out #bugsheen { animation: bugShimmerSweepBack 1000ms ease-in-out; }

  /* Rattles into place. */
  @keyframes bugBuzzIn {
    0%   { opacity: 0; transform: translate(-16px, 10px); }
    12%  { opacity: 1; transform: translate(12px, -8px) rotate(2deg); }
    26%  { transform: translate(-10px, -7px) rotate(-1.6deg); }
    40%  { transform: translate(8px, 6px) rotate(1.2deg); }
    54%  { transform: translate(-6px, 4px) rotate(-0.8deg); }
    68%  { transform: translate(4px, -3px); }
    82%  { transform: translate(-2px, 1px); }
    100% { opacity: 1; transform: translate(0, 0) rotate(0); }
  }
  .fx-buzz-in { animation: bugBuzzIn 1000ms steps(1, end); }

  /* Rattles itself apart. */
  @keyframes bugBuzzOut {
    0%   { opacity: 1; transform: translate(0, 0); }
    16%  { transform: translate(5px, -4px) rotate(1deg); }
    32%  { transform: translate(-8px, 6px) rotate(-1.6deg); }
    50%  { opacity: 1; transform: translate(12px, -9px) rotate(2.4deg); }
    68%  { opacity: 0.6; transform: translate(-17px, 12px) rotate(-3deg); }
    84%  { opacity: 0.25; transform: translate(22px, -15px) rotate(4deg); }
    100% { opacity: 0; transform: translate(-28px, 19px) rotate(-5deg); }
  }
  .fx-buzz-out { animation: bugBuzzOut 800ms steps(1, end) forwards; }

  /* Cuts in.

     THE TIMING HERE IS A SAFETY LIMIT, NOT A TASTE DECISION.
     This and the neon pair are the only animations that cut between fully
     visible and fully dark. Flashing faster than three times a second is the
     range that can trigger photosensitive seizures, and this plays on a screen
     twenty five people walk past. Every state change in these four keyframes
     is at least a third of a second from the next. Keep it that way: if you
     shorten the duration, take cuts out to match. */
  @keyframes bugFlashIn {
    0%   { opacity: 0; }
    25%  { opacity: 1; filter: brightness(2.6); }
    50%  { opacity: 0; }
    75%  { opacity: 1; filter: brightness(1.8); }
    100% { opacity: 1; filter: brightness(1); }
  }
  .fx-flash-in { animation: bugFlashIn 1500ms steps(1, end); }

  /* Cuts out, ending dark. */
  @keyframes bugFlashOut {
    0%   { opacity: 1; filter: brightness(1); }
    33%  { opacity: 0; }
    66%  { opacity: 1; filter: brightness(3); }
    100% { opacity: 0; }
  }
  .fx-flash-out { animation: bugFlashOut 1200ms steps(1, end) forwards; }

  /* Tears into place. */
  @keyframes bugGlitchIn {
    0%   { opacity: 0; clip-path: inset(0 0 70% 0); transform: translateX(-46px) skewX(-10deg); }
    10%  { opacity: 1; clip-path: inset(54% 0 18% 0); transform: translateX(40px) skewX(8deg); }
    22%  { clip-path: inset(12% 0 60% 0); transform: translateX(-32px) skewX(-6deg); }
    34%  { clip-path: inset(76% 0 2% 0);  transform: translateX(27px); }
    46%  { clip-path: inset(26% 0 46% 0); transform: translateX(-19px) skewX(5deg); }
    60%  { clip-path: inset(0 0 0 0);     transform: translateX(13px); }
    74%  { clip-path: inset(46% 0 26% 0); transform: translateX(-7px) skewX(-3deg); }
    88%  { clip-path: inset(0 0 0 0);     transform: translateX(3px); }
    100% { opacity: 1; clip-path: inset(0 0 0 0); transform: translateX(0) skewX(0); }
  }
  .fx-glitch-in { animation: bugGlitchIn 900ms steps(1, end); }

  /* Tears apart and is gone. */
  @keyframes bugGlitchOut {
    0%   { opacity: 1; clip-path: inset(0 0 0 0); transform: translateX(0); }
    14%  { clip-path: inset(0 0 58% 0); transform: translateX(18px) skewX(6deg); }
    28%  { clip-path: inset(62% 0 12% 0); transform: translateX(-26px) skewX(-8deg); }
    44%  { opacity: 1; clip-path: inset(20% 0 52% 0); transform: translateX(36px) skewX(11deg); }
    60%  { opacity: 0.7; clip-path: inset(70% 0 6% 0); transform: translateX(-48px) skewX(-14deg); }
    78%  { opacity: 0.35; clip-path: inset(34% 0 40% 0); transform: translateX(62px) skewX(18deg); }
    100% { opacity: 0; clip-path: inset(48% 0 48% 0); transform: translateX(-80px) skewX(-22deg); }
  }
  .fx-glitch-out { animation: bugGlitchOut 750ms steps(1, end) forwards; }

  /* A CRT switching on: a line of light that opens out. */
  @keyframes bugTvOn {
    0%   { opacity: 0; transform: scale(1.7, 0.004); filter: brightness(9); }
    18%  { opacity: 1; transform: scale(1.6, 0.008); filter: brightness(9); }
    40%  { transform: scale(1.5, 0.012); filter: brightness(8); }
    62%  { transform: scale(0.86, 1.28); filter: brightness(3.4); }
    78%  { transform: scale(1.12, 0.88); filter: brightness(1.9); }
    90%  { transform: scale(0.96, 1.05); filter: brightness(1.2); }
    100% { opacity: 1; transform: scale(1, 1); filter: brightness(1); }
  }
  .fx-tvon-in { animation: bugTvOn 950ms ease-out; }

  /* And switching off: collapses to a line, then a dot, then nothing. The one
     everybody recognises, so it has to land exactly. */
  @keyframes bugTvOff {
    0%   { opacity: 1; transform: scale(1, 1); filter: brightness(1); }
    30%  { opacity: 1; transform: scale(1.06, 0.72); filter: brightness(2.4); }
    52%  { opacity: 1; transform: scale(1.5, 0.012); filter: brightness(9); }
    72%  { opacity: 1; transform: scale(0.9, 0.008); filter: brightness(10); }
    88%  { opacity: 1; transform: scale(0.08, 0.008); filter: brightness(12); }
    100% { opacity: 0; transform: scale(0.01, 0.004); filter: brightness(14); }
  }
  .fx-tvoff-out { animation: bugTvOff 800ms cubic-bezier(0.5, 0, 0.75, 0) forwards; }

  /* Rolls up from below and catches. */
  @keyframes bugRollIn {
    0%   { opacity: 0; transform: translateY(190%); }
    10%  { opacity: 1; }
    26%  { transform: translateY(-150%); }
    44%  { transform: translateY(105%); }
    60%  { transform: translateY(-62%); }
    74%  { transform: translateY(34%); }
    86%  { transform: translateY(-16%); }
    94%  { transform: translateY(6%); }
    100% { opacity: 1; transform: translateY(0); }
  }
  .fx-roll-in { animation: bugRollIn 1150ms cubic-bezier(0.32, 0.75, 0.35, 1); }

  /* Loses hold and rolls away off the top. */
  @keyframes bugRollOut {
    0%   { opacity: 1; transform: translateY(0); }
    18%  { transform: translateY(22%); }
    36%  { transform: translateY(-48%); }
    56%  { transform: translateY(70%); }
    76%  { opacity: 1; transform: translateY(-130%); }
    88%  { opacity: 0.5; transform: translateY(160%); }
    100% { opacity: 0; transform: translateY(-240%); }
  }
  .fx-roll-out { animation: bugRollOut 850ms cubic-bezier(0.4, 0, 0.7, 0.2) forwards; }

  /* Slams in oversized and settles. */
  @keyframes bugPunchIn {
    0%   { opacity: 0; transform: scale(2.8); filter: blur(14px); }
    38%  { opacity: 1; transform: scale(0.78); filter: blur(0); }
    58%  { transform: scale(1.16); }
    74%  { transform: scale(0.94); }
    88%  { transform: scale(1.04); }
    100% { opacity: 1; transform: scale(1); filter: blur(0); }
  }
  .fx-punch-in { animation: bugPunchIn 800ms cubic-bezier(0.2, 1.1, 0.3, 1); }

  /* Winds back, then fires straight through the screen. */
  @keyframes bugPunchOut {
    0%   { opacity: 1; transform: scale(1); filter: blur(0); }
    30%  { opacity: 1; transform: scale(0.8); filter: blur(0); }
    100% { opacity: 0; transform: scale(3.4); filter: blur(18px); }
  }
  .fx-punch-out { animation: bugPunchOut 650ms cubic-bezier(0.5, 0, 0.9, 0.4) forwards; }

  /* Drops in and rocks to a stop. */
  @keyframes bugWobbleIn {
    0%   { opacity: 0; transform: rotate(-24deg) translateY(-46px); }
    14%  { opacity: 1; }
    32%  { transform: rotate(14deg); }
    48%  { transform: rotate(-9deg); }
    62%  { transform: rotate(6deg); }
    75%  { transform: rotate(-4deg); }
    87%  { transform: rotate(2deg); }
    100% { opacity: 1; transform: rotate(0); }
  }
  .fx-wobble-in { animation: bugWobbleIn 1200ms ease-out; }

  /* Rocks loose and falls off the bottom. */
  @keyframes bugWobbleOut {
    0%   { opacity: 1; transform: rotate(0) translateY(0); }
    18%  { transform: rotate(5deg); }
    36%  { transform: rotate(-8deg); }
    54%  { transform: rotate(13deg) translateY(6px); }
    72%  { opacity: 1; transform: rotate(-19deg) translateY(30px); }
    100% { opacity: 0; transform: rotate(34deg) translateY(150px); }
  }
  .fx-wobble-out { animation: bugWobbleOut 900ms cubic-bezier(0.5, 0, 0.9, 0.5) forwards; }

  /* Thrown on from off the left edge, which is the edge it lives on. If the
     bug is ever moved to the other side, this pair has to be mirrored with it
     or it will fly across the whole screen to reach a corner beside it. */
  @keyframes bugSlideIn {
    0%   { opacity: 0; transform: translateX(-180%) skewX(14deg); }
    16%  { opacity: 1; }
    58%  { transform: translateX(16%) skewX(-6deg); }
    76%  { transform: translateX(-6%) skewX(2deg); }
    90%  { transform: translateX(2%); }
    100% { opacity: 1; transform: translateX(0) skewX(0); }
  }
  .fx-slide-in { animation: bugSlideIn 900ms cubic-bezier(0.25, 1, 0.35, 1); }

  /* Winds back and leaves the same way it came. */
  @keyframes bugSlideOut {
    0%   { opacity: 1; transform: translateX(0) skewX(0); }
    26%  { transform: translateX(9%) skewX(-4deg); }
    100% { opacity: 0; transform: translateX(-190%) skewX(18deg); }
  }
  .fx-slide-out { animation: bugSlideOut 700ms cubic-bezier(0.5, 0, 0.8, 0.3) forwards; }

  /* An amber tube striking and levelling off. Same three-per-second limit as
     the flash pair above: two strikes, well apart, rather than a stutter. */
  @keyframes bugNeonIn {
    0%   { opacity: 0; filter: brightness(0.15) drop-shadow(0 0 0 rgba(255,166,43,0)); }
    18%  { opacity: 1; filter: brightness(2.8) drop-shadow(0 0 34px rgba(255,166,43,1)); }
    39%  { opacity: 0.2; filter: brightness(0.3); }
    60%  { opacity: 1; filter: brightness(2.4) drop-shadow(0 0 28px rgba(255,166,43,0.9)); }
    80%  { filter: brightness(1.3) drop-shadow(0 0 16px rgba(255,166,43,0.65)); }
    100% { opacity: 1; filter: brightness(1) var(--bug-shadow); }
  }
  .fx-neon-in { animation: bugNeonIn 1800ms ease-out; }

  /* The tube dying: one last surge, then it gutters out. */
  @keyframes bugNeonOut {
    0%   { opacity: 1; filter: brightness(1) var(--bug-shadow); }
    25%  { opacity: 1; filter: brightness(3.2) drop-shadow(0 0 40px rgba(255,166,43,1)); }
    50%  { opacity: 0.15; filter: brightness(0.2); }
    75%  { opacity: 0.9; filter: brightness(1.6) drop-shadow(0 0 18px rgba(255,166,43,0.7)); }
    100% { opacity: 0; filter: brightness(0.1); }
  }
  .fx-neon-out { animation: bugNeonOut 1400ms ease-in forwards; }

  /* ---- The idle loop ----------------------------------------------------
     What the bug does between its entrance and its exit. Without this it
     lands, sits dead still for eight seconds, then moves again, which reads
     as two separate events rather than one continuous presence.

     These are deliberately small. Anything you can consciously watch is too
     much: they are here so the corner of the screen is never quite static,
     not so anybody looks at it. Each one loops forever and MUST start and end
     on identical values, or every cycle will visibly jump.

     Adding another is the same three steps as a headline animation, with the
     name going in BUG_IDLES instead. */

  /* Light drifts across every few seconds. */
  @keyframes idleShimmer {
    0%   { background-position: 140% 0; opacity: 0; }
    6%   { opacity: 0.75; }
    30%  { background-position: -140% 0; opacity: 0.75; }
    36%  { background-position: -140% 0; opacity: 0; }
    100% { background-position: 140% 0; opacity: 0; }
  }
  .idle-shimmer #bugsheen { animation: idleShimmer 5200ms ease-in-out infinite; }

  /* Warm amber halo, in and out. */
  @keyframes idleGlow {
    0%, 100% { filter: var(--bug-shadow); }
    50%      { filter: var(--bug-shadow)
                       drop-shadow(0 0 13px rgba(255,166,43,0.75)); }
  }
  .idle-glow #bugfx img { animation: idleGlow 2600ms ease-in-out infinite; }

  /* A hard white edge that comes up and goes again. */
  @keyframes idleOutline {
    0%, 100% { filter: var(--bug-shadow); }
