<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Dock Jukebox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0c0a09;
    --amber: #ffa62b;
    --cream: #f7f1e6;
    --dim: rgba(247, 241, 230, 0.45);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--ink);
    color: var(--cream);
    font-family: Barlow, system-ui, sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }

  /* Blurred album art fills the wall behind everything, so every song
     repaints the whole screen in its own colors. */
  #backdrop {
    position: fixed;
    inset: -12%;
    background-size: cover;
    background-position: center;
    filter: blur(70px) saturate(1.5);
    opacity: 0;
    transform: scale(1.08);
    transition: opacity 1.4s ease;
  }
  #backdrop.on { opacity: 0.62; }

  #scrim {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(120% 90% at 22% 45%, rgba(0,0,0,0.15), rgba(0,0,0,0.82) 78%),
      linear-gradient(to top, rgba(0,0,0,0.9), rgba(0,0,0,0.25));
  }

  #stage {
    position: relative;
    height: 100%;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: 3.5vh 4vw;
    gap: 2vh;
  }

  .bar {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 20px;
  }
  .wordmark {
    font-family: 'Bebas Neue', system-ui, sans-serif;
    font-size: clamp(20px, 2.6vh, 34px);
    letter-spacing: 0.14em;
    color: var(--amber);
  }
  .lamp {
    font-size: clamp(12px, 1.5vh, 16px);
    color: var(--dim);
    display: flex;
    align-items: center;
    gap: 9px;
  }
  .lamp i {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #4e4741;
    display: block;
  }
  .lamp.live i {
    background: var(--amber);
    box-shadow: 0 0 12px var(--amber);
  }

  .now {
    display: grid;
    grid-template-columns: auto 1fr;
    align-items: center;
    gap: 4.5vw;
    min-height: 0;
  }

  .sleeve {
    position: relative;
    height: min(52vh, 46vw);
    width: min(52vh, 46vw);
    border-radius: 6px;
    background: rgba(255,255,255,0.05);
    box-shadow:
      0 30px 70px rgba(0,0,0,0.75),
      0 0 0 1px rgba(255,255,255,0.09) inset;
    overflow: hidden;
  }
  .sleeve img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    opacity: 0;
    transition: opacity 0.7s ease;
  }
  .sleeve img.on { opacity: 1; }

  .eyebrow {
    font-family: 'Bebas Neue', system-ui, sans-serif;
    font-size: clamp(14px, 1.9vh, 22px);
    letter-spacing: 0.28em;
    color: var(--amber);
    margin-bottom: 0.5em;
  }

  h1 {
    font-family: 'Bebas Neue', system-ui, sans-serif;
    font-weight: 400;
    font-size: clamp(42px, 11vh, 150px);
    line-height: 0.92;
    margin: 0 0 0.12em;
    text-shadow: 0 4px 40px rgba(0,0,0,0.6);
    overflow-wrap: anywhere;
  }

  .artist {
    font-size: clamp(18px, 3.4vh, 44px);
    font-weight: 500;
    color: rgba(247, 241, 230, 0.72);
    margin: 0 0 0.7em;
  }

  .credit {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: clamp(13px, 1.8vh, 20px);
    letter-spacing: 0.04em;
    padding: 0.5em 1.1em;
    border-radius: 999px;
    border: 1px solid rgba(255, 166, 43, 0.4);
    color: var(--amber);
    opacity: 0;
    transition: opacity 0.5s ease;
  }
  .credit.on { opacity: 1; }

  .track {
    margin-top: 2.2vh;
    height: 3px;
    width: min(560px, 100%);
    background: rgba(255,255,255,0.14);
    border-radius: 2px;
    overflow: hidden;
  }
  .track b {
    display: block;
    height: 100%;
    width: 0%;
    background: var(--amber);
    box-shadow: 0 0 14px rgba(255,166,43,0.7);
    transition: width 1s linear;
  }

  .queue h2 {
    font-family: 'Bebas Neue', system-ui, sans-serif;
    font-weight: 400;
    font-size: clamp(13px, 1.7vh, 19px);
    letter-spacing: 0.26em;
    color: var(--dim);
    margin: 0 0 1.1vh;
  }
  .cards {
    display: flex;
    gap: 14px;
    overflow: hidden;
  }
  .card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 16px 9px 9px;
    background: rgba(255,255,255,0.055);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 5px;
    min-width: 0;
    flex: 0 1 auto;
  }
  .card img {
    width: clamp(38px, 5.4vh, 60px);
    height: clamp(38px, 5.4vh, 60px);
    border-radius: 3px;
    object-fit: cover;
    background: rgba(255,255,255,0.08);
    flex-shrink: 0;
  }
  .card div { min-width: 0; }
  .card b {
    display: block;
    font-weight: 600;
    font-size: clamp(13px, 1.8vh, 19px);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 20vw;
  }
  .card span {
    font-size: clamp(11px, 1.4vh, 15px);
    color: var(--amber);
  }
  .idle {
    font-size: clamp(13px, 1.8vh, 19px);
    color: var(--dim);
  }

  #start {
    position: fixed;
    inset: 0;
    background: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 26px;
    z-index: 20;
    text-align: center;
    padding: 8vw;
  }
  #start .wordmark { font-size: clamp(30px, 5vh, 56px); }
  #start p { color: var(--dim); max-width: 34ch; line-height: 1.55; margin: 0; }
  #start button {
    font-family: 'Bebas Neue', system-ui, sans-serif;
    font-size: clamp(22px, 3.4vh, 34px);
    letter-spacing: 0.12em;
    padding: 0.6em 1.9em;
    background: var(--amber);
    color: var(--ink);
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }
  #start button:disabled { opacity: 0.55; }

  /* Diagnostics, off unless the URL ends in ?debug=1 */
  #debug {
    display: none;
    position: fixed;
    left: 0; right: 0; bottom: 0;
    max-height: 30vh;
    overflow: auto;
    background: #000;
    color: #7fff7f;
    font-family: ui-monospace, monospace;
    font-size: 13px;
    line-height: 1.4;
    padding: 8px 12px;
    white-space: pre-wrap;
    word-break: break-all;
    z-index: 15;
  }
  #debug.on { display: block; }
</style>
</head>
<body>

<div id="backdrop"></div>
<div id="scrim"></div>

<div id="stage">

  <div class="bar">
    <div class="wordmark">Cooney Provisions Jukebox</div>
    <div class="lamp" id="lamp"><i></i><span id="status">connecting</span></div>
  </div>

  <div class="now">
    <div class="sleeve"><img id="art" alt=""></div>
    <div>
      <div class="eyebrow" id="eyebrow">Now playing</div>
      <h1 id="title">Nothing playing</h1>
      <p class="artist" id="artist"></p>
      <div class="credit" id="credit"></div>
      <div class="track"><b id="progress"></b></div>
    </div>
  </div>

  <div class="queue">
    <h2>Up next</h2>
    <div class="cards" id="cards"><span class="idle">Nothing queued yet.</span></div>
  </div>

</div>

<div id="debug"></div>

<div id="start">
  <div class="wordmark">Cooney Provisions Jukebox</div>
  <p>Press start, then leave this open. The screen can sleep. Closing this page stops the music.</p>
  <button id="startbtn">Start the jukebox</button>
</div>

<script src="https://js-cdn.music.apple.com/musickit/v3/musickit.js" data-web-components async></script>
<script>
// ---------------------------------------------------------------------------
// Settings
// ---------------------------------------------------------------------------

const API_URL = "https://script.google.com/a/macros/cooneyprovisions.com/s/AKfycbyBomjJGeAilm-QU3yqDdWED7wSV59ej3teTlcaCcpNCp-EcTKjZ3p3xA7CHNpU_pBq/exec";

// Developer token from make_music_token.py. Expires March 6, 2027.
const DEVELOPER_TOKEN = "eyJhbGciOiJFUzI1NiIsImtpZCI6IkMyTTZYTTU5OEIiLCJ0eXAiOiJKV1QifQ.eyJpc3MiOiJVOTY4TVdaSjhUIiwiaWF0IjoxNzg4NTY5OTIyLCJleHAiOjE4MDQzNDY5MjJ9.gO46sv13ANw3wBn7jodVOBEKpjgfdUEpWfvpCV254YFTbX-_TPYbxJTxo2XVFEYAZdyu_Obm8girpiJvTBal3g";

// Apple Music playlist that fills the silence when nobody has requested
// anything. Open a playlist on music.apple.com and copy the pl.xxxx from the
// URL. Leave blank for silence between requests.
const HOUSE_PLAYLIST = "";

// How often to check the queue, in milliseconds.
const POLL_MS = 4000;

// How long to wait for a song to actually start before giving up on it.
const START_TIMEOUT_MS = 20000;

// ---------------------------------------------------------------------------

let music = null;
let currentQueueId = null;
let heardItPlaying = false;
let startedAt = 0;
let playbackError = null;

const el = id => document.getElementById(id);

if (location.search.indexOf("debug=1") !== -1) {
  el("debug").classList.add("on");
}

function setStatus(text, live) {
  el("status").textContent = text;
  el("lamp").classList.toggle("live", !!live);
}

/** Prints one line to the diagnostics strip. Hidden unless ?debug=1. */
function debugLine(text) {
  const box = el("debug");
  box.textContent = new Date().toLocaleTimeString() + "  " + text + "\n"
    + box.textContent.split("\n").slice(0, 11).join("\n");
}

/** Calls the Apps Script API. Returns the parsed response, or null on failure. */
async function api(action, params) {
  const url = new URL(API_URL);
  url.searchParams.set("action", action);
  Object.entries(params || {}).forEach(([k, v]) => url.searchParams.set(k, v));

  // Browsers cache repeated GETs to the same address. Without this the player
  // replays the first answer forever and never sees a new request.
  url.searchParams.set("nocache", Date.now() + "" + Math.random());

  try {
    const response = await fetch(url, { cache: "no-store" });
    const body = await response.text();
    debugLine(action + " -> HTTP " + response.status + " " + body.slice(0, 400));
    return JSON.parse(body);
  } catch (error) {
    debugLine(action + " -> FAILED " + error.message);
    setStatus("cannot reach the queue");
    return null;
  }
}

/** Looks up album art for a song. The queue sheet does not store artwork. */
async function artworkFor(songId) {
  try {
    const response = await fetch(
      "https://api.music.apple.com/v1/catalog/us/songs/" + songId,
      { headers: { Authorization: "Bearer " + DEVELOPER_TOKEN } }
    );
    const data = await response.json();
    return data.data[0].attributes.artwork.url;
  } catch (error) {
    return null;
  }
}

/** Turns Apple's artwork template into a real URL at the size we want. */
function sized(template, pixels) {
  if (!template) return null;
  return template.replace("{w}", pixels).replace("{h}", pixels);
}


// ---------------------------------------------------------------------------
// Startup
// ---------------------------------------------------------------------------

document.addEventListener("musickitloaded", async () => {
  music = await MusicKit.configure({
    developerToken: DEVELOPER_TOKEN,
    app: { name: "Dock Jukebox", build: "1.0.0" }
  });

  // The start button is never skipped, even when already signed in. Pressing it
  // is what gives the browser permission to play audio later on a timer.
  setStatus("ready to start");
});

el("startbtn").addEventListener("click", async () => {
  el("startbtn").disabled = true;
  el("startbtn").textContent = "Starting";

  if (!music.isAuthorized) {
    await music.authorize();
  }

  await unlockAudio();
  el("start").style.display = "none";
  begin();
});

/**
 * Browsers refuse to start audio unless a person clicked something. Songs get
 * started later by a timer, which does not count, so we play one track silently
 * during the button press to open the gate for everything after it.
 */
async function unlockAudio() {
  try {
    music.volume = 0;
    await music.setQueue({ song: "251002253", startPlaying: true });
    await new Promise(resolve => setTimeout(resolve, 400));
    music.stop();
  } catch (error) {
    debugLine("unlock failed: " + error.message);
  } finally {
    music.volume = 1;
  }
}

function begin() {
  setStatus("waiting for requests", true);
  tick();
  setInterval(tick, POLL_MS);
  setInterval(paintProgress, 1000);
}


// ---------------------------------------------------------------------------
// The player loop
// ---------------------------------------------------------------------------

async function tick() {
  const state = await api("getQueue");
  if (!state || !state.ok) return;

  if (currentQueueId) {
    if (music.isPlaying) {
      // Once we have actually heard it, silence later means it ended.
      heardItPlaying = true;
    } else if (heardItPlaying) {
      await api("markPlayed", { queueId: currentQueueId });
      currentQueueId = null;
    } else if (Date.now() - startedAt > START_TIMEOUT_MS) {
      await api("markPlayed", { queueId: currentQueueId });
      currentQueueId = null;
      setStatus("a track would not start");
    }
  }

  // The office skipped it out from under us.
  if (currentQueueId && !state.playing) {
    currentQueueId = null;
    music.stop();
  }

  if (!currentQueueId && state.waiting.length > 0) {
    await playRequest(state.waiting[0]);
  } else if (!currentQueueId && !music.isPlaying) {
    await playHouse();
  }

  paintQueue(state.waiting);
}

/** Plays one requested song and tells the sheet it started. */
async function playRequest(item) {
  currentQueueId = item.QueueID;
  heardItPlaying = false;
  startedAt = Date.now();
  playbackError = null;
  await api("markPlaying", { queueId: item.QueueID });

  try {
    // Google Sheets hands back numeric IDs as numbers. MusicKit only accepts
    // strings and fails with "could not be resolved" on anything else.
    const songId = String(item.SongID).trim();
    await music.setQueue({ song: songId, startPlaying: true });

    paintNowPlaying(item.Title, item.Artist, item.RequestedBy);
    paintArtwork(sized(await artworkFor(songId), 900));
    setStatus("playing a request", true);
  } catch (error) {
    playbackError = error && error.message ? error.message : String(error);
    debugLine("PLAYBACK FAILED: " + playbackError);
    await api("markPlayed", { queueId: item.QueueID });
    currentQueueId = null;
    setStatus("could not play: " + playbackError);
  }
}

/** Falls back to the house playlist so the dock is never silent. */
async function playHouse() {
  if (!HOUSE_PLAYLIST) {
    paintNowPlaying("Nothing playing", "", "");
    paintArtwork(null);
    if (!playbackError) {
      setStatus("waiting for requests", true);
    }
    return;
  }

  try {
    await music.setQueue({ playlist: HOUSE_PLAYLIST, startPlaying: true });
    setStatus("house playlist", true);
  } catch (error) {
    setStatus("house playlist would not load");
  }
}


// ---------------------------------------------------------------------------
// Painting the screen
// ---------------------------------------------------------------------------

function paintNowPlaying(title, artist, by) {
  el("title").textContent = title;
  el("artist").textContent = artist || "";
  el("eyebrow").style.visibility = artist ? "visible" : "hidden";

  const credit = el("credit");
  credit.textContent = by ? "Requested by " + by : "";
  credit.classList.toggle("on", !!by);
}

function paintArtwork(url) {
  const art = el("art");
  const backdrop = el("backdrop");

  if (!url) {
    art.classList.remove("on");
    backdrop.classList.remove("on");
    return;
  }

  art.classList.remove("on");
  const preload = new Image();
  preload.onload = () => {
    art.src = url;
    art.classList.add("on");
    backdrop.style.backgroundImage = 'url("' + url + '")';
    backdrop.classList.add("on");
  };
  preload.src = url;
}

function paintProgress() {
  if (!music) return;
  const total = music.currentPlaybackDuration;
  const at = music.currentPlaybackTime;
  const percent = total > 0 ? Math.min(100, (at / total) * 100) : 0;
  el("progress").style.width = percent + "%";
}

function paintQueue(waiting) {
  const cards = el("cards");
  const upcoming = waiting.slice(1, 5);

  if (upcoming.length === 0) {
    cards.innerHTML = '<span class="idle">Nothing queued yet.</span>';
    return;
  }

  cards.innerHTML = "";
  upcoming.forEach(item => {
    const card = document.createElement("div");
    card.className = "card";

    const img = document.createElement("img");
    artworkFor(String(item.SongID).trim()).then(template => {
      const url = sized(template, 160);
      if (url) img.src = url;
    });

    const text = document.createElement("div");
    const name = document.createElement("b");
    name.textContent = item.Title;
    const who = document.createElement("span");
    who.textContent = item.RequestedBy;
    text.append(name, who);

    card.append(img, text);
    cards.appendChild(card);
  });
}

// Keep the display honest when Apple advances a playlist on its own.
setInterval(async () => {
  if (music && music.isPlaying && !currentQueueId && music.nowPlayingItem) {
    const item = music.nowPlayingItem;
    paintNowPlaying(item.title, item.artistName, "");
    if (item.id) paintArtwork(sized(await artworkFor(item.id), 900));
  }
}, 5000);
</script>

</body>
</html>
