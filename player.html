// isPlaying when they finish, so waiting for that alone stalls the queue.
let trackFinished = false;

// True once the jukebox is actually running, so the automatic path and the
// button cannot both start it.
let live = false;

// Whether this run began without anybody pressing anything, and how many songs
// in a row have failed to start since. Together they are what lets the page
// take back an automatic start that turned out to be wrong.
let startedAutomatically = false;
let deadStarts = 0;

// The track played silently during the Start press to open the gate for
// everything that follows. Any song works. It is never heard: the volume is
// zero and it is stopped after four tenths of a second.
const UNLOCK_SONG = "251002253";

// Six hundredths of a second of true silence, as a WAV.
//
// THIS IS NOT THE SAME TRICK AS UNLOCK_SONG AND THE DIFFERENCE MATTERS.
// Browsers allow inaudible media to start on its own and refuse audible media.
// Playing something at volume zero therefore proves nothing: it succeeds on
// every browser, including the ones that will refuse the very next song at
// full volume. That is exactly how the jukebox came up, hid its own Start
// button, and then failed to play anything.
//
// This clip has a real audio track and is played unmuted at full volume, so
// the autoplay policy treats it as audible and answers the question honestly.
// Every sample in it is silence, so nothing comes out of the speakers.
const SILENT_CLIP = "data:audio/wav;base64,UklGRgQCAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YeABAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgIA=";

// The YouTube fallback player. Built once at page load, reused for every video.
let ytPlayer = null;
let ytApiReady = false;
let onYouTube = false;

// The clean-content word list. It lives in Jukebox.gs and arrives with every
// queue answer, so there is only ever one copy of it to maintain.
let bannedWords = [];

// The house rotation is driven one track at a time rather than handed to Apple
// as a playlist, so that station tracks get videos and the explicit filter in
// exactly the same way requested songs do.
let houseTrack = null;
let houseQueue = [];
let houseStationName = "";

const el = id => document.getElementById(id);

if (location.search.indexOf("debug=1") !== -1) {
  el("debug").classList.add("on");
}

function setStatus(text, live) {
  el("status").textContent = text;
  el("lamp").classList.toggle("live", !!live);
}

/** Prints one line to the diagnostics strip. Hidden unless ?debug=1. */
function debugLine(text) {
  const box = el("debug");
  box.textContent = new Date().toLocaleTimeString() + "  " + text + "\n"
    + box.textContent.split("\n").slice(0, 11).join("\n");
}

/** Calls the Apps Script API. Returns the parsed response, or null on failure. */
async function api(action, params) {
  const url = new URL(API_URL);
  url.searchParams.set("action", action);
  Object.entries(params || {}).forEach(([k, v]) => url.searchParams.set(k, v));

  // Browsers cache repeated GETs to the same address. Without this the player
  // replays the first answer forever and never sees a new request.
  url.searchParams.set("nocache", Date.now() + "" + Math.random());

  try {
    const response = await fetch(url, { cache: "no-store" });
    const body = await response.text();
    debugLine(action + " -> HTTP " + response.status + " " + safeToShow(body));
    return JSON.parse(body);
  } catch (error) {
    debugLine(action + " -> FAILED " + error.message);
    setStatus("cannot reach the queue");
    return null;
  }
}


/**
 * Trims an API response for the diagnostics strip and takes the banned word
 * list out of it.
 *
 * That list arrives with every single queue answer, so without this the strip
 * is a wall of slurs on a screen wired to the warehouse wall. The words still
 * do their job, they are just never drawn.
 */
function safeToShow(body) {
  return String(body)
    .replace(/"banned":\[[^\]]*\]/g, '"banned":[filtered word list]')
    .slice(0, 400);
}

/**
 * Finds this device's public address. Everyone on the shop WiFi shares one.
 * Forced to IPv4 so the player and the phones are always comparing like for
 * like. Falls back to Cloudflare if ipify is unreachable.
 */
async function publicAddress() {
  try {
    const response = await fetch("https://api.ipify.org?format=json");
    const data = await response.json();
    if (data.ip) return data.ip;
  } catch (error) {
    // Fall through to the backup.
  }

  try {
    const response = await fetch("https://www.cloudflare.com/cdn-cgi/trace");
    const text = await response.text();
    const line = text.split("\n").filter(row => row.indexOf("ip=") === 0)[0];
    if (line) return line.slice(3).trim();
  } catch (error) {
    // No address available.
  }

  return null;
}

/**
 * Finds the official music video for a queued song, or null if Apple does not
 * have one. Matches on artist so a cover version does not sneak in, and skips
 * anything explicit for the same reason the audio side does.
 */
// Apple video lookups are memoised. The house rotation screens tracks by
// asking for their video before deciding to play them, and without this every
// track would be searched twice: once to screen it, once to play it.
const appleVideoMemo = new Map();

async function musicVideoFor(title, artist) {
  const key = title + "|" + artist;
  if (appleVideoMemo.has(key)) return appleVideoMemo.get(key);

  const found = await findMusicVideo(title, artist);
  appleVideoMemo.set(key, found);
  return found;
}


async function findMusicVideo(title, artist) {
  try {
    const response = await music.api.music("/v1/catalog/us/search", {
      term: title + " " + artist,
      types: ["music-videos"],
      limit: 8
    });

    const found = response.data.results["music-videos"];
    if (!found) return null;

    const song = bareTitle(title);

    const match = found.data.filter(video => {
      if (video.attributes.contentRating === "explicit") return false;

      // Both checks are needed. The artist check alone was the original bug:
      // a search for one song returns the band's whole video catalog, every
      // one of them passes an artist-only test, and the first is whatever
      // Apple ranks highest. That is how a request for Cats in the Cradle
      // played I Hate Everything About You.
      if (!sameArtist(video.attributes.artistName, artist)) return false;
      return mentions(video.attributes.name, song);
    })[0];

    return match || null;
  } catch (error) {
    return null;
  }
}


/**
 * Strips the bracketed extras Apple hangs off song titles, so a track called
 * "Daughter (Remastered)" still matches a video called plainly "Daughter".
 */
function bareTitle(title) {
  return String(title || "").replace(/[\(\[][^\)\]]*[\)\]]/g, " ").trim();
}


// ---------------------------------------------------------------------------
// The YouTube fallback
//
// Apple stays in charge of everything: drivers search Apple's catalog, Apple's
// explicit flag filters the results, and Apple supplies the title and artist.
// Only when Apple has no video does any of this run, and it runs against that
// already-vetted title and artist rather than an open search box.
// ---------------------------------------------------------------------------

/**
 * Finds an official music video on YouTube for a song Apple has no video for.
 * Returns a video ID, or null when nothing survives the checks below.
 *
 * Google allows roughly 100 searches per project per day, so every answer is
 * remembered, including the answer "there isn't one". No song is looked up
 * twice, which keeps a busy Friday well inside the allowance.
 */
async function youtubeVideoFor(songId, title, artist, durationMs) {
  if (!YOUTUBE_KEY) return null;

  // A hand-pinned answer beats everything, and costs no quota.
  if (Object.prototype.hasOwnProperty.call(VIDEO_OVERRIDES, songId)) {
    const pinned = VIDEO_OVERRIDES[songId];
    debugLine("youtube: pinned by hand, " + (pinned || "audio only"));
    return pinned || null;
  }

  const remembered = rememberedVideo(songId);
  if (remembered !== undefined) {
    debugLine("youtube: remembered " + (remembered || "nothing suitable"));
    return remembered;
  }

  try {
    const found = await youtubeSearch(title + " " + artist + " official video");
    const chosen = await pickVideo(found, title, artist, durationMs);

    rememberVideo(songId, chosen);
    debugLine("youtube: " + (chosen || "nothing suitable"));
    return chosen;
  } catch (error) {
    debugLine("youtube lookup failed: " + (error.message || error));
    return null;
  }
}


/**
 * The expensive call, at 100 quota units. videoEmbeddable=true asks Google to
 * leave out anything that cannot be played off YouTube, which is most of what
 * would otherwise come back as a dead frame.
 */
async function youtubeSearch(term) {
  const url = "https://www.googleapis.com/youtube/v3/search"
    + "?part=snippet&type=video&videoEmbeddable=true&maxResults=8"
    + "&q=" + encodeURIComponent(term)
    + "&key=" + YOUTUBE_KEY;

  const response = await fetch(url);
  const data = await response.json();

  if (data.error) throw new Error(data.error.message);
  return data.items || [];
}


/** The cheap call, at one unit for the whole batch however many parts we ask for. */
async function youtubeDetails(ids) {
  const url = "https://www.googleapis.com/youtube/v3/videos"
    + "?part=snippet,contentDetails,status,statistics"
    + "&id=" + ids
    + "&key=" + YOUTUBE_KEY;

  const response = await fetch(url);
  const data = await response.json();

  if (data.error) throw new Error(data.error.message);
  return data.items || [];
}


/**
 * Picks the best candidate rather than the first acceptable one.
 *
 * This runs in two passes. The first throws out anything that must never play:
 * covers, karaoke, hour-long uploads, and YouTube's auto-generated "- Topic"
 * channels, which are album audio sitting behind a still of the album cover.
 * The second ranks whatever is left and takes the winner.
 *
 * Ranking rather than requiring an official channel matters for older catalog.
 * Plenty of pre-2000 videos were never uploaded by the label at all, and the
 * only copy that exists is a fan rip. Demanding an official channel there does
 * not get the official video, it just guarantees the album cover wins.
 */
async function pickVideo(candidates, title, artist, durationMs) {
  if (candidates.length === 0) return null;

  const ids = candidates.map(item => item.id.videoId).join(",");
  const details = await youtubeDetails(ids);

  // A video may run longer than the track for an intro or an outro, but not by
  // several minutes. Without a length from Apple, allow up to fifteen minutes,
  // which is generous enough for Thriller and mean enough for a mixtape.
  const songSeconds = Math.round((durationMs || 0) / 1000);
  const ceiling = songSeconds ? (songSeconds * 2) + 120 : 900;

  let best = null;
  let bestScore = 0;

  for (let i = 0; i < details.length; i++) {
    const video = details[i];
    const name = video.snippet.title;
    const channel = video.snippet.channelTitle;
    const seconds = secondsFrom(video.contentDetails.duration);

    if (!video.status.embeddable) continue;
    if (isTopicChannel(channel)) continue;
    if (isFoul(name)) continue;
    if (looksWrong(name)) continue;
    if (seconds > ceiling) continue;

    // The title has to actually name the song, and the artist has to appear
    // somewhere, either in the title or in the channel. That is what keeps a
    // stranger's unrelated upload out without demanding an official channel.
    if (!mentions(name, bareTitle(title))) continue;
    if (!mentions(name, artist) && !sameArtist(channel, artist)) continue;

    // Proof that this IS the official video, rather than merely the absence of
    // anything suspicious. Plenty of songs never had a video, and for those
    // YouTube still offers a well-made fan edit with the right song, the right
    // length and the artist in the title, which passes every check above.
    // Fade to Black is the worked example: no official video was ever made,
    // and the search returns somebody's cut of Saving Private Ryan.
    //
    // Songs that fail this play as audio, which is the intended behaviour.
    // Genuine official videos that only exist as fan uploads go in
    // VIDEO_OVERRIDES at the top of this file.
    if (!sameArtist(channel, artist) && !saysOfficial(name)) continue;

    const score = scoreVideo(video, artist, seconds, songSeconds);
    if (score > bestScore) {
      bestScore = score;
      best = video.id;
    }
  }

  return best;
}


/**
 * Ranks a surviving candidate. The artist's own channel wins when it exists,
 * a title that says official video is worth a lot, and a length that matches
 * Apple's to the second is the strongest sign it is the real thing. View count
 * only breaks ties between otherwise equal candidates.
 */
function scoreVideo(video, artist, seconds, songSeconds) {
  const name = String(video.snippet.title).toLowerCase();
  const channel = video.snippet.channelTitle;
  let score = 1;

  // The artist's own channel, or their Vevo one, beats everything else.
  if (sameArtist(channel, artist)) score += 60;

  if (name.indexOf("official video") !== -1
      || name.indexOf("official music video") !== -1) {
    score += 25;
  }

  if (songSeconds) {
    const off = Math.abs(seconds - songSeconds);
    if (off <= 20) score += 30;
    else if (off <= 60) score += 15;
  }

  const views = Number((video.statistics || {}).viewCount || 0);
  if (views > 0) score += Math.min(30, Math.log10(views) * 4);

  return score;
}


/**
 * True for YouTube's auto-generated artist channels, which are named
 * "Artist - Topic" and host album audio behind a still of the cover art.
 * They match the artist name exactly, so they have to be named and excluded.
 */
function isTopicChannel(channel) {
  return / - topic$/.test(String(channel || "").toLowerCase().trim());
}


/**
 * True when the title claims to be the official video. Uploaders who are
 * posting the real thing say so; people posting their own edit generally do
 * not, because saying it invites a takedown.
 */
function saysOfficial(title) {
  const lower = String(title || "").toLowerCase();
  return lower.indexOf("official video") !== -1
    || lower.indexOf("official music video") !== -1
    || lower.indexOf("official promo") !== -1;
}


/** True when a video title names the thing we are looking for. */
function mentions(haystack, needle) {
  const inside = squash(haystack);
  const wanted = squash(needle);
  return wanted.length > 0 && inside.indexOf(wanted) !== -1;
}


/**
 * True when a YouTube channel belongs to the artist. Squashing both names
 * down is what lets "The Dead Milkmen" match a channel called
 * "DeadMilkmenVEVO".
 */
function sameArtist(channel, artist) {
  const theirs = squash(channel);
  const wanted = squash(artist);
  if (!theirs || !wanted) return false;
  return theirs.indexOf(wanted) !== -1 || wanted.indexOf(theirs) !== -1;
}


/** Lowercases a name and strips VEVO, a leading "the", spaces and punctuation. */
function squash(text) {
  return String(text || "")
    .toLowerCase()
    .replace(/vevo/g, "")
    .replace(/^the /, "")
    .replace(/[^a-z0-9]/g, "");
}


/** True when text contains something that cannot go over the dock speakers. */
function isFoul(text) {
  const haystack = " " + String(text || "").toLowerCase() + " ";
  return bannedWords.some(word => haystack.indexOf(word) !== -1);
}


/** True when the title says this is a cover, a live take, or an hour of it. */
function looksWrong(title) {
  const lower = String(title || "").toLowerCase();
  return NOT_THE_VIDEO.some(word => lower.indexOf(word) !== -1);
}


/** Turns YouTube's PT4M13S duration into plain seconds. */
function secondsFrom(iso) {
  const parts = String(iso || "").match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
  if (!parts) return 0;

  return (Number(parts[1] || 0) * 3600)
    + (Number(parts[2] || 0) * 60)
    + Number(parts[3] || 0);
}


/**
 * What YouTube said about a song last time. Returns undefined when the song
 * has never been looked up, and null when it was looked up and nothing was
 * worth playing, so a fruitless search is never repeated either.
 *
 * The number in the key is the version of the picking rules. Raise it whenever
 * those rules change and every remembered answer is quietly thrown away, so a
 * song that was matched badly gets a second chance under the new rules.
 */
const PICKER_VERSION = 3;

function rememberedVideo(songId) {
  try {
    const stored = localStorage.getItem("yt" + PICKER_VERSION + ":" + songId);
    if (stored === null) return undefined;
    return stored === "none" ? null : stored;
  } catch (error) {
    return undefined;
  }
}


function rememberVideo(songId, videoId) {
  try {
    localStorage.setItem("yt" + PICKER_VERSION + ":" + songId, videoId || "none");
  } catch (error) {
    // A full or disabled store only means the song gets looked up again.
  }
}


// YouTube error codes that mean this video is never coming back: a bad ID, a
// deleted or private video, and embedding switched off by the owner. Code 5 is
// left out on purpose. It is the player failing rather than the video being
// gone, and forgetting on it would spend a search from a small daily allowance
// on a video that is still perfectly fine.
const GONE_FOR_GOOD = [2, 100, 101, 150];


/**
 * Throws away a remembered video that has since been deleted or locked down.
 *
 * Fan uploads are the only copy of plenty of older videos, and those channels
 * disappear. Without this the dead ID would be remembered forever and every
 * future request for the song would stall on a failed load before dropping to
 * audio. Forgetting it means the next request quietly finds a live one.
 */
function forgetIfGone(songId, errorCode) {
  if (!songId) return;
  if (GONE_FOR_GOOD.indexOf(errorCode) === -1) return;

  try {
    localStorage.removeItem("yt" + PICKER_VERSION + ":" + songId);
    debugLine("forgot the dead video for this song, will look again next time");
  } catch (error) {
    // Nothing to do. The worst case is it gets looked up again anyway.
  }
}


// The YouTube API calls this by name once it has finished loading.
function onYouTubeIframeAPIReady() {
  ytApiReady = true;
  buildYouTubePlayer();
  debugLine("youtube player ready");
}


/**
 * Builds the one YouTube player this page will ever use, silent and hidden,
 * as soon as the API is available.
 *
 * WHY IT IS BUILT HERE AND NOT WHEN THE FIRST VIDEO IS NEEDED.
 * A cross-origin iframe is only allowed to make noise if it was already in the
 * page the last time somebody touched the screen. Building it on demand meant
 * it appeared seconds after the Start press, inherited nothing, and parked on
 * the poster frame waiting for a tap. That is fine on a Mac, where the rule is
 * looser, and useless on the iPad, which is the only machine that matters.
 * Built here, it is present for the Start press and may play on a timer for
 * the rest of the session.
 */
function buildYouTubePlayer() {
  if (ytPlayer) return;

  ytPlayer = new YT.Player("ytmount", {
    videoId: YT_UNLOCK_VIDEO,
    playerVars: { autoplay: 0, playsinline: 1, rel: 0, controls: 0 },
    events: {
      onStateChange: event => {
        // onYouTube is what separates a real song from the parked video and
        // from the silent unlock. Without it the unlock would look like a
        // song ending and the jukebox would skip its own first request.
        if (event.data === YT.PlayerState.ENDED
            && onYouTube
            && (currentQueueId || houseTrack)) {
          trackFinished = true;
          debugLine("youtube video finished, advancing");
        }
      },
      onError: event => {
        if (!onYouTube) {
          debugLine("youtube parked video is dead, change YT_UNLOCK_VIDEO");
          return;
        }
        debugLine("youtube error " + event.data + ", playing the audio instead");
        forgetIfGone(currentSongId, event.data);
        fallBackToAudio();
      }
    }
  });
}


/**
 * Opens the gate for YouTube sound. Called during the Start press, next to
 * unlockAudio, which does the same job for Apple.
 *
 * The parked video is played muted for a moment and stopped. The video is not
 * the point. The point is that the play command goes out while the browser
 * still counts a finger as having just touched the screen.
 */
async function unlockYouTube() {
  if (!ytPlayer || !ytPlayer.playVideo) {
    debugLine("youtube not ready at start, the first video may need a tap");
    return;
  }

  // Shown, because a hidden frame is allowed to refuse to play. The Start
  // screen is still up and covers all of this.
  el("videostage").classList.add("on");
  el("ytframe").classList.add("on");

  try {
    ytPlayer.mute();
    ytPlayer.playVideo();
    await new Promise(resolve => setTimeout(resolve, 600));
    ytPlayer.stopVideo();
  } catch (error) {
    debugLine("youtube unlock failed: " + error.message);
  } finally {
    ytPlayer.unMute();
    ytPlayer.setVolume(100);
    el("ytframe").classList.remove("on");
    el("videostage").classList.remove("on");
  }
}


/** Puts a YouTube video on the stage and reports back when it ends. */
function playYouTube(videoId) {
  onYouTube = true;
  el("ytframe").classList.add("on");

  // Normally already built at page load. This covers the API arriving late.
  if (!ytPlayer) buildYouTubePlayer();

  if (!ytPlayer || !ytPlayer.loadVideoById) {
    debugLine("youtube player unavailable, playing the audio instead");
    fallBackToAudio();
    return;
  }

  ytPlayer.loadVideoById(videoId);
  ytPlayer.unMute();
  ytPlayer.setVolume(100);
  ytPlayer.playVideo();
}


/** Takes the YouTube player off the stage and silences it. */
function stopYouTube() {
  onYouTube = false;
  el("ytframe").classList.remove("on");
  if (ytPlayer && ytPlayer.stopVideo) ytPlayer.stopVideo();
}


/**
 * Used when a YouTube video fails after we have already committed to it.
 * The driver still hears their song, just without the picture.
 */
async function fallBackToAudio() {
  stopYouTube();
  showVideoStage(false);

  if (!currentSongId) return;

  try {
    await music.setQueue({ song: currentSongId, startPlaying: true });
    setStatus("video would not play, playing the track", true);
  } catch (error) {
    trackFinished = true;
  }
}


/**
 * MusicKit builds its video element wherever it likes, sometimes inside a
 * shadow root, and tears it down between songs. This hunts the whole page for
 * it, drags it into our box, and forces it visible.
 */
function attachScreen() {
  music.videoContainerElement = el("screen");

  const video = findVideoElement(document);
  if (!video) return false;

  // Moving it around the page is fragile. Instead, pin the element itself over
  // the whole screen wherever MusicKit decided to put it.
  video.style.cssText = [
    "position: fixed",
    "left: 0",
    "top: 0",
    "width: 100vw",
    "height: 100vh",
    "object-fit: contain",
    "background: #000",
    "z-index: 7",
    "display: block",
    "visibility: visible",
    "opacity: 1"
  ].join(" !important;") + " !important;";

  video.removeAttribute("hidden");
  video.setAttribute("playsinline", "");

  if (!video.dataset.jukeboxFound) {
    video.dataset.jukeboxFound = "1";
    const parent = video.parentElement;
    debugLine("video element found inside <"
      + (parent ? parent.tagName.toLowerCase() : "none")
      + (parent && parent.id ? " id=" + parent.id : "") + ">");
  }

  return true;
}

/** Depth-first search for a video element, shadow roots included. */
function findVideoElement(root) {
  const direct = root.querySelector ? root.querySelector("video") : null;
  if (direct) return direct;

  const all = root.querySelectorAll ? root.querySelectorAll("*") : [];
  for (const node of all) {
    if (node.shadowRoot) {
      const found = findVideoElement(node.shadowRoot);
      if (found) return found;
    }
  }
  return null;
}

/**
 * Keeps looking for a few seconds after a video starts, because MusicKit does
 * not create the element until the stream is actually ready.
 */
function chaseVideoElement() {
  let tries = 0;
  const hunt = setInterval(() => {
    tries++;
    if (attachScreen() || tries > 24) {
      clearInterval(hunt);
      if (tries > 24) {
        debugLine("never found a video element after 12s");
      }
    }
  }, 500);
}


/** Gets the leftover video element out of the way for an audio-only song. */
function hideVideoElement() {
  const video = findVideoElement(document);
  if (video) video.style.display = "none";
}


// Cancels pending lower-third timers when a new song starts before the old
// card has finished its run, which would otherwise leave timers racing.
let titleTimers = [];

function clearTitleTimers() {
  titleTimers.forEach(clearTimeout);
  titleTimers = [];
}

function showVideoStage(on, title, artist, by, album, label, dedication) {
  el("videostage").classList.toggle("on", on);

  clearTitleTimers();
  el("vcard").classList.remove("up");
  hideBug();

  if (!on) return;

  el("vartist").textContent = artist || "";
  el("vtitle").textContent = title || "";
  el("valbum").textContent = album || "";
  el("vlabel").textContent = label || "";
  el("vcredit").textContent = by ? "Requested by " + by : "";

  // Already cleaned and length-capped by the API. textContent rather than
  // innerHTML so a message can never be markup.
  el("vdedication").textContent = dedication || "";

  // In a few seconds after the video starts, hold, then out. Nothing takes its
  // place, so the picture is clean for the rest of the song.
  titleTimers.push(setTimeout(() => {
    el("vcard").classList.add("up");
  }, TITLE_DELAY_SECONDS * 1000));

  titleTimers.push(setTimeout(() => {
    el("vcard").classList.remove("up");
  }, (TITLE_DELAY_SECONDS + TITLE_SECONDS) * 1000));

  scheduleBug();
}


/**
 * Lays out every appearance of the network bug for this song in one go.
 *
 * The timers go into titleTimers deliberately: showVideoStage already clears
 * that list on every song change, so the bug inherits the same cancellation
 * and there is only one place to get it wrong.
 */
function scheduleBug() {
  const runFor = BUG_MAX_MINUTES * 60;

  for (let at = BUG_DELAY_SECONDS; at < runFor; at += BUG_EVERY_SECONDS) {
    const settle = at + BUG_HEADLINE_SECONDS;
    const exit = at + BUG_SECONDS - BUG_HEADLINE_SECONDS;

    titleTimers.push(setTimeout(showBug, at * 1000));
    titleTimers.push(setTimeout(startIdle, settle * 1000));
    titleTimers.push(setTimeout(playExitHeadline, exit * 1000));

    // A backstop, not the normal path. The exit animation finishing is what
    // normally takes the bug off. If that event never arrives, because the
    // animation was interrupted or the tab was in the background, this stops
    // the logo sitting on screen for the rest of the song.
    titleTimers.push(setTimeout(hideBug, (at + BUG_SECONDS + 0.5) * 1000));
  }
}


// What ran last time, so the next appearance is never a repeat. Held across
// songs on purpose: two appearances in a row look identical to whoever is
// watching, whether or not a song changed in between.
let lastPair = null;
let lastIdle = "";

// The pair chosen for the appearance currently on screen. Kept because the
// departure has to be the partner of the arrival, not a fresh pick.
let thisPair = BUG_ANIMATIONS[0];

// True while the headline now running is the exit one, which is what tells the
// animationend handler below that the bug should go when it finishes.
let cutWhenHeadlineEnds = false;

// The animationend handler is attached once, the first time the bug is used.
let bugListening = false;


// ---------------------------------------------------------------------------
// Birthdays and work anniversaries
//
// The identity map already carries both, so nobody maintains a second list and
// nobody has to remember to post anything. A driver's twentieth year comes up
// on the dock TV because the office typed his start date once in 2005.
//
// The card plays BETWEEN songs, never over one. Interrupting somebody's
// request to announce a birthday is how a nice feature becomes an annoying
// one, and the gap between tracks was doing nothing anyway.
// ---------------------------------------------------------------------------

// How long the card holds, and how often the list is refreshed. The refresh
// exists so a player left running for weeks notices the date changing without
// anybody reloading it.
const CELEBRATE_SECONDS = 7;
const CELEBRATE_REFRESH_MS = 60 * 60 * 1000;

// Today's people, and which of them has already been shown. Everyone gets one
// card per song gap rather than all of them at once, so three birthdays on one
// day is three moments across the morning instead of a wall of names.
let celebrations = [];
let celebrateNext = 0;
let celebrateShownFor = "";


/** Asks the API whose day it is, and starts again when the date rolls over. */
async function loadCelebrations() {
  try {
    const answer = await api("getCelebrations", {});
    if (!answer.ok) return;

    if (answer.date !== celebrateShownFor) {
      celebrateShownFor = answer.date;
      celebrateNext = 0;
    }

    celebrations = answer.celebrations || [];

    if (celebrations.length) {
      debugLine("celebrations today: "
        + celebrations.map(c => c.name + " " + c.kind).join(", "));
    }
  } catch (error) {
    // A missing celebration is not worth a gap in the music.
  }
}


/**
 * Plays one celebration card, if anybody is owed one.
 *
 * Returns how long the caller should wait before starting the next song, so
 * playback pauses for exactly as long as the card is up and not a moment more.
 * Returns 0 when there is nothing to show, which is most days.
 */
function playCelebration() {
  if (!celebrations.length) return 0;

  const who = celebrations[celebrateNext % celebrations.length];
  celebrateNext++;

  const card = el("celebrate");

  el("celebkicker").textContent = who.kind === "birthday"
    ? "HAPPY BIRTHDAY"
    : "CELEBRATING";
  el("celebwho").textContent = who.name;

  // Years only where the identity map actually had a start year, and never for
  // a birthday. Nobody's age goes on a television.
  el("celebyears").textContent =
    (who.kind === "anniversary" && who.years > 0)
      ? (who.years === 1 ? "1 YEAR WITH COONEY PROVISIONS"
                         : who.years + " YEARS WITH COONEY PROVISIONS")
      : "";

  // Restart the animations. Same reflow trick as the bug: without it a second
  // card reuses the finished ones and appears with no entrance at all.
  card.classList.remove("on");
  void card.offsetWidth;
  card.classList.add("on");

  setTimeout(() => card.classList.remove("on"), CELEBRATE_SECONDS * 1000);

  return CELEBRATE_SECONDS * 1000;
}


/**
 * Fades the bug in and decides how this appearance will arrive and leave.
 *
 * The headline is chosen here, once, rather than at each of the two moments it
 * plays. That is what makes the exit match the entrance.
 */
function showBug() {
  const fx = el("bugfx");

  clearBugAnimation();
  cutWhenHeadlineEnds = false;

  thisPair = pickDifferent(BUG_ANIMATIONS, lastPair);
  lastPair = thisPair;

  void fx.offsetWidth;
  el("bug").classList.add("up");
  el("bug").classList.add("fx-" + thisPair.in);
}


/**
 * Plays the headline one last time and arranges for the bug to vanish on its
 * final frame.
 *
 * Driven by the animation actually ending rather than by a timer, because the
 * headlines are not all the same length: the glitch is 900ms and the shimmer
 * is 1900ms. A fixed timer would leave the short ones sitting still for a
 * second before disappearing, which is the flat pause all over again.
 */
function playExitHeadline() {
  const fx = el("bugfx");

  listenForBugAnimationEnd();
  clearBugAnimation();
  void fx.offsetWidth;

  cutWhenHeadlineEnds = true;
  el("bug").classList.add("fx-" + thisPair.out);
}


/**
 * Attaches the one listener that takes the bug off screen.
 *
 * On #bug because the event has to be caught wherever it came from: most
 * headlines animate #bugfx, but the shimmer animates #bugsheen. Both bubble
 * up to here.
 */
function listenForBugAnimationEnd() {
  if (bugListening) return;
  bugListening = true;

  el("bug").addEventListener("animationend", () => {
    if (!cutWhenHeadlineEnds) return;
    hideBug();
  });
}


/** Starts the quiet loop that carries the middle of the appearance. */
function startIdle() {
  const bug = el("bug");

  clearBugAnimation();

  const picked = pickDifferent(BUG_IDLES, lastIdle);
  lastIdle = picked;

  // On #bug rather than #bugfx because several idles animate #bugfx itself,
  // and an element cannot both carry the class and be its target.
  bug.classList.add("idle-" + picked);
}


/** A random pick from a list that is never the given one. */
function pickDifferent(list, avoid) {
  const choices = list.filter(name => name !== avoid);
  const from = choices.length > 0 ? choices : list;
  return from[Math.floor(Math.random() * from.length)];
}


/** Takes every headline and idle animation back off. */
function clearBugAnimation() {
  const bug = el("bug");

  BUG_ANIMATIONS.forEach(pair => {
    bug.classList.remove("fx-" + pair.in);
    bug.classList.remove("fx-" + pair.out);
  });

  BUG_IDLES.forEach(name => bug.classList.remove("idle-" + name));
}


/**
 * Takes the bug off screen at once, with no fade, and clears the animations.
 *
 * The instant part is the stylesheet's doing: the opacity transition lives on
 * #bug.up, so removing that class removes the transition in the same frame.
 */
function hideBug() {
  cutWhenHeadlineEnds = false;
  el("bug").classList.remove("up");
  clearBugAnimation();
}


/**
 * One Apple lookup for everything the player needs about a song that the queue
 * sheet does not store: artwork, running time, album, and record label.
 *
 * The album relationship is included because the record label lives on the
 * album rather than the song, and the MTV-style lower third wants all four.
 */
async function songDetails(songId) {
  try {
    const response = await fetch(
      "https://api.music.apple.com/v1/catalog/us/songs/" + songId
        + "?include=albums",
      { headers: { Authorization: "Bearer " + DEVELOPER_TOKEN } }
    );
    const data = await response.json();
    const song = data.data[0];
    const attributes = song.attributes;

    let label = "";
    try {
      const album = song.relationships.albums.data[0];
      label = album.attributes.recordLabel || "";
    } catch (error) {
      // Some tracks have no album relationship. The line is simply left off.
    }

    let albumTracks = 0;
    let albumReleased = "";
    let copyright = "";
    try {
      const album = song.relationships.albums.data[0].attributes;
      albumTracks = album.trackCount || 0;
      albumReleased = album.releaseDate || "";
      copyright = album.copyright || "";
    } catch (error) {
      // Same as the label above: no album relationship, so these are skipped.
    }

    return {
      artwork: attributes.artwork.url,
      durationMs: attributes.durationInMillis || 0,
      album: attributes.albumName || "",
      label: label,

      // Everything below is only used to write pop-up nuggets. It costs
      // nothing extra: it all arrives in the same response the lower third
      // already asks for.
      released: attributes.releaseDate || "",
      genres: attributes.genreNames || [],
      composer: attributes.composerName || "",
      trackNumber: attributes.trackNumber || 0,
      discNumber: attributes.discNumber || 0,
      albumTracks: albumTracks,
      albumReleased: albumReleased,
      copyright: copyright
    };
  } catch (error) {
    return {
      artwork: null, durationMs: 0, album: "", label: "",
      released: "", genres: [], composer: "", trackNumber: 0,
      discNumber: 0, albumTracks: 0, albumReleased: "", copyright: ""
    };
  }
}

/** Turns Apple's artwork template into a real URL at the size we want. */
function sized(template, pixels) {
  if (!template) return null;
  return template.replace("{w}", pixels).replace("{h}", pixels);
}


// ---------------------------------------------------------------------------
// Startup
// ---------------------------------------------------------------------------

document.addEventListener("musickitloaded", async () => {
  music = await MusicKit.configure({
    developerToken: DEVELOPER_TOKEN,
    app: { name: "Cooney Provisions Video Jukebox", build: "1.0.0" }
  });

  // Try to start on our own. On a browser that allows unattended playback this
  // is the whole startup and nobody ever sees the button. On one that does not,
  // it fails harmlessly and the button is still sitting there.
  setStatus("ready to start");
  tryAutoStart();
});


el("startbtn").addEventListener("click", async () => {
  el("startbtn").disabled = true;
  el("startbtn").textContent = "Starting";

  // authorize() opens a window, which only a real click is allowed to do. This
  // is the one part of startup that can never happen automatically, and it is
  // why a brand new browser always needs the button once.
  if (!music.isAuthorized) {
    await music.authorize();
  }

  await unlockAudio();
  await unlockYouTube();
  goLive(false);
});


/**
 * Starts the jukebox without anybody touching the screen, if the browser lets
 * us. Returns quietly and leaves the Start screen up if it does not.
 *
 * WHY THIS IS A TRY RATHER THAN A SETTING.
 * Whether audio may start on its own is the browser's decision and there is no
 * way to ask it in advance. So we simply attempt it and watch: if a silent
 * track really reaches the playing state, unattended playback is allowed here
 * and the rest of startup can run. If it does not, the Start button is still
 * on screen and works exactly as it always has.
 *
 * That is what makes this safe to run everywhere. Chrome launched in kiosk mode
 * with --autoplay-policy=no-user-gesture-required starts on its own. iPadOS
 * Safari refuses, every time, and shows the button. Neither needs a different
 * build of this file and neither needs a flag set by hand.
 */
async function tryAutoStart() {
  // Signing in cannot be automated: authorize() opens a window and browsers
  // only allow that from a real click. Already signed in is the normal case,
  // because the authorisation is remembered.
  if (!music.isAuthorized) {
    debugLine("autostart: not signed in yet, the button is needed once");
    return;
  }

  const allowed = await audioWillStartOnItsOwn();

  if (!allowed) {
    debugLine("autostart: this browser wants a tap first");
    return;
  }

  debugLine("autostart: unattended playback allowed, starting");
  await unlockYouTube();
  goLive(true);
}


/**
 * Asks the browser, honestly, whether it will let audible sound start without
 * anybody touching the page.
 *
 * Full volume and not muted, on purpose. Turning the volume down would make
 * this pass everywhere and mean nothing. The clip itself is silence, so asking
 * the question costs no noise.
 */
async function audioWillStartOnItsOwn() {
  try {
    const probe = new Audio(SILENT_CLIP);
    probe.volume = 1;
    probe.muted = false;

    await probe.play();
    probe.pause();
    return true;
  } catch (error) {
    debugLine("autoplay refused: " + (error.name || error.message || error));
    return false;
  }
}


/**
 * Clears the Start screen and runs the jukebox. Called from the button and
 * from the automatic path, so both reach the same place by the same route.
 */
function goLive(automatic) {
  if (live) return;
  live = true;
  startedAutomatically = !!automatic;
  deadStarts = 0;

  el("start").style.display = "none";
  begin();
}


/**
 * Counts songs that never started, and puts the Start screen back if it keeps
 * happening after an automatic start.
 *
 * The probe can only ever be a good answer to the question at the moment it is
 * asked. If it is somehow wrong, or the browser changes its mind, the failure
 * mode without this is a jukebox that took its own button away and then played
 * nothing for the rest of the day. Two failures in a row is enough: real songs
 * fail occasionally for their own reasons, but not twice running.
 *
 * A run that a person started is left alone. If they pressed the button and
 * songs still will not play, the problem is not permission and putting the
 * button back would only hide the real one.
 */
function noteDeadStart() {
  if (!startedAutomatically) return;

  deadStarts++;
  if (deadStarts < 2) return;

  debugLine("autostart was wrong, asking for a tap");
  live = false;
  startedAutomatically = false;

  el("start").style.display = "";
  el("startbtn").disabled = false;
  el("startbtn").textContent = "Start the jukebox";
  setStatus("press start to allow sound");
}

/**
 * Browsers refuse to start audio unless a person clicked something. Songs get
 * started later by a timer, which does not count, so we play one track silently
 * during the button press to open the gate for everything after it.
 */
async function unlockAudio() {
  try {
    music.volume = 0;
    await music.setQueue({ song: UNLOCK_SONG, startPlaying: true });
    await new Promise(resolve => setTimeout(resolve, 400));
    music.stop();
  } catch (error) {
    debugLine("unlock failed: " + error.message);
  } finally {
    music.volume = 1;
  }
}

function begin() {
  watchPlaybackState();
  setStatus("waiting for requests", true);
  reportHome();
  loadCelebrations();
  setInterval(loadCelebrations, CELEBRATE_REFRESH_MS);
  tick();
  setInterval(tick, POLL_MS);
  setInterval(paintProgress, 1000);
  setInterval(reportHome, 3600000);
}

/** Listens for Apple telling us a track ended, rather than guessing. */
function watchPlaybackState() {
  music.addEventListener("playbackStateDidChange", () => {
    const state = music.playbackState;
    const states = MusicKit.PlaybackStates || {};

    // Only "completed" and "ended" mean the track actually ran out.
    // "stopped" is deliberately NOT on this list. We call music.stop()
    // ourselves at the top of every song, which would fire this listener
    // while the new song's QueueID was already set and mark it finished
    // about four seconds after it started.
    const done = [states.completed, states.ended]
      .filter(value => value !== undefined)
      .indexOf(state) !== -1;

    if (done && (currentQueueId || houseTrack)) {
      trackFinished = true;
      debugLine("track finished, advancing");
    }
  });
}


/**
 * Tells the API what the shop's public address is. This machine only ever runs
 * on the shop network, so its address defines who is allowed to queue songs.
 * Re-reported hourly so an ISP address change heals on its own.
 */
async function reportHome() {
  const ip = await publicAddress();
  if (!ip) {
    debugLine("could not detect our own address");
    return;
  }
  await api("reportHome", { ip: ip });
}


// ---------------------------------------------------------------------------
// The player loop
// ---------------------------------------------------------------------------

async function tick() {
  const state = await api("getQueue");
  if (!state || !state.ok) return;

  // The clean-content list is owned by the API, so the player always uses
  // whatever the server is currently enforcing rather than its own copy.
  if (state.banned) bannedWords = state.banned;

  // An admin is waiting and somebody else's song is on. Hand the floor over.
  // The displaced song goes back to waiting rather than being marked played,
  // so whoever asked for it keeps their turn and hears it next.
  //
  // A station track needs no handling here. Nothing is marked playing while
  // one is on, so the API never raises this flag, and the ordinary request
  // path already cuts the station off.
  if (state.interrupt && currentQueueId) {
    debugLine("admin request, handing the floor over");
    await api("requeue", { queueId: currentQueueId });
    currentQueueId = null;
    trackFinished = false;
    heardItPlaying = false;
    music.stop();
    stopYouTube();
  }

  if (currentQueueId) {
    if (trackFinished) {
      await api("markPlayed", { queueId: currentQueueId });
      currentQueueId = null;
      trackFinished = false;
      stopYouTube();
    } else if (onYouTube) {
      // YouTube announces its own ending through the player events, so none
      // of the silence-watching below applies while it is on screen.
      heardItPlaying = true;
      deadStarts = 0;
    } else if (music.isPlaying) {
      // Once we have actually heard it, silence later means it ended.
      heardItPlaying = true;
      deadStarts = 0;
    } else if (heardItPlaying) {
      await api("markPlayed", { queueId: currentQueueId });
      currentQueueId = null;
    } else if (Date.now() - startedAt > START_TIMEOUT_MS) {
      await api("markPlayed", { queueId: currentQueueId });
      currentQueueId = null;
      setStatus("a track would not start");
      noteDeadStart();
    }
  } else if (houseTrack && trackFinished) {
    // A station track finished. Nothing to report to the sheet, it just
    // clears the way for the next one.
    houseTrack = null;
    trackFinished = false;
    stopYouTube();
  }

  // The office skipped it out from under us.
  if (currentQueueId && !state.playing) {
    currentQueueId = null;
    music.stop();
    stopYouTube();
  }

  if (!currentQueueId && state.waiting.length > 0) {
    await playRequest(state.waiting[0]);
  } else if (!currentQueueId && !onYouTube && !music.isPlaying) {
    await playHouse();
  }

  paintQueue(state.waiting);
}

/**
 * Plays one song, with a video if one can be found, and paints the screen.
 *
 * Requested songs and house rotation tracks both come through here. That is
 * deliberate: when the house rotation had its own path it quietly skipped both
 * the video lookup and the explicit filter, and the two would drift apart
 * every time one of them was changed.
 */
async function playSong(songId, title, artist, by, dedication) {
  currentSongId = songId;

  const details = await songDetails(songId);

  music.stop();
  stopYouTube();
  attachScreen();

  const video = PLAY_VIDEOS
    ? await musicVideoFor(title, artist)
    : null;

  // Apple first, always. YouTube is only asked about songs Apple has no
  // video for, and only once the player API has finished loading.
  const backup = (!video && PLAY_VIDEOS && ytApiReady)
    ? await youtubeVideoFor(songId, title, artist, details.durationMs)
    : null;

  if (video) {
    await music.setQueue({ musicVideo: String(video.id), startPlaying: true });
    showVideoStage(true, title, artist, by, details.album, details.label, dedication);
    chaseVideoElement();
    setStatus("playing a video", true);
  } else if (backup) {
    hideVideoElement();
    playYouTube(backup);
    showVideoStage(true, title, artist, by, details.album, details.label, dedication);
    setStatus("playing a video from YouTube", true);
  } else {
    await music.setQueue({ song: songId, startPlaying: true });
    hideVideoElement();
    showVideoStage(false);
    setStatus("no video, playing the track", true);
  }

  paintNowPlaying(title, artist, by);
  paintArtwork(sized(details.artwork, 900));

  // Reported back so the house rotation can name the station without erasing
  // which of the three paths actually ran. That status line is the fastest way
  // to tell a video failure from a station failure.
  if (video) return "video";
  if (backup) return "video from YouTube";
  return "no video";
}


/** Plays one requested song and tells the sheet it started. */
async function playRequest(item) {
  currentQueueId = item.QueueID;
  houseTrack = null;
  heardItPlaying = false;
  trackFinished = false;
  startedAt = Date.now();
  playbackError = null;
  await api("markPlaying", { queueId: item.QueueID });

  // Between songs, never over one. The card holds the picture for a few
  // seconds and the song starts after it, so a birthday never talks over
  // somebody's request.
  const wait = playCelebration();
  if (wait) await new Promise(resolve => setTimeout(resolve, wait));

  try {
    // Google Sheets hands back numeric IDs as numbers. MusicKit only accepts
    // strings and fails with "could not be resolved" on anything else.
    await playSong(
      String(item.SongID).trim(),
      item.Title,
      item.Artist,
      item.RequestedBy,
      item.Dedication
    );
  } catch (error) {
    playbackError = error && error.message ? error.message : String(error);
    debugLine("PLAYBACK FAILED: " + playbackError);
    await api("markPlayed", { queueId: item.QueueID });
    currentQueueId = null;
    setStatus("could not play: " + playbackError);
  }
}

/**
 * True during the holiday window set at the top of the file. Written so the
 * window may run across the end of the year, for example 25 November to 6
 * January, without needing a special case.
 */
function inHolidaySeason() {
  const now = new Date();
  const month = now.getMonth() + 1;
  const day = now.getDate();

  const started = month > HOLIDAY_FROM.month
    || (month === HOLIDAY_FROM.month && day >= HOLIDAY_FROM.day);

  const notOver = month < HOLIDAY_UNTIL.month
    || (month === HOLIDAY_UNTIL.month && day <= HOLIDAY_UNTIL.day);

  return HOLIDAY_FROM.month <= HOLIDAY_UNTIL.month
    ? (started && notOver)
    : (started || notOver);
}


/** One station at random from whichever set belongs to today. */
function houseStation() {
  const holiday = inHolidaySeason() && HOLIDAY_STATIONS.length > 0;
  const pool = holiday ? HOLIDAY_STATIONS : HOUSE_STATIONS;

  if (pool.length === 0) return "";
  return pool[Math.floor(Math.random() * pool.length)];
}


// Station names resolve to the same playlist all day, so the answers are kept
// rather than searched for again every time the queue empties.
const stationMemo = new Map();

/**
 * Turns a station name into a playlist ID Apple will actually play.
 *
 * Apple's own playlists are preferred over anything else that matches, because
 * a search for "oldies" will happily return somebody's public playlist and we
 * would rather have the curated one going out over the dock.
 */
async function resolveStation(station) {
  if (!station) return "";
  if (station.indexOf("pl.") === 0) return station;
  if (stationMemo.has(station)) return stationMemo.get(station);

  try {
    const response = await music.api.music("/v1/catalog/us/search", {
      term: station,
      types: ["playlists"],
      limit: 10
    });

    const found = response.data.results.playlists;
    const playlists = found ? found.data : [];
    if (playlists.length === 0) return "";

    const curated = playlists.filter(item =>
      /apple music/i.test((item.attributes || {}).curatorName || "")
    );

    const chosen = (curated[0] || playlists[0]).id;
    stationMemo.set(station, chosen);
    debugLine("house station \"" + station + "\" -> " + chosen);

    return chosen;
  } catch (error) {
    debugLine("could not resolve station \"" + station + "\"");
    return "";
  }
}


/**
 * Pulls the songs out of a station's playlist, drops anything that cannot go
 * over the dock speakers, and shuffles what is left.
 *
 * Filtering here is the reason the rotation is driven track by track. When the
 * whole playlist was handed to Apple, none of it was checked, and Apple's hits
 * playlists do carry explicit tracks.
 */
async function stationTracks(playlistId) {
  try {
    const response = await music.api.music(
      "/v1/catalog/us/playlists/" + playlistId,
      { include: "tracks" }
    );

    const playlist = response.data.data[0];
    const tracks = playlist.relationships.tracks.data || [];

    const clean = tracks.filter(track => {
      const attributes = track.attributes || {};
      if (attributes.contentRating === "explicit") return false;
      if (isFoul(attributes.name)) return false;
      if (isFoul(attributes.artistName)) return false;
      return track.type === "songs";
    });

    // Shuffled so a station does not open with the same song every time.
    for (let i = clean.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const swap = clean[i];
      clean[i] = clean[j];
      clean[j] = swap;
    }

    return clean.map(track => ({
      id: String(track.id),
      title: track.attributes.name,
      artist: track.attributes.artistName
    }));
  } catch (error) {
    debugLine("could not read station tracks: " + (error.message || error));
    return [];
  }
}


/**
 * The next station track worth playing.
 *
 * With HOUSE_VIDEOS_ONLY on, tracks with no Apple music video are skipped, so
 * the wall keeps showing pictures between requests instead of album sleeves.
 * The lookups are memoised, so a track screened here costs nothing when it is
 * played a moment later, and nothing again the next time the station comes up.
 *
 * After HOUSE_VIDEO_TRIES misses it gives up and plays the next one regardless.
 * A station full of obscure material should sound like something rather than
 * search forever and leave the dock silent.
 */
async function nextHouseTrack() {
  if (!HOUSE_VIDEOS_ONLY || !PLAY_VIDEOS) {
    return houseQueue.shift() || null;
  }

  let looked = 0;

  while (houseQueue.length > 0 && looked < HOUSE_VIDEO_TRIES) {
    const track = houseQueue.shift();
    looked++;

    const video = await musicVideoFor(track.title, track.artist);
    if (video) return track;
  }

  if (looked >= HOUSE_VIDEO_TRIES) {
    debugLine("no videos in the last " + looked + " station tracks, playing anyway");
  }

  return houseQueue.shift() || null;
}


/** Falls back to the house rotation so the dock is never silent. */
async function playHouse() {
  if (houseQueue.length === 0) {
    const station = houseStation();
    const playlist = await resolveStation(station);

    if (playlist) {
      houseQueue = await stationTracks(playlist);
      houseStationName = station;
    }
  }

  if (houseQueue.length === 0) {
    houseTrack = null;
    showVideoStage(false);
    paintNowPlaying("Nothing playing", "", "");
    paintArtwork(null);
    if (!playbackError) {
      setStatus("waiting for requests", true);
    }
    return;
  }

  const track = await nextHouseTrack();

  if (!track) {
    houseTrack = null;
    showVideoStage(false);
    paintNowPlaying("Nothing playing", "", "");
    paintArtwork(null);
    if (!playbackError) {
      setStatus("waiting for requests", true);
    }
    return;
  }

  houseTrack = track;
  trackFinished = false;

  try {
    const how = await playSong(track.id, track.title, track.artist, "", "");
    setStatus(houseStationName + ", " + how, true);
  } catch (error) {
    // One bad track should not stall the rotation. Drop it and let the next
    // tick take the one after it.
    debugLine("house track failed: " + (error.message || error));
    houseTrack = null;
  }
}


// ---------------------------------------------------------------------------
// Painting the screen
// ---------------------------------------------------------------------------

function paintNowPlaying(title, artist, by) {
  el("title").textContent = title;
  el("artist").textContent = artist || "";
  el("eyebrow").style.visibility = artist ? "visible" : "hidden";

  const credit = el("credit");
  credit.textContent = by ? "Requested by " + by : "";
  credit.classList.toggle("on", !!by);
}

function paintArtwork(url) {
  const art = el("art");
  const backdrop = el("backdrop");

  if (!url) {
    art.classList.remove("on");
    backdrop.classList.remove("on");
    return;
  }

  art.classList.remove("on");
  const preload = new Image();
  preload.onload = () => {
    art.src = url;
    art.classList.add("on");
    backdrop.style.backgroundImage = 'url("' + url + '")';
    backdrop.classList.add("on");
  };
  preload.src = url;
}

function paintProgress() {
  let total = 0;
  let at = 0;

  if (onYouTube && ytPlayer && ytPlayer.getDuration) {
    total = ytPlayer.getDuration();
    at = ytPlayer.getCurrentTime();
  } else if (music) {
    total = music.currentPlaybackDuration;
    at = music.currentPlaybackTime;
  }

  const percent = total > 0 ? Math.min(100, (at / total) * 100) : 0;
  el("progress").style.width = percent + "%";
}

// Artwork never changes for a given song, and the queue repaints every four
// seconds, so the answers are kept rather than asked for again and again.
const artworkMemo = new Map();

async function artworkTemplate(songId) {
  if (artworkMemo.has(songId)) return artworkMemo.get(songId);

  const details = await songDetails(songId);
  artworkMemo.set(songId, details.artwork);
  return details.artwork;
}


// What the up-next list was last built from. Rebuilding it on every tick would
// reload the artwork and make the whole list blink every four seconds.
let lastNextSignature = null;

/**
 * The up-next list in the bottom right corner of a video, under the requester.
 *
 * It reads the same list the cards below use, which arrives from the API
 * already in fair-rotation order, so what is shown here is genuinely the order
 * things will play in.
 */
function paintVideoNext(waiting) {
  const box = el("vnext");

  const signature = waiting.map(item => item.QueueID).join(",");
  if (signature === lastNextSignature) return;
  lastNextSignature = signature;

  box.innerHTML = "";

  const head = document.createElement("div");
  head.className = "head";
  head.textContent = "Up next";
  box.appendChild(head);

  if (waiting.length === 0) {
    const none = document.createElement("div");
    none.className = "none";
    none.textContent = "Nothing else queued";
    box.appendChild(none);
    return;
  }

  // Every waiting song is built. Anything that will not fit is taken away
  // afterwards by measurement, because how many rows fit depends on the screen.
  waiting.forEach(item => {
    const row = document.createElement("div");
    row.className = "row";

    const art = document.createElement("img");
    art.alt = "";
    artworkTemplate(String(item.SongID).trim()).then(template => {
      const url = sized(template, 200);
      if (url) art.src = url;
    });

    const text = document.createElement("div");
    text.className = "rtext";
    const song = document.createElement("b");
    song.textContent = shorten(item.Title);
    const who = document.createElement("span");
    who.textContent = shorten(item.RequestedBy);
    text.append(song, who);

    row.append(text, art);
    box.appendChild(row);
  });

  trimToFit(box, waiting.length);
}


/**
 * Cuts a title or a name down to QUEUE_TEXT_MAX characters.
 *
 * Counted the way a person would count them: every character including spaces,
 * and the ellipsis counts as one of them, so nothing on the rail is ever wider
 * than the number in that constant.
 *
 * It backs up to a word boundary when one is within a few characters of the
 * cut, because a title that stops between words reads as a shorter title while
 * one that stops mid-word reads as broken.
 */
function shorten(text) {
  const full = String(text || "").trim();
  if (full.length <= QUEUE_TEXT_MAX) return full;

  const room = QUEUE_TEXT_MAX - 1;
  const cut = full.slice(0, room);
  const space = cut.lastIndexOf(" ");

  const kept = (space >= room - 4 && space > 0) ? cut.slice(0, space) : cut;

  return kept.replace(/[ ,.;:'-]+$/, "") + "\u2026";
}


/**
 * Keeps as many queued songs on screen as physically fit, and drops the rest.
 *
 * There is no fixed row count here on purpose. Row heights are in viewport
 * units, so how many fit depends on the screen the jukebox ends up on.
 * Measuring uses all the space without either wasting it or running rows off
 * the bottom of the picture.
 */
function trimToFit(box, total) {
  const rows = () => box.querySelectorAll(".row");

  // The ceiling first, then the measurement. Measurement alone would happily
  // fill a large screen top to bottom.
  while (rows().length > QUEUE_MAX_ROWS) {
    box.removeChild(rows()[rows().length - 1]);
  }

  while (box.scrollHeight > box.clientHeight && rows().length > 1) {
    box.removeChild(rows()[rows().length - 1]);
  }

  if (rows().length >= total) return;

  const more = document.createElement("div");
  more.className = "none";
  more.textContent = "and " + (total - rows().length) + " more";
  box.appendChild(more);

  // The note needs a line of its own, so give up a row if it does not fit.
  while (box.scrollHeight > box.clientHeight && rows().length > 1) {
    box.removeChild(rows()[rows().length - 1]);
    more.textContent = "and " + (total - rows().length) + " more";
  }
}


function paintQueue(waiting) {
  // Drop whatever is playing right now, by ID rather than by position.
  //
  // The API only lists songs still marked waiting, so on most ticks the first
  // entry IS the next song. The exception is the tick where playback starts:
  // the player picks up the first entry and paints from the same answer, in
  // which that song is still marked waiting. Skipping position zero handled
  // that one tick and hid the next song on every other one, which is why the
  // wall and the phones disagreed.
  const queued = waiting.filter(item => item.QueueID !== currentQueueId);

  paintVideoNext(queued);

  const cards = el("cards");
  const upcoming = queued.slice(0, 4);

  if (upcoming.length === 0) {
    cards.innerHTML = '<span class="idle">Nothing queued yet.</span>';
    return;
  }

  cards.innerHTML = "";
  upcoming.forEach((item, index) => {
    const card = document.createElement("div");
    card.className = "card";

    const pos = document.createElement("div");
    pos.className = "pos";
    pos.textContent = index + 1;

    const img = document.createElement("img");
    artworkTemplate(String(item.SongID).trim()).then(template => {
      const url = sized(template, 160);
      if (url) img.src = url;
    });

    const text = document.createElement("div");
    const name = document.createElement("b");
    name.textContent = item.Title;
    const who = document.createElement("span");
    who.textContent = item.RequestedBy;
    text.append(name, who);

    card.append(pos, img, text);
    cards.appendChild(card);
  });

  // The strip is a single row with hidden overflow, so anything past the edge
  // would just disappear without saying so.
  const overflow = queued.length - upcoming.length;
  if (overflow > 0) {
    const more = document.createElement("span");
    more.className = "idle";
    more.textContent = "and " + overflow + " more";
    cards.appendChild(more);
  }
}

</script>
