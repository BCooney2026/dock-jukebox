<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Cooney Provisions Video Jukebox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600&family=Josefin+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0c0a09;
    --amber: #ffa62b;
    --cream: #f7f1e6;
    --dim: rgba(247, 241, 230, 0.45);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--ink);
    color: var(--cream);
    font-family: Barlow, system-ui, sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }

  /* Blurred album art fills the wall behind everything, so every song
     repaints the whole screen in its own colors. */
  #backdrop {
    position: fixed;
    inset: -12%;
    background-size: cover;
    background-position: center;
    filter: blur(70px) saturate(1.5);
    opacity: 0;
    transform: scale(1.08);
    transition: opacity 1.4s ease;
  }
  #backdrop.on { opacity: 0.62; }

  #scrim {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(120% 90% at 22% 45%, rgba(0,0,0,0.15), rgba(0,0,0,0.82) 78%),
      linear-gradient(to top, rgba(0,0,0,0.9), rgba(0,0,0,0.25));
  }

  #videostage {
    display: none;
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 6;
    pointer-events: none;
  }
  #videostage.on { display: block; }

  #screen { position: absolute; inset: 0; }

  /* MusicKit injects its own video element and likes to position it over the
     whole page. Pin it inside the box instead. */
  #screen video {
    position: absolute !important;
    inset: 0 !important;
    width: 100% !important;
    height: 100% !important;
    object-fit: contain;
    background: #000;
    z-index: 1;
  }
  #screen > div {
    position: absolute !important;
    inset: 0 !important;
    width: 100% !important;
    height: 100% !important;
  }

  /* The YouTube fallback sits in the same box as the Apple video, underneath
     the title bar so the song and requester still read over the top of it. */
  #ytframe {
    display: none;
    position: absolute;
    inset: 0;
    z-index: 2;
    /* The stage above this is pointer-events: none, which used to mean taps
       aimed at the YouTube play button went straight through to the page and
       zoomed it instead. Videos should never need a tap, but when one stalls
       somebody has to be able to poke it. */
    pointer-events: auto;
  }
  #ytframe.on { display: block; }
  #ytframe iframe {
    width: 100%;
    height: 100%;
    border: 0;
  }

  /* ---- Reactions ---------------------------------------------------------
     Somebody taps an emoji on their phone and it drifts up the right-hand side
     of the picture with their name under it. Over the video, not instead of
     it: this is the one thing here that never interrupts anything.

     Right side on purpose. The bug owns the bottom left and the lower third
     owns the bottom, so the right edge is the only column with nothing
     permanent in it, and the up-next rail is not on screen mid-song. */
  #reactions {
    position: fixed;
    inset: 0;
    z-index: 8;
    pointer-events: none;
    overflow: hidden;
  }

  .reaction {
    position: absolute;
    text-align: center;
    line-height: 1;
    will-change: transform, opacity;
    animation: reactionFloat 4200ms cubic-bezier(0.25, 0.6, 0.4, 1) forwards;
  }
  .reaction .face {
    font-size: clamp(30px, 6.5vh, 78px);
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.75));
  }
  .reaction .who {
    margin-top: 0.4vh;
    font-family: 'Bebas Neue', system-ui, sans-serif;
    font-size: clamp(11px, 1.9vh, 24px);
    letter-spacing: 0.12em;
    color: #fff;
    opacity: 0.75;
    text-shadow: 0 2px 5px rgba(0,0,0,0.9);
  }

  /* Rises, drifts sideways, and fades out before the top edge so nothing is
     ever seen to clip. */
  @keyframes reactionFloat {
    0%   { opacity: 0; transform: translate(0, 0) scale(0.4); }
    12%  { opacity: 1; transform: translate(0, -6vh) scale(1.15); }
    22%  { transform: translate(2vw, -12vh) scale(1); }
    60%  { opacity: 1; transform: translate(-1.5vw, -42vh) scale(1); }
    100% { opacity: 0; transform: translate(1vw, -72vh) scale(0.85); }
  }

  /* ---- Idents -------------------------------------------------------------
     The sting between songs. Three seconds of black, the mark doing something,
     and out. This is what makes the wall read as a channel rather than a video
     player: without it one song simply becomes the next with no punctuation.

     Six of them, picked at random and never the same twice running, same rule
     as the network bug. Each is a class on #ident driving the mark, plus a
     matching noise. Adding a seventh is keyframes, a class, and a name in
     IDENTS below.

     Everything here is built from parts that already existed: the entrance
     vocabulary from the bug, the canvas from the fireworks, the generated
     audio from the celebration. Nothing new was invented to make these. */
  #ident {
    position: fixed;
    inset: 0;
    z-index: 11;
    display: none;
    align-items: center;
    justify-content: center;
    background: #050403;
    overflow: hidden;
    pointer-events: none;
  }
  #ident.on { display: flex; }

  #identfx {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
  }

  #identmark {
    position: relative;
    z-index: 2;
    width: 46vw;
    max-width: 900px;
  }

  /* The white hit used by the slam and the strobe. */
  #identflash {
    position: absolute;
    inset: 0;
    z-index: 3;
    background: #fff;
    opacity: 0;
  }

  /* 1. SLAM. Arrives enormous and blurred, lands hard, screen flashes. */
  @keyframes identSlam {
    0%   { opacity: 0; transform: scale(7); filter: blur(30px); }
    38%  { opacity: 1; transform: scale(0.86); filter: blur(0); }
    56%  { transform: scale(1.06); }
    72%  { transform: scale(0.98); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes identSlamFlash {
    0%, 32% { opacity: 0; }
    38%     { opacity: 0.85; }
    62%     { opacity: 0; }
    100%    { opacity: 0; }
  }
  .id-slam #identmark { animation: identSlam 1000ms cubic-bezier(0.2, 1.2, 0.3, 1) forwards; }
  .id-slam #identflash { animation: identSlamFlash 1000ms linear forwards; }

  /* 2. SWEEP. Thrown across the frame and caught. */
  @keyframes identSweep {
    0%   { opacity: 0; transform: translateX(-130%) skewX(16deg); }
    18%  { opacity: 1; }
    62%  { transform: translateX(6%) skewX(-5deg); }
    80%  { transform: translateX(-2%) skewX(1deg); }
    100% { opacity: 1; transform: translateX(0) skewX(0); }
  }
  .id-sweep #identmark { animation: identSweep 1100ms cubic-bezier(0.2, 1, 0.3, 1) forwards; }

  /* 3. GLITCH. Tears itself into place over static. */
  @keyframes identGlitch {
    0%   { opacity: 0; clip-path: inset(0 0 78% 0); transform: translateX(-90px) skewX(-14deg); }
    12%  { opacity: 1; clip-path: inset(58% 0 16% 0); transform: translateX(76px) skewX(11deg); }
    26%  { clip-path: inset(10% 0 64% 0); transform: translateX(-58px) skewX(-8deg); }
    40%  { clip-path: inset(72% 0 4% 0);  transform: translateX(44px); }
    54%  { clip-path: inset(24% 0 48% 0); transform: translateX(-30px) skewX(7deg); }
    68%  { clip-path: inset(0 0 0 0);     transform: translateX(18px); }
    82%  { clip-path: inset(44% 0 30% 0); transform: translateX(-8px); }
    100% { opacity: 1; clip-path: inset(0 0 0 0); transform: translateX(0) skewX(0); }
  }
  @keyframes identStatic {
    0%   { opacity: 0.9; }
    70%  { opacity: 0.5; }
    100% { opacity: 0; }
  }
  .id-glitch #identmark { animation: identGlitch 1100ms steps(1, end) forwards; }
  .id-glitch #identfx { animation: identStatic 1200ms linear forwards; }

  /* 4. TUNE IN. A CRT finding the signal. */
  @keyframes identTuneIn {
    0%   { opacity: 0; transform: scale(2, 0.003); filter: brightness(11); }
    30%  { opacity: 1; transform: scale(1.8, 0.008); filter: brightness(10); }
    55%  { transform: scale(0.82, 1.35); filter: brightness(4); }
    72%  { transform: scale(1.14, 0.86); filter: brightness(2); }
    88%  { transform: scale(0.96, 1.05); filter: brightness(1.2); }
    100% { opacity: 1; transform: scale(1, 1); filter: brightness(1); }
  }
  .id-tunein #identmark { animation: identTuneIn 1150ms ease-out forwards; }

  /* 5. BURST. A firework goes off and the mark is what it leaves behind. */
  @keyframes identBurst {
    0%, 30% { opacity: 0; transform: scale(0.7); }
    46%     { opacity: 1; transform: scale(1.08); }
    64%     { transform: scale(0.98); }
    100%    { opacity: 1; transform: scale(1); }
  }
  .id-burst #identmark { animation: identBurst 1400ms cubic-bezier(0.2, 1.2, 0.3, 1) forwards; }
  .id-burst #identfx { opacity: 1; }

  /* 6. STROBE. Cut in, four times, then held. */
  @keyframes identStrobe {
    0%, 12%, 30%, 48% { opacity: 0; }
    6%, 22%, 40%      { opacity: 1; filter: brightness(2.4); }
    58%               { opacity: 1; filter: brightness(1.4); }
    68%               { opacity: 0.1; }
    100%              { opacity: 1; filter: brightness(1); }
  }
  @keyframes identStrobeFlash {
    0%, 12%, 30%, 48%, 100% { opacity: 0; }
    5%, 21%, 39%            { opacity: 0.5; }
  }
  .id-strobe #identmark { animation: identStrobe 1300ms steps(1, end) forwards; }
  .id-strobe #identflash { animation: identStrobeFlash 1300ms steps(1, end) forwards; }

  /* ---- The celebration card ----------------------------------------------
     Full screen, between songs, with fireworks behind it and audio to match.
     The point is that everybody in the building looks up, so it takes the
     whole picture and makes a noise. A quiet caption does not do that.

     Three layers: a canvas doing the fireworks and confetti, the type on top
     of it, and the mark underneath. The canvas is the only thing here that is
     not CSS, because particles are not a keyframe animation.

     Same amber, same typefaces, same entrance vocabulary as the network bug,
     so it reads as this channel doing something big rather than a different
     app breaking in. */
  #celebrate {
    position: fixed;
    inset: 0;
    z-index: 12;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 1.4vh;
    background: radial-gradient(circle at 50% 45%, #1c1410 0%, #070605 70%);
    text-align: center;
    pointer-events: none;
    overflow: hidden;
  }
  #celebrate.on { display: flex; }

  #celebfx {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  #celebrate .stack {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.2vh;
  }

  #celebrate .kicker {
    font-family: 'Bebas Neue', system-ui, sans-serif;
    font-size: clamp(24px, 6vh, 74px);
    letter-spacing: 0.34em;
    color: var(--amber);
    text-shadow: 0 0 3vh rgba(255,166,43,0.6);
    opacity: 0;
    animation: celebKicker 500ms cubic-bezier(0.2, 1.3, 0.4, 1) 120ms forwards;
  }

  /* The big one. Deliberately enormous: at 20vh a long nickname still fits
     across a 16:9 frame and a short one is unmissable from the far dock door. */
  #celebrate .who {
    font-family: 'Josefin Sans', 'Century Gothic', system-ui, sans-serif;
    font-weight: 700;
    font-size: clamp(52px, 16vh, 210px);
    line-height: 0.95;
    color: #fff;
    text-transform: uppercase;
    text-shadow: 0 0 6vh rgba(255,166,43,0.55), 4px 4px 0 rgba(0,0,0,0.9);
    opacity: 0;
    animation: celebWho 700ms cubic-bezier(0.15, 1.4, 0.3, 1) 300ms forwards,
               celebPulse 1400ms ease-in-out 1050ms infinite;
  }

  #celebrate .years {
    font-family: 'Bebas Neue', system-ui, sans-serif;
    font-size: clamp(26px, 7vh, 92px);
    letter-spacing: 0.14em;
    color: var(--amber);
    text-shadow: 0 0 3vh rgba(255,166,43,0.5);
    opacity: 0;
    animation: celebYears 600ms cubic-bezier(0.2, 1.3, 0.4, 1) 750ms forwards;
  }
  #celebrate .years:empty { display: none; }

  /* The request that follows the card. This is the half that was missing:
     without it the card is a screensaver with somebody's name on it. A
     request has two people in it and both of them should be on the wall, the
     one being celebrated and the one who went to the trouble. */
  #celebrate .request {
    margin-top: 1.6vh;
    opacity: 0;
    animation: celebYears 600ms cubic-bezier(0.2, 1.3, 0.4, 1) 1050ms forwards;
  }
  #celebrate .request:empty { display: none; }

  #celebrate .from {
    font-family: 'Bebas Neue', system-ui, sans-serif;
    font-size: clamp(15px, 3.2vh, 40px);
    letter-spacing: 0.2em;
    color: rgba(255,255,255,0.6);
  }
  #celebrate .from b {
    color: var(--amber);
    font-weight: inherit;
  }

  #celebrate .song {
    font-family: 'Josefin Sans', 'Century Gothic', system-ui, sans-serif;
    font-weight: 600;
    font-size: clamp(17px, 3.5vh, 42px);
    color: #fff;
    margin-top: 0.4vh;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.85);
  }
  #celebrate .song span {
    font-weight: 400;
    color: rgba(255,255,255,0.75);
  }

  /* The dedication, and it is the biggest thing on the card after the name.
     Everything else here is bookkeeping: who, what track, from whom. This is
     the only line somebody actually wrote, and it is the reason the card
     exists. Sized to sit just under the name, and given its own entrance a
     beat later so it lands as its own moment rather than arriving with the
     credits. */
  #celebrate .note {
    font-style: italic;
    font-weight: 700;
    font-size: clamp(30px, 8.5vh, 104px);
    line-height: 1.1;
    color: var(--amber);
    text-shadow: 0 0 4vh rgba(255,166,43,0.5), 3px 3px 0 rgba(0,0,0,0.85);
    margin-top: 2vh;
    max-width: 82vw;
    opacity: 0;
    animation: celebNote 650ms cubic-bezier(0.15, 1.35, 0.3, 1) 1350ms forwards;
  }
  #celebrate .note:empty { display: none; }

  @keyframes celebNote {
    0%   { opacity: 0; transform: scale(0.55) rotate(-3deg); filter: blur(10px); }
    58%  { opacity: 1; transform: scale(1.07) rotate(1deg); filter: blur(0); }
    80%  { transform: scale(0.98); }
    100% { opacity: 1; transform: scale(1) rotate(0); }
  }

  #celebrate .mark {
    position: relative;
    z-index: 2;
    width: 22vw;
    max-width: 460px;
    opacity: 0;
    animation: celebMark 650ms ease-out 1100ms forwards;
  }

  @keyframes celebKicker {
    0%   { opacity: 0; transform: translateY(-30px) scale(0.8); letter-spacing: 0.8em; }
    100% { opacity: 1; transform: translateY(0) scale(1); letter-spacing: 0.34em; }
  }
  @keyframes celebWho {
    0%   { opacity: 0; transform: scale(3) rotate(-8deg); filter: blur(20px); }
    50%  { opacity: 1; transform: scale(0.88) rotate(2deg); filter: blur(0); }
    72%  { transform: scale(1.08) rotate(-1deg); }
    88%  { transform: scale(0.97); }
    100% { opacity: 1; transform: scale(1) rotate(0); }
  }
  /* A slow breath after it lands, so the screen is never completely still. */
  @keyframes celebPulse {
    0%, 100% { text-shadow: 0 0 6vh rgba(255,166,43,0.55), 4px 4px 0 rgba(0,0,0,0.9); }
    50%      { text-shadow: 0 0 11vh rgba(255,166,43,0.95), 4px 4px 0 rgba(0,0,0,0.9); }
  }
  @keyframes celebYears {
    0%   { opacity: 0; transform: translateY(34px) scale(0.7); }
    60%  { opacity: 1; transform: translateY(-6px) scale(1.06); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes celebMark {
    0%   { opacity: 0; transform: translateY(28px) scale(0.85); }
    100% { opacity: 0.9; transform: translateY(0) scale(1); }
  }

  /* ---- The network bug --------------------------------------------------
     Bottom left, and it has to be. Broadcast convention would put a bug
     opposite the character generator, which would mean bottom right, and that
     is wrong here: .vright holds the up-next list and the requested-by credit
     and they are on screen for the WHOLE song. The lower third on the left is
     up for ten seconds and gone.

     That is the distinction that decides the corner. Sharing with something
     temporary works, because the bug does not arrive until
     BUG_DELAY_SECONDS, long after the titles have cleared. Sharing with
     something permanent does not, at any timing. If you ever shorten
     BUG_DELAY_SECONDS below about 16, check it against TITLE_DELAY_SECONDS
     plus TITLE_SECONDS.

     Two nested elements on purpose. #bug owns whether it is on screen at all,
     which is a plain opacity fade. #bugfx owns the entrance animation. Keeping
     them apart means an animation that plays with opacity, like the flash,
     cannot fight the fade, and adding a new animation later cannot break the
     showing and hiding. */
  #bug {
    z-index: 9;
    position: fixed;
    bottom: 4vh;
    left: 4vw;

    /* Sized purely as a share of the screen, with no upper cap. There used to
       be a 340px ceiling, which is invisible at 1920 wide and quietly halves
       the logo on a display that reports more than about 2000 CSS pixels. A
       bug should be the same fraction of the picture on every screen, which is
       what vw already does. The floor is only for reading the debug strip on a
       laptop, where 17vw would be too small to see. */
    width: 17vw;
    min-width: 150px;

    opacity: 0;
    pointer-events: none;

    /* One definition, referenced by the base style and by every animation that
       has to restate the resting look. It was written out in seven places, and
       seven copies of a value is six chances for the idle loop to end on a
       slightly different shadow than it started on and visibly jump. */
    --bug-shadow: drop-shadow(0 3px 11px rgba(0,0,0,0.9));
  }

  /* No transition, on purpose. The arrival animation starts at opacity 0 and
     brings the logo in, and the departure animation ends at opacity 0 and
     takes it away. A fade here would run alongside them and turn one movement
     into two overlapping ones, which is what made arriving and leaving feel
     disconnected from the animation in between. */
  /* 0.7, not higher. A bug is a watermark: at 0.86 with a hard drop shadow it
     was competing with the video rather than sitting on top of it. */
  #bug.up { opacity: 0.7; }

  #bugfx {
    position: relative;
    /* Matches the corner it is anchored to, so scaling and rotation pivot on
       the corner rather than dragging the logo away from it. */
    transform-origin: bottom left;
  }

  #bugfx img {
    width: 100%;
    display: block;
    filter: var(--bug-shadow);
  }

  /* The shimmer's moving highlight. Masked with the logo itself so the light
     travels across the letters and the boar instead of across a rectangle.
     Invisible unless the shimmer is the animation that got picked. */
  #bugsheen {
    position: absolute;
    inset: 0;
    opacity: 0;
    background: linear-gradient(
      100deg,
      transparent 38%,
      rgba(255,255,255,0.9) 50%,
      transparent 62%
    );
    background-size: 300% 100%;
    background-position: 130% 0;
    -webkit-mask-image: url(cp-music-tv.png);
    mask-image: url(cp-music-tv.png);
    -webkit-mask-size: 100% 100%;
    mask-size: 100% 100%;
    -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat;
  }

  /* ---- The bug's arrivals and departures --------------------------------
     Every animation comes in a pair. The bug arrives with the -in and leaves
     with the matching -out, so a punch in leaves by punching out and a slide
     from the left leaves to the left. One pair is chosen per appearance and
     the same pair is used at both ends.

     TWO RULES THAT KEEP THIS WORKING.
     Every -in starts at opacity 0 and ends on a clean, still, unmodified logo.
     The animation IS the entrance: there is no separate fade, which is what
     used to make arriving feel like two unrelated events.
     Every -out starts clean and ends at opacity 0, and carries
     animation-fill-mode: forwards so it holds there. That is why the logo is
     never seen to vanish: by the time anything removes it, it has already
     animated itself away.

     Adding a pair is: two keyframes, two .fx- rules, one name in
     BUG_ANIMATIONS. */

  /* Light sweeps across and leaves the logo behind it. */
  @keyframes bugShimmerIn {
    0%   { opacity: 0; }
    30%  { opacity: 0.5; }
    100% { opacity: 1; }
  }
  @keyframes bugShimmerSweep {
    0%   { background-position: 140% 0; opacity: 0; }
    10%  { opacity: 1; }
    85%  { opacity: 1; }
    100% { background-position: -140% 0; opacity: 0; }
  }
  .fx-shimmer-in #bugfx { animation: bugShimmerIn 1100ms ease-out; }
  .fx-shimmer-in #bugsheen { animation: bugShimmerSweep 1400ms ease-in-out; }

  /* The light comes back the other way and takes it with it. */
  @keyframes bugShimmerOut {
    0%   { opacity: 1; filter: brightness(1); }
    45%  { opacity: 1; filter: brightness(2.4); }
    100% { opacity: 0; filter: brightness(4); }
  }
  @keyframes bugShimmerSweepBack {
    0%   { background-position: -140% 0; opacity: 0; }
    12%  { opacity: 1; }
    100% { background-position: 140% 0; opacity: 0; }
  }
  .fx-shimmer-out #bugfx {
    animation: bugShimmerOut 1000ms ease-in forwards;
  }
  .fx-shimmer-out #bugsheen { animation: bugShimmerSweepBack 1000ms ease-in-out; }

  /* Rattles into place. */
  @keyframes bugBuzzIn {
    0%   { opacity: 0; transform: translate(-16px, 10px); }
    12%  { opacity: 1; transform: translate(12px, -8px) rotate(2deg); }
    26%  { transform: translate(-10px, -7px) rotate(-1.6deg); }
    40%  { transform: translate(8px, 6px) rotate(1.2deg); }
    54%  { transform: translate(-6px, 4px) rotate(-0.8deg); }
    68%  { transform: translate(4px, -3px); }
    82%  { transform: translate(-2px, 1px); }
    100% { opacity: 1; transform: translate(0, 0) rotate(0); }
  }
  .fx-buzz-in { animation: bugBuzzIn 1000ms steps(1, end); }

  /* Rattles itself apart. */
  @keyframes bugBuzzOut {
    0%   { opacity: 1; transform: translate(0, 0); }
    16%  { transform: translate(5px, -4px) rotate(1deg); }
    32%  { transform: translate(-8px, 6px) rotate(-1.6deg); }
    50%  { opacity: 1; transform: translate(12px, -9px) rotate(2.4deg); }
    68%  { opacity: 0.6; transform: translate(-17px, 12px) rotate(-3deg); }
    84%  { opacity: 0.25; transform: translate(22px, -15px) rotate(4deg); }
    100% { opacity: 0; transform: translate(-28px, 19px) rotate(-5deg); }
  }
  .fx-buzz-out { animation: bugBuzzOut 800ms steps(1, end) forwards; }

  /* Cuts in.

     THE TIMING HERE IS A SAFETY LIMIT, NOT A TASTE DECISION.
     This and the neon pair are the only animations that cut between fully
     visible and fully dark. Flashing faster than three times a second is the
     range that can trigger photosensitive seizures, and this plays on a screen
     twenty five people walk past. Every state change in these four keyframes
     is at least a third of a second from the next. Keep it that way: if you
     shorten the duration, take cuts out to match. */
  @keyframes bugFlashIn {
    0%   { opacity: 0; }
    25%  { opacity: 1; filter: brightness(2.6); }
    50%  { opacity: 0; }
    75%  { opacity: 1; filter: brightness(1.8); }
    100% { opacity: 1; filter: brightness(1); }
  }
  .fx-flash-in { animation: bugFlashIn 1500ms steps(1, end); }

  /* Cuts out, ending dark. */
  @keyframes bugFlashOut {
    0%   { opacity: 1; filter: brightness(1); }
    33%  { opacity: 0; }
    66%  { opacity: 1; filter: brightness(3); }
    100% { opacity: 0; }
  }
  .fx-flash-out { animation: bugFlashOut 1200ms steps(1, end) forwards; }

  /* Tears into place. */
  @keyframes bugGlitchIn {
    0%   { opacity: 0; clip-path: inset(0 0 70% 0); transform: translateX(-46px) skewX(-10deg); }
    10%  { opacity: 1; clip-path: inset(54% 0 18% 0); transform: translateX(40px) skewX(8deg); }
    22%  { clip-path: inset(12% 0 60% 0); transform: translateX(-32px) skewX(-6deg); }
    34%  { clip-path: inset(76% 0 2% 0);  transform: translateX(27px); }
    46%  { clip-path: inset(26% 0 46% 0); transform: translateX(-19px) skewX(5deg); }
    60%  { clip-path: inset(0 0 0 0);     transform: translateX(13px); }
    74%  { clip-path: inset(46% 0 26% 0); transform: translateX(-7px) skewX(-3deg); }
    88%  { clip-path: inset(0 0 0 0);     transform: translateX(3px); }
    100% { opacity: 1; clip-path: inset(0 0 0 0); transform: translateX(0) skewX(0); }
  }
  .fx-glitch-in { animation: bugGlitchIn 900ms steps(1, end); }

  /* Tears apart and is gone. */
  @keyframes bugGlitchOut {
    0%   { opacity: 1; clip-path: inset(0 0 0 0); transform: translateX(0); }
    14%  { clip-path: inset(0 0 58% 0); transform: translateX(18px) skewX(6deg); }
    28%  { clip-path: inset(62% 0 12% 0); transform: translateX(-26px) skewX(-8deg); }
    44%  { opacity: 1; clip-path: inset(20% 0 52% 0); transform: translateX(36px) skewX(11deg); }
    60%  { opacity: 0.7; clip-path: inset(70% 0 6% 0); transform: translateX(-48px) skewX(-14deg); }
    78%  { opacity: 0.35; clip-path: inset(34% 0 40% 0); transform: translateX(62px) skewX(18deg); }
    100% { opacity: 0; clip-path: inset(48% 0 48% 0); transform: translateX(-80px) skewX(-22deg); }
  }
  .fx-glitch-out { animation: bugGlitchOut 750ms steps(1, end) forwards; }

  /* A CRT switching on: a line of light that opens out. */
  @keyframes bugTvOn {
    0%   { opacity: 0; transform: scale(1.7, 0.004); filter: brightness(9); }
    18%  { opacity: 1; transform: scale(1.6, 0.008); filter: brightness(9); }
    40%  { transform: scale(1.5, 0.012); filter: brightness(8); }
    62%  { transform: scale(0.86, 1.28); filter: brightness(3.4); }
    78%  { transform: scale(1.12, 0.88); filter: brightness(1.9); }
    90%  { transform: scale(0.96, 1.05); filter: brightness(1.2); }
    100% { opacity: 1; transform: scale(1, 1); filter: brightness(1); }
  }
  .fx-tvon-in { animation: bugTvOn 950ms ease-out; }

  /* And switching off: collapses to a line, then a dot, then nothing. The one
     everybody recognises, so it has to land exactly. */
  @keyframes bugTvOff {
    0%   { opacity: 1; transform: scale(1, 1); filter: brightness(1); }
    30%  { opacity: 1; transform: scale(1.06, 0.72); filter: brightness(2.4); }
    52%  { opacity: 1; transform: scale(1.5, 0.012); filter: brightness(9); }
    72%  { opacity: 1; transform: scale(0.9, 0.008); filter: brightness(10); }
    88%  { opacity: 1; transform: scale(0.08, 0.008); filter: brightness(12); }
    100% { opacity: 0; transform: scale(0.01, 0.004); filter: brightness(14); }
  }
  .fx-tvoff-out { animation: bugTvOff 800ms cubic-bezier(0.5, 0, 0.75, 0) forwards; }

  /* Rolls up from below and catches. */
  @keyframes bugRollIn {
    0%   { opacity: 0; transform: translateY(190%); }
    10%  { opacity: 1; }
    26%  { transform: translateY(-150%); }
    44%  { transform: translateY(105%); }
    60%  { transform: translateY(-62%); }
    74%  { transform: translateY(34%); }
    86%  { transform: translateY(-16%); }
    94%  { transform: translateY(6%); }
    100% { opacity: 1; transform: translateY(0); }
  }
  .fx-roll-in { animation: bugRollIn 1150ms cubic-bezier(0.32, 0.75, 0.35, 1); }

  /* Loses hold and rolls away off the top. */
  @keyframes bugRollOut {
    0%   { opacity: 1; transform: translateY(0); }
    18%  { transform: translateY(22%); }
    36%  { transform: translateY(-48%); }
    56%  { transform: translateY(70%); }
    76%  { opacity: 1; transform: translateY(-130%); }
    88%  { opacity: 0.5; transform: translateY(160%); }
    100% { opacity: 0; transform: translateY(-240%); }
  }
  .fx-roll-out { animation: bugRollOut 850ms cubic-bezier(0.4, 0, 0.7, 0.2) forwards; }

  /* Slams in oversized and settles. */
  @keyframes bugPunchIn {
    0%   { opacity: 0; transform: scale(2.8); filter: blur(14px); }
    38%  { opacity: 1; transform: scale(0.78); filter: blur(0); }
    58%  { transform: scale(1.16); }
    74%  { transform: scale(0.94); }
    88%  { transform: scale(1.04); }
    100% { opacity: 1; transform: scale(1); filter: blur(0); }
  }
  .fx-punch-in { animation: bugPunchIn 800ms cubic-bezier(0.2, 1.1, 0.3, 1); }

  /* Winds back, then fires straight through the screen. */
  @keyframes bugPunchOut {
    0%   { opacity: 1; transform: scale(1); filter: blur(0); }
    30%  { opacity: 1; transform: scale(0.8); filter: blur(0); }
    100% { opacity: 0; transform: scale(3.4); filter: blur(18px); }
  }
  .fx-punch-out { animation: bugPunchOut 650ms cubic-bezier(0.5, 0, 0.9, 0.4) forwards; }

  /* Drops in and rocks to a stop. */
  @keyframes bugWobbleIn {
    0%   { opacity: 0; transform: rotate(-24deg) translateY(-46px); }
    14%  { opacity: 1; }
    32%  { transform: rotate(14deg); }
    48%  { transform: rotate(-9deg); }
    62%  { transform: rotate(6deg); }
    75%  { transform: rotate(-4deg); }
    87%  { transform: rotate(2deg); }
    100% { opacity: 1; transform: rotate(0); }
  }
  .fx-wobble-in { animation: bugWobbleIn 1200ms ease-out; }

  /* Rocks loose and falls off the bottom. */
  @keyframes bugWobbleOut {
    0%   { opacity: 1; transform: rotate(0) translateY(0); }
    18%  { transform: rotate(5deg); }
    36%  { transform: rotate(-8deg); }
    54%  { transform: rotate(13deg) translateY(6px); }
    72%  { opacity: 1; transform: rotate(-19deg) translateY(30px); }
    100% { opacity: 0; transform: rotate(34deg) translateY(150px); }
  }
  .fx-wobble-out { animation: bugWobbleOut 900ms cubic-bezier(0.5, 0, 0.9, 0.5) forwards; }

  /* Thrown on from off the left edge, which is the edge it lives on. If the
     bug is ever moved to the other side, this pair has to be mirrored with it
     or it will fly across the whole screen to reach a corner beside it. */
  @keyframes bugSlideIn {
    0%   { opacity: 0; transform: translateX(-180%) skewX(14deg); }
    16%  { opacity: 1; }
    58%  { transform: translateX(16%) skewX(-6deg); }
    76%  { transform: translateX(-6%) skewX(2deg); }
    90%  { transform: translateX(2%); }
    100% { opacity: 1; transform: translateX(0) skewX(0); }
  }
  .fx-slide-in { animation: bugSlideIn 900ms cubic-bezier(0.25, 1, 0.35, 1); }

  /* Winds back and leaves the same way it came. */
  @keyframes bugSlideOut {
    0%   { opacity: 1; transform: translateX(0) skewX(0); }
    26%  { transform: translateX(9%) skewX(-4deg); }
    100% { opacity: 0; transform: translateX(-190%) skewX(18deg); }
  }
  .fx-slide-out { animation: bugSlideOut 700ms cubic-bezier(0.5, 0, 0.8, 0.3) forwards; }

  /* An amber tube striking and levelling off. Same three-per-second limit as
     the flash pair above: two strikes, well apart, rather than a stutter. */
  @keyframes bugNeonIn {
    0%   { opacity: 0; filter: brightness(0.15) drop-shadow(0 0 0 rgba(255,166,43,0)); }
    18%  { opacity: 1; filter: brightness(2.8) drop-shadow(0 0 34px rgba(255,166,43,1)); }
    39%  { opacity: 0.2; filter: brightness(0.3); }
    60%  { opacity: 1; filter: brightness(2.4) drop-shadow(0 0 28px rgba(255,166,43,0.9)); }
    80%  { filter: brightness(1.3) drop-shadow(0 0 16px rgba(255,166,43,0.65)); }
    100% { opacity: 1; filter: brightness(1) var(--bug-shadow); }
  }
  .fx-neon-in { animation: bugNeonIn 1800ms ease-out; }

  /* The tube dying: one last surge, then it gutters out. */
  @keyframes bugNeonOut {
    0%   { opacity: 1; filter: brightness(1) var(--bug-shadow); }
    25%  { opacity: 1; filter: brightness(3.2) drop-shadow(0 0 40px rgba(255,166,43,1)); }
    50%  { opacity: 0.15; filter: brightness(0.2); }
    75%  { opacity: 0.9; filter: brightness(1.6) drop-shadow(0 0 18px rgba(255,166,43,0.7)); }
    100% { opacity: 0; filter: brightness(0.1); }
  }
  .fx-neon-out { animation: bugNeonOut 1400ms ease-in forwards; }

  /* ---- The idle loop ----------------------------------------------------
     What the bug does between its entrance and its exit. Without this it
     lands, sits dead still for eight seconds, then moves again, which reads
     as two separate events rather than one continuous presence.

     These are deliberately small. Anything you can consciously watch is too
     much: they are here so the corner of the screen is never quite static,
     not so anybody looks at it. Each one loops forever and MUST start and end
     on identical values, or every cycle will visibly jump.

     Adding another is the same three steps as a headline animation, with the
     name going in BUG_IDLES instead. */

  /* Light drifts across every few seconds. */
  @keyframes idleShimmer {
    0%   { background-position: 140% 0; opacity: 0; }
    6%   { opacity: 0.75; }
    30%  { background-position: -140% 0; opacity: 0.75; }
    36%  { background-position: -140% 0; opacity: 0; }
    100% { background-position: 140% 0; opacity: 0; }
  }
  .idle-shimmer #bugsheen { animation: idleShimmer 5200ms ease-in-out infinite; }

  /* Warm amber halo, in and out. */
  @keyframes idleGlow {
    0%, 100% { filter: var(--bug-shadow); }
    50%      { filter: var(--bug-shadow)
                       drop-shadow(0 0 13px rgba(255,166,43,0.75)); }
  }
  .idle-glow #bugfx img { animation: idleGlow 2600ms ease-in-out infinite; }

  /* A hard white edge that comes up and goes again. */
  @keyframes idleOutline {
    0%, 100% { filter: var(--bug-shadow); }
    50%      { filter: drop-shadow(0 0 1px rgba(255,255,255,0.95))
                       drop-shadow(0 0 2px rgba(255,255,255,0.8))
                       var(--bug-shadow); }
  }
  .idle-outline #bugfx img { animation: idleOutline 3000ms ease-in-out infinite; }

  /* Breathing. Barely there. */
  @keyframes idleBreathe {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.035); }
  }
  .idle-breathe #bugfx { animation: idleBreathe 3400ms ease-in-out infinite; }

  /* Hanging on the corner, moving slightly. */
  @keyframes idleSway {
    0%, 100% { transform: rotate(-0.7deg); }
    50%      { transform: rotate(0.7deg); }
  }
  .idle-sway #bugfx { animation: idleSway 4200ms ease-in-out infinite; }

  /* Floating, as if it is not quite fixed to the glass. */
  @keyframes idleFloat {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-5px); }
  }
  .idle-float #bugfx { animation: idleFloat 3800ms ease-in-out infinite; }

  /* The signal not quite locking. Long stretches of nothing, then a blink. */
  @keyframes idleFlicker {
    0%, 88%, 100% { opacity: 1; }
    90%  { opacity: 0.45; }
    92%  { opacity: 1; }
    94%  { opacity: 0.6; }
    96%  { opacity: 1; }
  }
  .idle-flicker #bugfx { animation: idleFlicker 4600ms steps(1, end) infinite; }

  #videobar {
    z-index: 8;
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
    padding: 8vh 4vw 4vh;
    background: linear-gradient(to top, rgba(0,0,0,0.92), rgba(0,0,0,0));
    pointer-events: none;
  }
  /* The MTV lower third. Four lines, lower left, artist first then song,
     album, label. Plain white with a hard drop shadow, which is what a
     broadcast character generator produced and what made it readable over
     any footage. No box, no colour, no accent: that is the whole look. */
  #vcard {
    min-width: 0;
    font-family: 'Josefin Sans', 'Century Gothic', system-ui, sans-serif;
    color: #fff;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.85);
    line-height: 1.24;
    opacity: 0;
    transition: opacity 0.45s ease;
  }
  #vcard.up { opacity: 1; }

  .vartist {
    font-weight: 700;
    font-size: clamp(22px, 4.6vh, 56px);
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  .vtitle {
    font-weight: 600;
    font-size: clamp(19px, 3.9vh, 47px);
  }
  /* The dedication. Amber, italic, and pushed away from the metadata above it,
     because it is the one line down here that a person wrote rather than a
     record label. It has to read as a message, not as a fifth credit. */
  .vdedication {
    font-style: italic;
    font-weight: 600;
    font-size: clamp(17px, 3.2vh, 38px);
    color: var(--amber);
    margin-top: 1.1vh;
    padding-left: 0.6vw;
    border-left: 0.35vh solid var(--amber);
    max-width: 46vw;
  }
  .vdedication:empty { display: none; }

  .valbum,
  .vlabel {
    font-weight: 400;
    font-size: clamp(15px, 2.8vh, 33px);
    color: rgba(255,255,255,0.9);
  }

  .vright {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 1.6vh;
    text-align: right;
    flex-shrink: 0;
  }

  .vcredit {
    font-family: 'Bebas Neue', system-ui, sans-serif;
    font-size: clamp(14px, 2vh, 24px);
    letter-spacing: 0.1em;
    color: var(--amber);
    white-space: nowrap;
    align-self: stretch;
    text-align: right;
    border-top: 1px solid rgba(247,241,230,0.16);
    padding-top: 1.2vh;
  }

  #vnext {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 0.8vh;
    max-height: 52vh;
    overflow: hidden;
  }
  #vnext .head {
    font-family: 'Bebas Neue', system-ui, sans-serif;
    font-size: clamp(11px, 1.5vh, 17px);
    letter-spacing: 0.2em;
    color: rgba(247,241,230,0.45);
  }
  /* Artwork sits on the outside edge so the covers form a clean column down
     the right of the screen and the text stays flush against them. */
  #vnext .row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  #vnext .row img {
    width: clamp(28px, 4.4vh, 50px);
    height: clamp(28px, 4.4vh, 50px);
    border-radius: 4px;
    object-fit: cover;
    background: rgba(247,241,230,0.08);
    flex-shrink: 0;
    order: 2;
  }
  /* Titles are capped at roughly the width of "Cats in the Cradle" so the
     column has a straight left edge instead of one line running twice as far
     out as the rest. Anything longer gets an ellipsis. */
  #vnext .row .rtext {
    min-width: 0;
    /* shorten() in the script does the actual cutting, to an exact character
       count. This is only a backstop for a string of very wide characters
       that still overruns at that length. */
    max-width: 13ch;
  }
  #vnext .row b {
    display: block;
    font-weight: 600;
    font-size: clamp(13px, 1.9vh, 22px);
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #vnext .row span {
    display: block;
    font-size: clamp(11px, 1.5vh, 16px);
    color: rgba(247,241,230,0.5);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #vnext .none {
    color: rgba(247,241,230,0.45);
    font-size: clamp(13px, 1.8vh, 20px);
  }

  #stage {
    position: relative;
    height: 100%;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: 3.5vh 4vw;
    gap: 2vh;
  }

  .bar {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 20px;
  }
  /* The lockup, in place of the typed name. Wide rather than square, so it
     takes the space the wordmark had. Sized by width; height follows. */
  .wordmark { display: block; line-height: 0; }
  .wordmark img {
    width: clamp(150px, 19vh, 300px);
    height: auto;
    display: block;
  }
  .lamp {
    font-size: clamp(12px, 1.5vh, 16px);
    color: var(--dim);
    display: flex;
    align-items: center;
    gap: 9px;
  }
  .lamp i {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #4e4741;
    display: block;
  }
  .lamp.live i {
    background: var(--amber);
    box-shadow: 0 0 12px var(--amber);
  }

  .now {
    display: grid;
    grid-template-columns: auto 1fr;
    align-items: center;
    gap: 4.5vw;
    min-height: 0;
  }

  .sleeve {
    position: relative;
    height: min(52vh, 46vw);
    width: min(52vh, 46vw);
    border-radius: 6px;
    background: rgba(255,255,255,0.05);
    box-shadow:
      0 30px 70px rgba(0,0,0,0.75),
      0 0 0 1px rgba(255,255,255,0.09) inset;
    overflow: hidden;
  }
  .sleeve img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    opacity: 0;
    transition: opacity 0.7s ease;
  }
  .sleeve img.on { opacity: 1; }

  .eyebrow {
    font-family: 'Bebas Neue', system-ui, sans-serif;
    font-size: clamp(14px, 1.9vh, 22px);
    letter-spacing: 0.28em;
    color: var(--amber);
    margin-bottom: 0.5em;
  }

  h1 {
    font-family: 'Bebas Neue', system-ui, sans-serif;
    font-weight: 400;
    font-size: clamp(42px, 11vh, 150px);
    line-height: 0.92;
    margin: 0 0 0.12em;
    text-shadow: 0 4px 40px rgba(0,0,0,0.6);
    overflow-wrap: anywhere;
  }

  .artist {
    font-size: clamp(18px, 3.4vh, 44px);
    font-weight: 500;
    color: rgba(247, 241, 230, 0.72);
    margin: 0 0 0.7em;
  }

  .credit {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: clamp(13px, 1.8vh, 20px);
    letter-spacing: 0.04em;
    padding: 0.5em 1.1em;
    border-radius: 999px;
    border: 1px solid rgba(255, 166, 43, 0.4);
    color: var(--amber);
    opacity: 0;
    transition: opacity 0.5s ease;
  }
  .credit.on { opacity: 1; }

  .track {
    margin-top: 2.2vh;
    height: 3px;
    width: min(560px, 100%);
    background: rgba(255,255,255,0.14);
    border-radius: 2px;
    overflow: hidden;
  }
  .track b {
    display: block;
    height: 100%;
    width: 0%;
    background: var(--amber);
    box-shadow: 0 0 14px rgba(255,166,43,0.7);
    transition: width 1s linear;
  }

  .queue h2 {
    font-family: 'Bebas Neue', system-ui, sans-serif;
    font-weight: 400;
    font-size: clamp(13px, 1.7vh, 19px);
    letter-spacing: 0.26em;
    color: var(--dim);
    margin: 0 0 1.1vh;
  }
  .cards {
    display: flex;
    gap: 14px;
    overflow: hidden;
  }
  .card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 16px 9px 9px;
    background: rgba(255,255,255,0.055);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 5px;
    min-width: 0;
    flex: 0 1 auto;
  }
  .card .pos {
    font-family: 'Bebas Neue', system-ui, sans-serif;
    font-size: clamp(18px, 2.6vh, 30px);
    color: var(--amber);
    width: 1.2em;
    text-align: center;
    flex-shrink: 0;
  }
  .card img {
    width: clamp(38px, 5.4vh, 60px);
    height: clamp(38px, 5.4vh, 60px);
    border-radius: 3px;
    object-fit: cover;
    background: rgba(255,255,255,0.08);
    flex-shrink: 0;
  }
  .card div { min-width: 0; }
  .card b {
    display: block;
    font-weight: 600;
    font-size: clamp(13px, 1.8vh, 19px);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 20vw;
  }
  .card span {
    font-size: clamp(11px, 1.4vh, 15px);
    color: var(--amber);
  }
  .idle {
    font-size: clamp(13px, 1.8vh, 19px);
    color: var(--dim);
  }

  #start {
    position: fixed;
    inset: 0;
    background: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 26px;
    z-index: 20;
    text-align: center;
    padding: 8vw;
  }
  #start .wordmark img { width: clamp(240px, 34vh, 520px); }
  #start p { color: var(--dim); max-width: 34ch; line-height: 1.55; margin: 0; }
  /* Anything that goes wrong before the jukebox is running is said HERE.
   #status lives inside the player behind this overlay, so every message
   written there while the start screen is up is invisible: the screen looks

let ytApiReady = false;

const el = id => document.getElementById(id);

if (location.search.indexOf("debug=1") !== -1) {

  el("lamp").classList.toggle("live", !!live);
}

 */
function startMessage(text) {
  const box = el("startmsg");
  if (box) box.textContent = text || "";
  setStatus(text);
  if (text) debugLine(text);
}


/** Prints one line to the diagnostics strip. Hidden unless ?debug=1. */
function debugLine(text) {
  const box = el("debug");
  box.textContent = new Date().toLocaleTimeString() + "  " + text + "\n"
    + box.textContent.split("\n").slice(0, 11).join("\n");
}

/** Calls the Apps Script API. Returns the parsed response, or null on failure. */
async function api(action, params) {
  const url = new URL(API_URL);
  url.searchParams.set("action", action);
  Object.entries(params || {}).forEach(([k, v]) => url.searchParams.set(k, v));

  // Browsers cache repeated GETs to the same address. Without this the player
  // replays the first answer forever and never sees a new request.
  url.searchParams.set("nocache", Date.now() + "" + Math.random());

  // Tried twice before giving up. Apps Script goes cold when nobody has used it
  // for a while, and the first request after that can be slow enough to fail
  // outright. One retry turns "cannot reach the queue" on startup into a pause
  // nobody notices, and costs nothing when the first attempt works.
  for (let attempt = 1; attempt <= API_ATTEMPTS; attempt++) {
    try {
      const response = await fetch(url, { cache: "no-store" });
      const body = await response.text();
      debugLine(action + " -> HTTP " + response.status + " " + safeToShow(body));
      return JSON.parse(body);
    } catch (error) {
      debugLine(action + " -> attempt " + attempt + " failed: " + error.message);

      if (attempt < API_ATTEMPTS) {
        await new Promise(resolve => setTimeout(resolve, API_RETRY_MS));
        continue;
      }

      setStatus("cannot reach the queue");
      return null;
    }
  }

  return null;
}


/**
 * Trims an API response for the diagnostics strip and takes the banned word
 * list out of it.
 *
 * That list arrives with every single queue answer, so without this the strip
 * is a wall of slurs on a screen wired to the warehouse wall. The words still
 * do their job, they are just never drawn.
 */
function safeToShow(body) {
  return String(body)
    .replace(/"banned":\[[^\]]*\]/g, '"banned":[filtered word list]')
    .slice(0, 400);
}

/**
 * Finds this device's public address. Everyone on the shop WiFi shares one.
 * Forced to IPv4 so the player and the phones are always comparing like for
 * like. Falls back to Cloudflare if ipify is unreachable.
 */
async function publicAddress() {
  try {
    const response = await fetch("https://api.ipify.org?format=json");
    const data = await response.json();
    if (data.ip) return data.ip;
  } catch (error) {
    // Fall through to the backup.
  }

  try {
    const response = await fetch("https://www.cloudflare.com/cdn-cgi/trace");
    const text = await response.text();
    const line = text.split("\n").filter(row => row.indexOf("ip=") === 0)[0];
    if (line) return line.slice(3).trim();
  } catch (error) {
    // No address available.
  }

  return null;
}

/**
 * Finds the official music video for a queued song, or null if Apple does not
 * have one. Matches on artist so a cover version does not sneak in, and skips
 * anything explicit for the same reason the audio side does.
 */
// Apple video lookups are memoised. The house rotation screens tracks by
// asking for their video before deciding to play them, and without this every
// track would be searched twice: once to screen it, once to play it.
const appleVideoMemo = new Map();

async function musicVideoFor(title, artist) {
  const key = title + "|" + artist;
  if (appleVideoMemo.has(key)) return appleVideoMemo.get(key);

  const found = await findMusicVideo(title, artist);
  appleVideoMemo.set(key, found);
  return found;
}


async function findMusicVideo(title, artist) {
  try {
    const response = await music.api.music("/v1/catalog/us/search", {
      term: title + " " + artist,
      types: ["music-videos"],
      limit: 8
    });

    const found = response.data.results["music-videos"];
    if (!found) return null;

    const song = bareTitle(title);

    const match = found.data.filter(video => {
      if (video.attributes.contentRating === "explicit") return false;

      // Both checks are needed. The artist check alone was the original bug:
      // a search for one song returns the band's whole video catalog, every
      // one of them passes an artist-only test, and the first is whatever
      // Apple ranks highest. That is how a request for Cats in the Cradle
      // played I Hate Everything About You.
      if (!sameArtist(video.attributes.artistName, artist)) return false;
      return mentions(video.attributes.name, song);
    })[0];

    return match || null;
  } catch (error) {
    return null;
  }
}


/**
 * Strips the bracketed extras Apple hangs off song titles, so a track called
 * "Daughter (Remastered)" still matches a video called plainly "Daughter".
 */
function bareTitle(title) {
  return String(title || "").replace(/[\(\[][^\)\]]*[\)\]]/g, " ").trim();
}


// ---------------------------------------------------------------------------
// The YouTube fallback
//
// Apple stays in charge of everything: drivers search Apple's catalog, Apple's
// explicit flag filters the results, and Apple supplies the title and artist.
// Only when Apple has no video does any of this run, and it runs against that
// already-vetted title and artist rather than an open search box.
// ---------------------------------------------------------------------------

/**
 * Finds an official music video on YouTube for a song Apple has no video for.
 * Returns a video ID, or null when nothing survives the checks below.
 *
 * Google allows roughly 100 searches per project per day, so every answer is
 * remembered, including the answer "there isn't one". No song is looked up
 * twice, which keeps a busy Friday well inside the allowance.
 */
async function youtubeVideoFor(songId, title, artist, durationMs) {
  if (!YOUTUBE_KEY) return null;

  // A hand-pinned answer beats everything, and costs no quota.
  if (Object.prototype.hasOwnProperty.call(VIDEO_OVERRIDES, songId)) {
    const pinned = VIDEO_OVERRIDES[songId];
    debugLine("youtube: pinned by hand, " + (pinned || "audio only"));
    return pinned || null;
  }

  // Held so the error handler can forget this exact entry if the video turns
  // out to be dead, without needing the title passed to it from three files
  // away.
  lastVideoKey = videoKey(songId, title, artist);

  const remembered = rememberedVideo(lastVideoKey);
  if (remembered !== undefined) {
    debugLine("youtube: remembered " + (remembered || "nothing suitable"));
    return remembered;
  }

  try {
    const found = await youtubeSearch(title + " " + artist + " official video");
    const chosen = await pickVideo(found, title, artist, durationMs);

    rememberVideo(lastVideoKey, chosen);
    debugLine("youtube: " + (chosen || "nothing suitable"));
    return chosen;
  } catch (error) {
    debugLine("youtube lookup failed: " + (error.message || error));
    return null;
  }
}


/**
 * The expensive call, at 100 quota units. videoEmbeddable=true asks Google to
 * leave out anything that cannot be played off YouTube, which is most of what
 * would otherwise come back as a dead frame.
 */
async function youtubeSearch(term) {
  const url = "https://www.googleapis.com/youtube/v3/search"
    + "?part=snippet&type=video&videoEmbeddable=true&maxResults=8"
    + "&q=" + encodeURIComponent(term)
    + "&key=" + YOUTUBE_KEY;

  const response = await fetch(url);
  const data = await response.json();

  if (data.error) throw new Error(data.error.message);
  return data.items || [];
}


/** The cheap call, at one unit for the whole batch however many parts we ask for. */
async function youtubeDetails(ids) {
  const url = "https://www.googleapis.com/youtube/v3/videos"
    + "?part=snippet,contentDetails,status,statistics"
    + "&id=" + ids
    + "&key=" + YOUTUBE_KEY;

  const response = await fetch(url);
  const data = await response.json();

  if (data.error) throw new Error(data.error.message);
  return data.items || [];
}


/**
 * Picks the best candidate rather than the first acceptable one.
 *
 * This runs in two passes. The first throws out anything that must never play:
 * covers, karaoke, hour-long uploads, and YouTube's auto-generated "- Topic"
 * channels, which are album audio sitting behind a still of the album cover.
 * The second ranks whatever is left and takes the winner.
 *
 * Ranking rather than requiring an official channel matters for older catalog.
 * Plenty of pre-2000 videos were never uploaded by the label at all, and the
 * only copy that exists is a fan rip. Demanding an official channel there does
 * not get the official video, it just guarantees the album cover wins.
 */
async function pickVideo(candidates, title, artist, durationMs) {
  if (candidates.length === 0) {
    debugLine("youtube: the search itself returned nothing");
    return null;
  }

  const ids = candidates.map(item => item.id.videoId).join(",");
  const details = await youtubeDetails(ids);

  // A video may run longer than the track for an intro or an outro, but not by
  // several minutes. Without a length from Apple, allow up to fifteen minutes,
  // which is generous enough for Thriller and mean enough for a mixtape.
  const songSeconds = Math.round((durationMs || 0) / 1000);
  const ceiling = songSeconds ? (songSeconds * 2) + 120 : 900;

  let best = null;
  let bestScore = 0;

  for (let i = 0; i < details.length; i++) {
    const video = details[i];
    const name = video.snippet.title;
    const channel = video.snippet.channelTitle;
    const seconds = secondsFrom(video.contentDetails.duration);

    // WHY A CANDIDATE WAS TURNED AWAY, IN THE DEBUG STRIP.
    //
    // Without this, a song that plays as audio gives you one line saying
    // "nothing suitable" and no way to tell a genuine rejection from a rule
    // that is too strict. Working out why one song came up audio-only meant
    // guessing at eight rules in the dark. Now it says.
    const reject = why => {
      debugLine("  rejected: " + name.slice(0, 52) + "  [" + channel + "]  "
        + why);
    };

    if (!video.status.embeddable) { reject("embedding off"); continue; }
    if (isTopicChannel(channel)) { reject("auto-generated topic channel"); continue; }
    if (isFoul(name)) { reject("banned word in the title"); continue; }
    if (looksWrong(name)) { reject("title says it is not the video"); continue; }
    if (seconds > ceiling) { reject("too long, " + seconds + "s vs " + ceiling + "s"); continue; }

    // The title has to actually name the song, and the artist has to appear
    // somewhere, either in the title or in the channel. That is what keeps a
    // stranger's unrelated upload out without demanding an official channel.
    if (!mentions(name, bareTitle(title))) { reject("title does not name the song"); continue; }
    if (!mentions(name, artist) && !sameArtist(channel, artist)) {
      reject("artist nowhere in the title or channel");
      continue;
    }

    // Proof that this IS the official video, rather than merely the absence of
    // anything suspicious. Plenty of songs never had a video, and for those
    // YouTube still offers a well-made fan edit with the right song, the right
    // length and the artist in the title, which passes every check above.
    // Fade to Black is the worked example: no official video was ever made,
    // and the search returns somebody's cut of Saving Private Ryan.
    //
    // Songs that fail this play as audio, which is the intended behaviour.
    // Genuine official videos that only exist as fan uploads go in
    // VIDEO_OVERRIDES at the top of this file.
    if (!sameArtist(channel, artist) && !saysOfficial(name)) {
      reject("not the artist's channel and the title never says official");
      continue;
    }

    const score = scoreVideo(video, artist, seconds, songSeconds);
    debugLine("  passed: " + name.slice(0, 52) + "  [" + channel + "]  score "
      + score);

    if (score > bestScore) {
      bestScore = score;
      best = video.id;
    }
  }

  return best;
}


/**
 * Ranks a surviving candidate. The artist's own channel wins when it exists,
 * a title that says official video is worth a lot, and a length that matches
 * Apple's to the second is the strongest sign it is the real thing. View count
 * only breaks ties between otherwise equal candidates.
 */
function scoreVideo(video, artist, seconds, songSeconds) {
  const name = String(video.snippet.title).toLowerCase();
  const channel = video.snippet.channelTitle;
  let score = 1;

  // The artist's own channel, or their Vevo one, beats everything else.
  if (sameArtist(channel, artist)) score += 60;

  if (name.indexOf("official video") !== -1
      || name.indexOf("official music video") !== -1) {
    score += 25;
  }

  if (songSeconds) {
    const off = Math.abs(seconds - songSeconds);
    if (off <= 20) score += 30;
    else if (off <= 60) score += 15;
  }

  const views = Number((video.statistics || {}).viewCount || 0);
  if (views > 0) score += Math.min(30, Math.log10(views) * 4);

  return score;
}


/**
 * True for YouTube's auto-generated artist channels, which are named
 * "Artist - Topic" and host album audio behind a still of the cover art.
 * They match the artist name exactly, so they have to be named and excluded.
 */
function isTopicChannel(channel) {
  return / - topic$/.test(String(channel || "").toLowerCase().trim());
}


/**
 * True when the title claims to be the official video. Uploaders who are
 * posting the real thing say so; people posting their own edit generally do
 * not, because saying it invites a takedown.
 */
function saysOfficial(title) {
  const lower = String(title || "").toLowerCase();
  return lower.indexOf("official video") !== -1
    || lower.indexOf("official music video") !== -1
    || lower.indexOf("official promo") !== -1;
}


/** True when a video title names the thing we are looking for. */
function mentions(haystack, needle) {
  const inside = squash(haystack);
  const wanted = squash(needle);
  return wanted.length > 0 && inside.indexOf(wanted) !== -1;
}


/**
 * True when a YouTube channel belongs to the artist. Squashing both names
 * down is what lets "The Dead Milkmen" match a channel called
 * "DeadMilkmenVEVO".
 */
function sameArtist(channel, artist) {
  const theirs = squash(channel);
  const wanted = squash(artist);
  if (!theirs || !wanted) return false;
  return theirs.indexOf(wanted) !== -1 || wanted.indexOf(theirs) !== -1;
}


/** Lowercases a name and strips VEVO, a leading "the", spaces and punctuation. */
function squash(text) {
  return String(text || "")
    .toLowerCase()
    .replace(/vevo/g, "")
    .replace(/^the /, "")
    .replace(/[^a-z0-9]/g, "");
}


/** True when text contains something that cannot go over the dock speakers. */
function isFoul(text) {
  const haystack = " " + String(text || "").toLowerCase() + " ";
  return bannedWords.some(word => haystack.indexOf(word) !== -1);
}


/** True when the title says this is a cover, a live take, or an hour of it. */
function looksWrong(title) {
  const lower = String(title || "").toLowerCase();
  return NOT_THE_VIDEO.some(word => lower.indexOf(word) !== -1);
}


/** Turns YouTube's PT4M13S duration into plain seconds. */
function secondsFrom(iso) {
  const parts = String(iso || "").match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
  if (!parts) return 0;

  return (Number(parts[1] || 0) * 3600)
    + (Number(parts[2] || 0) * 60)
    + Number(parts[3] || 0);
}


/**
 * What YouTube said about a song last time. Returns undefined when the song
 * has never been looked up, and null when it was looked up and nothing was
 * worth playing, so a fruitless search is never repeated either.
 *
 * The number in the key is the version of the picking rules. Raise it whenever
 * those rules change and every remembered answer is quietly thrown away, so a
 * song that was matched badly gets a second chance under the new rules.
 */
// Bumping this throws away every remembered answer on every player. Do it when
// the picking rules change, or when a run of bad answers needs clearing out.
// Went to 4 because a spell of broken builds cached "no video" against songs
// that plainly have one.
const PICKER_VERSION = 5;

// How long a NO is trusted before the song is looked at again.
//
// A yes is permanent: a video that exists carries on existing. A no is not,
// because it can mean the search quota ran out, the network hiccupped, or the
// player was mid-repair, and none of those are facts about the song. Stored
// without an expiry, one bad evening marked songs as having no video forever
// and nothing ever reconsidered. Re-checking a handful of songs a week costs
// almost nothing against a hundred searches a day.
const NEGATIVE_DAYS = 7;

// The key of the decision made for the song now playing, so a dead video can
// be forgotten from the error handler.
let lastVideoKey = "";

/**
 * The key a decision is filed under.
 *
 * THE TITLE IS PART OF IT, AND THAT IS THE POINT.
 * The key used to be the Apple song ID alone. Then Sheets turned the title
 * "3AM" into a date, the picker searched YouTube for
 * "1899-12-30T08:00:00.000Z Matchbox Twenty", found nothing, and filed a no
 * against that song ID. Correcting the title changed nothing, because the ID
 * had not changed, so the song stayed videoless behind a cached answer to a
 * question nobody would ask again.
 *
 * A remembered answer is only about the exact title and artist that were
 * searched. Put those in the key and a corrected title looks like a new
 * question, which is exactly what it is. Every song poisoned that way fixes
 * itself the next time it is played.
 */
function videoKey(songId, title, artist) {
  return "yt" + PICKER_VERSION + ":" + songId + ":"
    + squash(String(title || "") + String(artist || ""));
}


/**
 * What we last decided about this song.
 *
 * Returns a video ID, or null for a no that is still current, or undefined
 * meaning nothing is known and it should be looked up. An expired no comes
 * back as undefined, which is the whole point: the song gets another chance.
 */
function rememberedVideo(key) {
  try {
    const stored = localStorage.getItem(key);
    if (stored === null) return undefined;

    if (stored.indexOf("none") !== 0) return stored;

    // "none:<when>" is the current shape. A bare "none" is from before nos
    // expired, so it is treated as expired and looked up again.
    const when = Number(stored.split(":")[1]);
    if (!when) return undefined;

    const age = Date.now() - when;
    return age < NEGATIVE_DAYS * 86400000 ? null : undefined;
  } catch (error) {
    return undefined;
  }
}


function rememberVideo(key, videoId) {
  try {
    localStorage.setItem(key, videoId || ("none:" + Date.now()));
  } catch (error) {
    // A full or disabled store only means the song gets looked up again.
  }
}


// YouTube error codes that mean this video is never coming back: a bad ID, a
// deleted or private video, and embedding switched off by the owner. Code 5 is
// left out on purpose. It is the player failing rather than the video being
// gone, and forgetting on it would spend a search from a small daily allowance
// on a video that is still perfectly fine.
const GONE_FOR_GOOD = [2, 100, 101, 150];


/**
 * Throws away a remembered video that has since been deleted or locked down.
 *
 * Fan uploads are the only copy of plenty of older videos, and those channels
 * disappear. Without this the dead ID would be remembered forever and every
 * future request for the song would stall on a failed load before dropping to
 * audio. Forgetting it means the next request quietly finds a live one.
 */
function forgetIfGone(errorCode) {
  if (!lastVideoKey) return;
  if (GONE_FOR_GOOD.indexOf(errorCode) === -1) return;

  try {
    localStorage.removeItem(lastVideoKey);
    debugLine("forgot the dead video for this song, will look again next time");
  } catch (error) {
    // Nothing to do. The worst case is it gets looked up again anyway.
  }
}


// The YouTube API calls this by name once it has finished loading.
function onYouTubeIframeAPIReady() {
  ytApiReady = true;
  buildYouTubePlayer();
  debugLine("youtube player ready");
}


/**
 * Builds the one YouTube player this page will ever use, silent and hidden,
 * as soon as the API is available.
 *
 * WHY IT IS BUILT HERE AND NOT WHEN THE FIRST VIDEO IS NEEDED.
 * A cross-origin iframe is only allowed to make noise if it was already in the
 * page the last time somebody touched the screen. Building it on demand meant
 * it appeared seconds after the Start press, inherited nothing, and parked on
 * the poster frame waiting for a tap. That is fine on a Mac, where the rule is
 * looser, and useless on the iPad, which is the only machine that matters.
 * Built here, it is present for the Start press and may play on a timer for
 * the rest of the session.
 */
function buildYouTubePlayer() {
  if (ytPlayer) return;

  ytPlayer = new YT.Player("ytmount", {
    videoId: YT_UNLOCK_VIDEO,
    playerVars: { autoplay: 0, playsinline: 1, rel: 0, controls: 0 },
    events: {
      onStateChange: event => {
        // onYouTube is what separates a real song from the parked video and
        // from the silent unlock. Without it the unlock would look like a
        // song ending and the jukebox would skip its own first request.
        if (event.data === YT.PlayerState.ENDED
            && onYouTube
            && (currentQueueId || houseTrack)) {
          trackFinished = true;
          debugLine("youtube video finished, advancing");
          tick();
        }
      },
      onError: event => {
        if (!onYouTube) {
          debugLine("youtube parked video is dead, change YT_UNLOCK_VIDEO");
          return;
        }
        debugLine("youtube error " + event.data + ", playing the audio instead");
        forgetIfGone(event.data);
        fallBackToAudio();
      }
    }
  });
}


/**
 * Opens the gate for YouTube sound. Called during the Start press, next to
 * unlockAudio, which does the same job for Apple.
 *
 * The parked video is played muted for a moment and stopped. The video is not
 * the point. The point is that the play command goes out while the browser
 * still counts a finger as having just touched the screen.
 */
async function unlockYouTube() {
  if (!ytPlayer || !ytPlayer.playVideo) {
    debugLine("youtube not ready at start, the first video may need a tap");
    return;
  }

  // Shown, because a hidden frame is allowed to refuse to play. The Start
  // screen is still up and covers all of this.
  el("videostage").classList.add("on");
  el("ytframe").classList.add("on");

  try {
    ytPlayer.mute();
    ytPlayer.playVideo();
    await new Promise(resolve => setTimeout(resolve, 600));
    ytPlayer.stopVideo();
  } catch (error) {
    debugLine("youtube unlock failed: " + error.message);
  } finally {
    ytPlayer.unMute();
    ytPlayer.setVolume(100);
    el("ytframe").classList.remove("on");
    el("videostage").classList.remove("on");
  }
}


/** Puts a YouTube video on the stage and reports back when it ends. */
function playYouTube(videoId) {
  onYouTube = true;
  el("ytframe").classList.add("on");

  // Normally already built at page load. This covers the API arriving late.
  if (!ytPlayer) buildYouTubePlayer();

  if (!ytPlayer || !ytPlayer.loadVideoById) {
    debugLine("youtube player unavailable, playing the audio instead");
    fallBackToAudio();
    return;
  }

  ytPlayer.loadVideoById(videoId);
  ytPlayer.unMute();
  ytPlayer.setVolume(100);
  ytPlayer.playVideo();
}


/** Takes the YouTube player off the stage and silences it. */
function stopYouTube() {
  onYouTube = false;
  el("ytframe").classList.remove("on");
  if (ytPlayer && ytPlayer.stopVideo) ytPlayer.stopVideo();
}


/**
 * Used when a YouTube video fails after we have already committed to it.
 * The driver still hears their song, just without the picture.
 */
async function fallBackToAudio() {
  stopYouTube();
  showVideoStage(false);

  if (!currentSongId) return;

  try {
    await music.setQueue({ song: currentSongId, startPlaying: true });
    setStatus("video would not play, playing the track", true);
  } catch (error) {
    trackFinished = true;
  }
}


/**
 * MusicKit builds its video element wherever it likes, sometimes inside a
 * shadow root, and tears it down between songs. This hunts the whole page for
 * it, drags it into our box, and forces it visible.
 */
function attachScreen() {
  music.videoContainerElement = el("screen");

  const video = findVideoElement(document);
  if (!video) return false;

  // Moving it around the page is fragile. Instead, pin the element itself over
  // the whole screen wherever MusicKit decided to put it.
  video.style.cssText = [
    "position: fixed",
    "left: 0",
    "top: 0",
    "width: 100vw",
    "height: 100vh",
    "object-fit: contain",
    "background: #000",
    "z-index: 7",
    "display: block",
    "visibility: visible",
    "opacity: 1"
  ].join(" !important;") + " !important;";

  video.removeAttribute("hidden");
  video.setAttribute("playsinline", "");

  if (!video.dataset.jukeboxFound) {
    video.dataset.jukeboxFound = "1";
    const parent = video.parentElement;
    debugLine("video element found inside <"
      + (parent ? parent.tagName.toLowerCase() : "none")
      + (parent && parent.id ? " id=" + parent.id : "") + ">");
  }

  return true;
}

/** Depth-first search for a video element, shadow roots included. */
function findVideoElement(root) {
  const direct = root.querySelector ? root.querySelector("video") : null;
  if (direct) return direct;

  const all = root.querySelectorAll ? root.querySelectorAll("*") : [];
  for (const node of all) {
    if (node.shadowRoot) {
      const found = findVideoElement(node.shadowRoot);
      if (found) return found;
    }
  }
  return null;
}

/**
 * Keeps looking for a few seconds after a video starts, because MusicKit does
 * not create the element until the stream is actually ready.
 */
function chaseVideoElement() {
  let tries = 0;
  const hunt = setInterval(() => {
    tries++;
    if (attachScreen() || tries > 24) {
      clearInterval(hunt);
      if (tries > 24) {
        debugLine("never found a video element after 12s");
      }
    }
  }, 500);
}


/** Gets the leftover video element out of the way for an audio-only song. */
function hideVideoElement() {
  const video = findVideoElement(document);
  if (video) video.style.display = "none";
}


// Cancels pending lower-third timers when a new song starts before the old
// card has finished its run, which would otherwise leave timers racing.
let titleTimers = [];

function clearTitleTimers() {
  titleTimers.forEach(clearTimeout);
  titleTimers = [];
}

function showVideoStage(on, title, artist, by, album, label, dedication) {
  // Whatever was covering the screen comes off HERE, because this is the
  // moment the picture underneath becomes correct.
  //
  // The ident used to lift on its own countdown, which expired while setQueue
  // was still working, so there was a beat of the old song's screen between
  // the sting ending and the new video arriving. Tying it to this call instead
  // means the two happen in the same frame.
  clearIdent();

  el("videostage").classList.toggle("on", on);

  clearTitleTimers();
  el("vcard").classList.remove("up");
  hideBug();

  if (!on) return;

  el("vartist").textContent = artist || "";
  el("vtitle").textContent = title || "";
  el("valbum").textContent = album || "";
  el("vlabel").textContent = label || "";
  el("vcredit").textContent = by ? "Requested by " + by : "";

  // Already cleaned and length-capped by the API. textContent rather than
  // innerHTML so a message can never be markup.
  el("vdedication").textContent = dedication || "";

  // In a few seconds after the video starts, hold, then out. Nothing takes its
  // place, so the picture is clean for the rest of the song.
  titleTimers.push(setTimeout(() => {
    el("vcard").classList.add("up");
  }, TITLE_DELAY_SECONDS * 1000));

  titleTimers.push(setTimeout(() => {
    el("vcard").classList.remove("up");
  }, (TITLE_DELAY_SECONDS + TITLE_SECONDS) * 1000));

  scheduleBug();
}


/**
 * Lays out every appearance of the network bug for this song in one go.
 *
 * The timers go into titleTimers deliberately: showVideoStage already clears
 * that list on every song change, so the bug inherits the same cancellation
 * and there is only one place to get it wrong.
 */
function scheduleBug() {
  const runFor = BUG_MAX_MINUTES * 60;

  for (let at = BUG_DELAY_SECONDS; at < runFor; at += BUG_EVERY_SECONDS) {
    const settle = at + BUG_HEADLINE_SECONDS;
    const exit = at + BUG_SECONDS - BUG_HEADLINE_SECONDS;

    titleTimers.push(setTimeout(showBug, at * 1000));
    titleTimers.push(setTimeout(startIdle, settle * 1000));
    titleTimers.push(setTimeout(playExitHeadline, exit * 1000));

    // A backstop, not the normal path. The exit animation finishing is what
    // normally takes the bug off. If that event never arrives, because the
    // animation was interrupted or the tab was in the background, this stops
    // the logo sitting on screen for the rest of the song.
    titleTimers.push(setTimeout(hideBug, (at + BUG_SECONDS + 0.5) * 1000));
  }
}


// What ran last time, so the next appearance is never a repeat. Held across
// songs on purpose: two appearances in a row look identical to whoever is
// watching, whether or not a song changed in between.
let lastPair = null;
let lastIdle = "";

// The pair chosen for the appearance currently on screen. Kept because the
// departure has to be the partner of the arrival, not a fresh pick.
let thisPair = BUG_ANIMATIONS[0];

// True while the headline now running is the exit one, which is what tells the
// animationend handler below that the bug should go when it finishes.
let cutWhenHeadlineEnds = false;

// The animationend handler is attached once, the first time the bug is used.
let bugListening = false;


// ---------------------------------------------------------------------------
// Birthdays and work anniversaries
//
// The identity map already carries both, so nobody maintains a second list and
// nobody has to remember to post anything. A driver's twentieth year comes up
// on the dock TV because the office typed his start date once in 2005.
//
// The card plays BETWEEN songs, never over one. Interrupting somebody's
// request to announce a birthday is how a nice feature becomes an annoying
// one, and the gap between tracks was doing nothing anyway.
// ---------------------------------------------------------------------------

// How long the card holds, and how often the list is refreshed. The refresh
// exists so a player left running for weeks notices the date changing without
// anybody reloading it.
const CELEBRATE_SECONDS = 9;
const CELEBRATE_REFRESH_MS = 60 * 60 * 1000;

// Today's people. Nobody is "shown" in turn any more: a card only exists when
// a request is addressed to one of them, so which person appears is decided by
// whoever sent the song, not by a rotation.
let celebrations = [];
let celebrateShownFor = "";


// The fireworks. Colours are the channel's own, so the burst and the logo are
// obviously the same thing rather than generic party confetti.
const CELEBRATE_COLOURS = ["#ffa62b", "#ff3d8b", "#2ec5c1", "#ffe066", "#ffffff"];

// How often a shell goes up while the card is on screen, and how many sparks
// each one throws. Sparks are the expensive part: 90 is lively on a Mac and
// still fine on the weakest thing likely to run this.
const FIREWORK_EVERY_MS = 420;
const FIREWORK_SPARKS = 90;

// The animation loop's handle, so a card that is dismissed early takes its
// fireworks with it rather than leaving them running behind the next song.
let celebFrame = null;
let celebTimers = [];


/**
 * Runs fireworks on the canvas for as long as the card is up.
 *
 * Shells launch from the bottom, arc up under gravity, and burst into sparks
 * that fade. Confetti falls throughout. It is a plain particle loop rather
 * than a library: about seventy lines, nothing to install, and nothing else in
 * this project needs a physics engine.
 */
function startFireworks(seconds, canvasId) {
  // The canvas is a parameter because two different cards use this: the
  // celebration draws on #celebfx and the burst ident draws on #identfx.
  // It was hard-coded to #celebfx, so the ident fired its fireworks onto a
  // canvas inside the hidden celebration card and showed nothing at all.
  // Nothing errored, the animation loop ran happily, and the screen was black.
  const canvas = el(canvasId || "celebfx");
  const ctx = canvas.getContext("2d");

  canvas.width = canvas.offsetWidth;
  canvas.height = canvas.offsetHeight;

  const W = canvas.width;
  const H = canvas.height;
  // Tuned so a shell reaches its apex about a third of the way down from the
  // top after roughly three quarters of a second. The first attempt used a
  // gravity a tenth of this and the shells simply left the screen: they were
  // still climbing when they passed the top edge and burst three seconds later
  // somewhere above the television. Nothing was visibly wrong in the code, and
  // nothing appeared on screen either.
  const GRAVITY = H / 1560;

  let shells = [];
  let sparks = [];
  let confetti = [];

  for (let i = 0; i < 90; i++) {
    confetti.push({
      x: Math.random() * W,
      y: Math.random() * -H,
      w: 5 + Math.random() * 7,
      h: 9 + Math.random() * 12,
      vy: 1.4 + Math.random() * 2.4,
      spin: (Math.random() - 0.5) * 0.22,
      angle: Math.random() * Math.PI,
      colour: CELEBRATE_COLOURS[Math.floor(Math.random() * CELEBRATE_COLOURS.length)]
    });
  }

  function launch() {
    const colour = CELEBRATE_COLOURS[Math.floor(Math.random() * CELEBRATE_COLOURS.length)];
    shells.push({
      x: W * (0.15 + Math.random() * 0.7),
      y: H,
      vx: (Math.random() - 0.5) * 1.6,
      vy: -(H / 35) * (0.85 + Math.random() * 0.3),
      colour: colour
    });
    whistle();
  }

  function burst(shell) {
    boom();
    for (let i = 0; i < FIREWORK_SPARKS; i++) {
      const angle = (Math.PI * 2 * i) / FIREWORK_SPARKS + Math.random() * 0.1;
      const speed = (H / 150) * (0.3 + Math.random() * 1.0);
      sparks.push({
        x: shell.x, y: shell.y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        fade: 0.010 + Math.random() * 0.012,
        colour: shell.colour
      });
    }
  }

  function frame() {
    ctx.clearRect(0, 0, W, H);

    shells = shells.filter(shell => {
      shell.x += shell.vx;
      shell.y += shell.vy;
      shell.vy += GRAVITY;

      // Bursts at the top of the arc, which is what a real shell does and what
      // stops them all going off at the same height.
      if (shell.vy >= 0) { burst(shell); return false; }

      ctx.globalAlpha = 1;
      ctx.fillStyle = shell.colour;
      ctx.fillRect(shell.x - 2, shell.y - 2, 4, 8);
      return true;
    });

    sparks = sparks.filter(spark => {
      spark.x += spark.vx;
      spark.y += spark.vy;
      spark.vy += GRAVITY * 0.55;
      spark.vx *= 0.985;
      spark.life -= spark.fade;
      if (spark.life <= 0) return false;

      ctx.globalAlpha = Math.max(spark.life, 0);
      ctx.fillStyle = spark.colour;
      ctx.beginPath();
      ctx.arc(spark.x, spark.y, 2.6, 0, Math.PI * 2);
      ctx.fill();
      return true;
    });

    confetti.forEach(bit => {
      bit.y += bit.vy;
      bit.angle += bit.spin;
      if (bit.y > H + 20) { bit.y = -20; bit.x = Math.random() * W; }

      ctx.globalAlpha = 0.85;
      ctx.fillStyle = bit.colour;
      ctx.save();
      ctx.translate(bit.x, bit.y);
      ctx.rotate(bit.angle);
      ctx.fillRect(-bit.w / 2, -bit.h / 2, bit.w, bit.h);
      ctx.restore();
