    });

    ctx.globalAlpha = 1;
    celebFrame = requestAnimationFrame(frame);
  }

  launch();
  const launcher = setInterval(launch, FIREWORK_EVERY_MS);
  celebTimers.push(launcher);
  celebTimers.push(setTimeout(() => clearInterval(launcher),
    (seconds * 1000) - FIREWORK_EVERY_MS));

  frame();
}


/** Stops the fireworks and wipes both canvases. */
function stopFireworks() {
  if (celebFrame) cancelAnimationFrame(celebFrame);
  celebFrame = null;

  celebTimers.forEach(t => { clearTimeout(t); clearInterval(t); });
  celebTimers = [];

  // Both, always. The ident canvas also carries the glitch static, and leaving
  // it behind meant the next ident opened on the previous one's noise.
  ["celebfx", "identfx"].forEach(id => {
    const canvas = el(id);
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  });
}


// ---------------------------------------------------------------------------
// The noise
//
// All generated, nothing sampled. No audio files in the repository, no vendor,
// and nothing of anybody else's. It runs on its own AudioContext, deliberately
// separate from MusicKit, so it can never interfere with a song. It also only
// ever plays between songs, so it is never competing with one.
// ---------------------------------------------------------------------------

function celebAudio() {
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return null;
  if (!celebAudio.ctx) celebAudio.ctx = new Ctx();
  return celebAudio.ctx;
}


/**
 * The output everything here connects to, instead of the speakers directly.
 *
 * A compressor acting as a limiter. Measured without one, a single burst
 * landing on the fanfare peaked at 0.98, and bursts arrive every 420ms, so two
 * together would have clipped. Clipping on a warehouse PA is not a quiet
 * problem: it is a nasty crackle at the loudest moment of the loudest thing
 * this system does.
 *
 * The ratio is high and the threshold low, so it barely touches anything
 * normal and simply refuses to let the stack get out of hand.
 */
function celebBus() {
  const ctx = celebAudio();
  if (!ctx) return null;

  if (!celebBus.node) {
    const limiter = ctx.createDynamicsCompressor();
    limiter.threshold.value = -8;
    limiter.knee.value = 4;
    limiter.ratio.value = 14;
    limiter.attack.value = 0.002;
    limiter.release.value = 0.16;

    // To the speakers, not through celebBus(). This line was briefly written
    // as connect(celebBus()) by a careless bulk edit, which wired the limiter
    // to itself and made the entire celebration silent. Nothing errored.
    limiter.connect(ctx.destination);
    celebBus.node = limiter;
  }

  return celebBus.node;
}


/** A short burst of noise through a bandpass, used as crackle and as a hit. */
function noiseHit(at, seconds, low, high, level) {
  const ctx = celebAudio();
  if (!ctx) return;

  const length = Math.max(1, Math.floor(ctx.sampleRate * seconds));
  const buffer = ctx.createBuffer(1, length, ctx.sampleRate);
  const data = buffer.getChannelData(0);

  for (let i = 0; i < length; i++) {
    data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, 2);
  }

  const source = ctx.createBufferSource();
  source.buffer = buffer;

  const filter = ctx.createBiquadFilter();
  filter.type = "bandpass";
  filter.frequency.setValueAtTime(low, at);
  filter.frequency.exponentialRampToValueAtTime(high, at + seconds);
  filter.Q.value = 0.8;

  const gain = ctx.createGain();
  gain.gain.setValueAtTime(level, at);
  gain.gain.exponentialRampToValueAtTime(0.0001, at + seconds);

  source.connect(filter).connect(gain).connect(celebBus());
  source.start(at);
}


/** The rising whistle of a shell going up. */
function whistle() {
  const ctx = celebAudio();
  if (!ctx) return;

  try {
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = "sine";
    osc.frequency.setValueAtTime(380, now);
    osc.frequency.exponentialRampToValueAtTime(1800, now + 0.5);

    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.linearRampToValueAtTime(0.06, now + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.55);

    osc.connect(gain).connect(celebBus());
    osc.start(now);
    osc.stop(now + 0.57);
  } catch (error) {
    // Silence is survivable.
  }
}


/**
 * The bang, and the crackle after it.
 *
 * Three parts, because one is not enough. A lowpass sweeping down over white
 * noise gives the crack; a sine dropping from 90Hz to 30Hz gives the chest
 * thump you feel through a warehouse PA; then a scatter of tiny bandpassed
 * pops gives the tail you actually recognise as a firework rather than a door
 * slamming.
 */
function boom() {
  const ctx = celebAudio();
  if (!ctx) return;

  try {
    const now = ctx.currentTime;

    // The crack.
    const length = Math.floor(ctx.sampleRate * 1.1);
    const buffer = ctx.createBuffer(1, length, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < length; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, 2.0);
    }

    const source = ctx.createBufferSource();
    source.buffer = buffer;

    const filter = ctx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.setValueAtTime(6000, now);
    filter.frequency.exponentialRampToValueAtTime(150, now + 0.6);

    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.65, now);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.0);

    source.connect(filter).connect(gain).connect(celebBus());
    source.start(now);

    // The thump.
    const sub = ctx.createOscillator();
    const subGain = ctx.createGain();
    sub.type = "sine";
    sub.frequency.setValueAtTime(90, now);
    sub.frequency.exponentialRampToValueAtTime(30, now + 0.45);
    subGain.gain.setValueAtTime(0.5, now);
    subGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.6);
    sub.connect(subGain).connect(celebBus());
    sub.start(now);
    sub.stop(now + 0.65);

    // The crackle.
    for (let i = 0; i < 14; i++) {
      noiseHit(now + 0.12 + Math.random() * 0.8, 0.05,
        2500 + Math.random() * 2500, 900, 0.10);
    }
  } catch (error) {
    // Silence is survivable.
  }
}


/**
 * An air horn.
 *
 * Two detuned sawtooth voices a minor third apart, around 311 and 370 Hz,
 * which is roughly where a real truck horn sits. On a dock full of drivers it
 * is the single most recognisable noise available and it costs nothing to
 * generate.
 */
function airhorn(at) {
  const ctx = celebAudio();
  if (!ctx) return;

  try {
    const start = at || ctx.currentTime;

    [311, 370].forEach(hz => {
      // Two oscillators per note, slightly apart, which is what gives a horn
      // its beating, ragged edge instead of sounding like a test tone.
      [-3, 3].forEach(detune => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(hz, start);
        osc.detune.setValueAtTime(detune * 4, start);

        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.linearRampToValueAtTime(0.13, start + 0.05);
        gain.gain.setValueAtTime(0.13, start + 0.62);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.95);

        const filter = ctx.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.value = 2600;

        osc.connect(filter).connect(gain).connect(celebBus());
        osc.start(start);
        osc.stop(start + 1.0);
      });
    });
  } catch (error) {
    // Silence is survivable.
  }
}


/**
 * The full arrival: a riser, an air horn, and a brass fanfare over the top.
 *
 * Timed to the name landing. The riser builds into it, the horn hits with it,
 * and the fanfare climbs out the other side, so the loudest moment of the
 * audio is the same moment as the loudest moment on screen.
 */
function fanfare() {
  const ctx = celebAudio();
  if (!ctx) return;

  try {
    const now = ctx.currentTime;

    // Riser: noise sweeping upward into the hit.
    noiseHit(now, 0.55, 300, 7000, 0.14);

    const horn = now + 0.42;
    airhorn(horn);

    // Crash, to mark the impact.
    noiseHit(horn, 1.1, 7000, 2000, 0.22);

    // Brass. A rising run into a held chord, detuned in pairs so it sounds
    // like several instruments rather than one synthesiser.
    const run = [392, 523, 659, 784];
    run.forEach((hz, i) => {
      const at = horn + i * 0.085;
      [0, 7].forEach(detune => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const filter = ctx.createBiquadFilter();

        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(hz, at);
        osc.detune.setValueAtTime(detune, at);

        filter.type = "lowpass";
        filter.frequency.setValueAtTime(1200, at);
        filter.frequency.exponentialRampToValueAtTime(4200, at + 0.12);

        const last = i === run.length - 1;
        gain.gain.setValueAtTime(0.0001, at);
        gain.gain.linearRampToValueAtTime(0.11, at + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.0001, at + (last ? 1.5 : 0.3));

        osc.connect(filter).connect(gain).connect(celebBus());
        osc.start(at);
        osc.stop(at + (last ? 1.6 : 0.4));
      });
    });
  } catch (error) {
    // Silence is survivable.
  }
}


// ---------------------------------------------------------------------------
// Idents
//
// The sting between songs. Without one, a song simply becomes the next song
// and the wall reads as a video player. With one, it reads as a channel.
//
// Each entry names its CSS class, how long the card stays up, and the noise
// that goes with it. Deleting a line retires that ident; adding one is
// keyframes, a class, and a line here.
// ---------------------------------------------------------------------------

const IDENTS = [
  { name: "slam",   ms: 2600, sound: "slam" },
  { name: "sweep",  ms: 2600, sound: "sweep" },
  { name: "glitch", ms: 2700, sound: "glitch" },
  { name: "tunein", ms: 2800, sound: "tunein" },
  { name: "burst",  ms: 3000, sound: "burst" },
  { name: "strobe", ms: 2700, sound: "strobe" }
];

// Play an ident before one song in every this many. 1 is every song, which is
// what a music channel actually did. Raise it if it ever wears thin.
//
// SET THIS TO 0 TO TURN IDENTS OFF ENTIRELY. One line, no other change, and
// the jukebox goes straight from song to song as it did before they existed.
// It is here because idents introduced three seconds between stopping one
// track and starting the next, and every bug they caused lived in that gap.
const IDENT_EVERY = 1;

let lastIdent = null;
let identCount = 0;
let identTimers = [];


/**
 * Plays one ident and reports how long the caller should wait.
 *
 * Same contract as playCelebration: returns milliseconds to hold before
 * starting the song, or 0 for nothing. The two never both play, because two
 * full-screen interruptions back to back is a pause, not punctuation.
 */
function playIdent() {
  if (IDENT_EVERY < 1) return 0;

  identCount++;
  if (IDENT_EVERY > 1 && identCount % IDENT_EVERY !== 0) return 0;

  const pick = pickDifferent(IDENTS, lastIdent);
  lastIdent = pick;

  const card = el("ident");

  clearIdent();
  void card.offsetWidth;

  card.classList.add("on", "id-" + pick.name);

  if (pick.sound === "burst") {
    // The one ident that borrows the fireworks outright. The canvas has to be
    // visible before it can be measured, hence the next frame.
    el("identfx").style.opacity = "1";
    requestAnimationFrame(() => startFireworks(pick.ms / 1000, "identfx"));
  } else if (pick.sound === "glitch") {
    paintStatic();
  }

  identSound(pick.sound);

  // A backstop. showVideoStage normally takes this down the moment the next
  // song is on screen; this only matters if that never happens.
  identTimers.push(setTimeout(clearIdent, pick.ms + 6000));

  return pick.ms;
}


/** Takes the ident off screen and stops anything it started. */
function clearIdent() {
  const card = el("ident");

  // Nothing to do if no ident is up, and that matters now that showVideoStage
  // calls this on every single song. Without the guard, an ordinary song
  // change would call stopFireworks, which is shared with the celebration
  // card, and could cut a birthday's fireworks short from the other side of
  // the file.
  if (!card || !card.classList.contains("on")) return;

  identTimers.forEach(clearTimeout);
  identTimers = [];

  stopFireworks();
  IDENTS.forEach(item => card.classList.remove("id-" + item.name));
  card.classList.remove("on");
  el("identfx").style.opacity = "0";
}


/**
 * Fills the canvas with television static.
 *
 * Drawn once into an ImageData rather than animated, because the glitch ident
 * is 1.1 seconds of hard-cut steps and a moving noise field underneath it
 * reads as mush. One frozen frame of static behind a tearing logo is what the
 * effect actually needs.
 */
function paintStatic() {
  const canvas = el("identfx");
  const ctx = canvas.getContext("2d");

  canvas.width = Math.max(canvas.offsetWidth, 2);
  canvas.height = Math.max(canvas.offsetHeight, 2);

  const image = ctx.createImageData(canvas.width, canvas.height);
  const data = image.data;

  for (let i = 0; i < data.length; i += 4) {
    const shade = Math.random() * 255;
    data[i] = shade;
    data[i + 1] = shade;
    data[i + 2] = shade;
    data[i + 3] = 255;
  }

  ctx.putImageData(image, 0, 0);
}


// ---------------------------------------------------------------------------
// What each ident sounds like
//
// All generated and all routed through the same limiter as the celebration, so
// nothing here can clip the dock speakers however it stacks.
// ---------------------------------------------------------------------------

function identSound(kind) {
  const ctx = celebAudio();
  if (!ctx) return;

  try {
    const now = ctx.currentTime;

    if (kind === "slam") {
      // Impact: a sub drop with a bright crash on top.
      tone(now, 140, 34, 0.55, 0.5, "sine");
      noiseHit(now, 1.3, 9000, 1400, 0.24);

    } else if (kind === "sweep") {
      // A whoosh past, then a chime where it lands.
      noiseHit(now, 0.75, 400, 9000, 0.20);
      tone(now + 0.62, 880, 880, 0.9, 0.14, "triangle");
      tone(now + 0.62, 1320, 1320, 0.9, 0.09, "triangle");

    } else if (kind === "glitch") {
      // Torn signal: short bursts of band-limited noise at irregular gaps.
      [0, 0.09, 0.15, 0.26, 0.34, 0.47, 0.6, 0.78].forEach(at => {
        noiseHit(now + at, 0.07, 800 + Math.random() * 5000, 400, 0.20);
      });
      tone(now + 0.85, 120, 90, 0.5, 0.22, "square");

    } else if (kind === "tunein") {
      // A set finding the signal: a warble that settles onto a note.
      tone(now, 180, 1400, 0.55, 0.10, "sawtooth");
      noiseHit(now + 0.1, 0.5, 6000, 900, 0.12);
      tone(now + 0.62, 660, 660, 1.0, 0.13, "triangle");
      tone(now + 0.62, 990, 990, 1.0, 0.08, "triangle");

    } else if (kind === "burst") {
      whistle();
      setTimeout(boom, 520);

    } else if (kind === "strobe") {
      // Four stabs on the cuts, then a held low note.
      [0, 0.21, 0.42, 0.63].forEach((at, i) => {
        noiseHit(now + at, 0.12, 5000, 1200, 0.18);
        tone(now + at, 220 * (i + 1), 220 * (i + 1), 0.16, 0.10, "square");
      });
      tone(now + 0.75, 110, 110, 1.1, 0.16, "sawtooth");
    }
  } catch (error) {
    // Silence is survivable.
  }
}


/** One shaped note. from and to let it slide; equal values hold it steady. */
function tone(at, from, to, seconds, level, shape) {
  const ctx = celebAudio();
  if (!ctx) return;

  const osc = ctx.createOscillator();
  const gain = ctx.createGain();

  osc.type = shape || "sine";
  osc.frequency.setValueAtTime(from, at);
  if (to !== from) osc.frequency.exponentialRampToValueAtTime(to, at + seconds);

  gain.gain.setValueAtTime(0.0001, at);
  gain.gain.linearRampToValueAtTime(level, at + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, at + seconds);

  osc.connect(gain).connect(celebBus());
  osc.start(at);
  osc.stop(at + seconds + 0.05);
}


// ---------------------------------------------------------------------------
// Reactions
//
// They arrive on the queue answer the player already asks for every few
// seconds, so there is no second poll and nothing extra to keep alive.
// ---------------------------------------------------------------------------

// The newest reaction already shown. Everything after it is new. Timestamps
// come from the API rather than this machine, so a clock that is a few seconds
// out cannot hide reactions or replay them.
let lastReactionAt = 0;

// How often to look for new reactions, how far apart to launch them, and the
// most one batch may release. The cap is not about the server, it is about the
// screen: past a dozen at a time you cannot see the video at all.
const REACTION_POLL_MS = 1200;
const REACTION_GAP_MS = 130;
const REACTION_BURST_MAX = 12;


/**
 * Floats anything new up the screen.
 *
 * On the very first queue answer the timestamp is simply noted and nothing is
 * shown, because otherwise a player starting up would replay the whole of the
 * last twenty seconds at once.
 */
function paintReactions(list) {
  if (!Array.isArray(list) || list.length === 0) return;

  const newest = Math.max.apply(null, list.map(item => item.t || 0));

  if (lastReactionAt === 0) {
    lastReactionAt = newest;
    return;
  }

  let slot = 0;

  list
    .filter(item => (item.t || 0) > lastReactionAt)
    .forEach(item => {
      // One entry can carry a dozen taps, because the phone batches them.
      // They go up as a stream rather than all at once: a burst of ten reads
      // as somebody leaning on the button, which is exactly what happened.
      const many = Math.min(Math.max(Number(item.n) || 1, 1), REACTION_BURST_MAX);

      for (let i = 0; i < many; i++) {
        setTimeout(() => floatReaction(item.e, item.by), slot * REACTION_GAP_MS);
        slot++;
      }
    });

  lastReactionAt = Math.max(lastReactionAt, newest);
}


/**
 * The reactions-only poll.
 *
 * Separate from the queue poll and much faster, because these are the one
 * thing on the wall where lateness is the whole failure. Four seconds behind a
 * tap is not a reaction, it is a delayed report of one. getReactions is a cache
 * read on the server with none of the queue's work behind it.
 */
async function pollReactions() {
  const answer = await api("getReactions", {});
  if (answer && answer.ok) paintReactions(answer.reactions);
}


/** One emoji rising up the right-hand side. */
function floatReaction(emoji, who) {
  const layer = el("reactions");
  if (!layer || !emoji) return;

  const node = document.createElement("div");
  node.className = "reaction";

  // Scattered across the right third, and started below the bottom edge so it
  // rises into frame rather than appearing in it.
  node.style.left = (66 + Math.random() * 26) + "%";
  node.style.top = "92%";

  const face = document.createElement("div");
  face.className = "face";
  face.textContent = emoji;

  const name = document.createElement("div");
  name.className = "who";
  name.textContent = who || "";

  node.append(face, name);
  layer.appendChild(node);

  // Removed when its animation ends rather than on a timer, so a slow machine
  // cannot leave half-faded emoji stacked on the wall.
  node.addEventListener("animationend", () => node.remove());
}


/** Asks the API whose day it is, and starts again when the date rolls over. */
async function loadCelebrations() {
  try {
    const answer = await api("getCelebrations", {});
    if (!answer.ok) return;

    celebrateShownFor = answer.date;

    celebrations = answer.celebrations || [];

    if (celebrations.length) {
      debugLine("celebrations today: "
        + celebrations.map(c => c.name + " " + c.kind).join(", "));
    }
  } catch (error) {
    // A missing celebration is not worth a gap in the music.
  }
}


/**
 * Plays one celebration card, if anybody is owed one.
 *
 * song is the track about to play, and it goes ON THE CARD. A request has two
 * people in it: the one being celebrated and the one who went to the trouble
 * of sending something. Naming only the first turns a gesture into a
 * screensaver, so the card credits both, names the track, and carries any
 * dedication that came with it.
 *
 * Returns how long the caller should wait before starting the song, so
 * playback pauses for exactly as long as the card is up and not a moment more.
 * Returns 0 when there is nothing to show, which is most days.
 */
function playCelebration(song) {
  // THE DEDICATION IS THE OCCASION. Somebody choosing a song for a colleague
  // and writing them a line is the thing worth the whole screen. A birthday
  // sitting in a spreadsheet is not.
  //
  // The first version had this backwards: it fired on anybody's birthday, in
  // front of whatever song happened to be next, so a request one person sent
  // to another was interrupted by a card celebrating a third person who had
  // nothing to do with it.
  //
  // So the card requires a dedication addressed to a real person, and nothing
  // else. If that person also happens to be celebrating today, the card says
  // so. If not, it still plays: the gesture stands on its own.
  const by = song && song.by ? String(song.by).trim() : "";
  const title = song && song.title ? String(song.title).trim() : "";
  const to = song && song.dedicatedTo ? String(song.dedicatedTo).trim() : "";

  if (!by || !title || !to) return 0;

  // Optional. Missing simply means it is not their day as well.
  const who = celebrations.filter(person =>
    String(person.name).trim().toLowerCase() === to.toLowerCase()
  )[0];

  const card = el("celebrate");

  el("celebkicker").textContent = !who ? "THIS ONE IS FOR"
    : (who.kind === "birthday" ? "HAPPY BIRTHDAY" : "CELEBRATING");

  // The identity map's spelling when we have it, otherwise what the API stored,
  // which is itself taken from the map. Either way it is never free text.
  el("celebwho").textContent = who ? who.name : to;

  // Years only for a work anniversary, and only where the map had a start
  // year. Nobody's age goes on a television.
  el("celebyears").textContent =
    (who && who.kind === "anniversary" && who.years > 0)
      ? (who.years === 1 ? "1 YEAR WITH COONEY PROVISIONS"
                         : who.years + " YEARS WITH COONEY PROVISIONS")
      : "";

  el("celebfrom").innerHTML = "THIS ONE IS FROM <b></b>";
  el("celebfrom").querySelector("b").textContent = by.toUpperCase();

  el("celebsong").textContent = title;
  if (song.artist) {
    const artist = document.createElement("span");
    // Escaped rather than typed, so the separator cannot come out as "Â·"
    // if this file is ever saved or served as anything but UTF-8.
    artist.textContent = "  \u00B7  " + song.artist;
    el("celebsong").appendChild(artist);
  }

  // textContent, never innerHTML: the dedication is the one string here a
  // person typed, and it is already cleaned by the API.
  el("celebnote").textContent = song.dedication || "";

  // Restart the animations. Same reflow trick as the bug: without it a second
  // card reuses the finished ones and appears with no entrance at all.
  stopFireworks();
  card.classList.remove("on");
  void card.offsetWidth;
  card.classList.add("on");

  // The canvas has to be visible before it can be measured, so the fireworks
  // start on the next frame rather than this one.
  requestAnimationFrame(() => startFireworks(CELEBRATE_SECONDS));

  // Timed to the name landing at 420ms rather than to the card appearing.
  setTimeout(fanfare, 300);

  setTimeout(() => {
    card.classList.remove("on");
    stopFireworks();
  }, CELEBRATE_SECONDS * 1000);

  return CELEBRATE_SECONDS * 1000;
}


/**
 * Fades the bug in and decides how this appearance will arrive and leave.
 *
 * The headline is chosen here, once, rather than at each of the two moments it
 * plays. That is what makes the exit match the entrance.
 */
function showBug() {
  const fx = el("bugfx");

  clearBugAnimation();
  cutWhenHeadlineEnds = false;

  thisPair = pickDifferent(BUG_ANIMATIONS, lastPair);
  lastPair = thisPair;

  void fx.offsetWidth;
  el("bug").classList.add("up");
  el("bug").classList.add("fx-" + thisPair.in);
}


/**
 * Plays the headline one last time and arranges for the bug to vanish on its
 * final frame.
 *
 * Driven by the animation actually ending rather than by a timer, because the
 * headlines are not all the same length: the glitch is 900ms and the shimmer
 * is 1900ms. A fixed timer would leave the short ones sitting still for a
 * second before disappearing, which is the flat pause all over again.
 */
function playExitHeadline() {
  const fx = el("bugfx");

  listenForBugAnimationEnd();
  clearBugAnimation();
  void fx.offsetWidth;

  cutWhenHeadlineEnds = true;
  el("bug").classList.add("fx-" + thisPair.out);
}


/**
 * Attaches the one listener that takes the bug off screen.
 *
 * On #bug because the event has to be caught wherever it came from: most
 * headlines animate #bugfx, but the shimmer animates #bugsheen. Both bubble
 * up to here.
 */
function listenForBugAnimationEnd() {
  if (bugListening) return;
  bugListening = true;

  el("bug").addEventListener("animationend", () => {
    if (!cutWhenHeadlineEnds) return;
    hideBug();
  });
}


/** Starts the quiet loop that carries the middle of the appearance. */
function startIdle() {
  const bug = el("bug");

  clearBugAnimation();

  const picked = pickDifferent(BUG_IDLES, lastIdle);
  lastIdle = picked;

  // On #bug rather than #bugfx because several idles animate #bugfx itself,
  // and an element cannot both carry the class and be its target.
  bug.classList.add("idle-" + picked);
}


/** A random pick from a list that is never the given one. */
function pickDifferent(list, avoid) {
  const choices = list.filter(name => name !== avoid);
  const from = choices.length > 0 ? choices : list;
  return from[Math.floor(Math.random() * from.length)];
}


/** Takes every headline and idle animation back off. */
function clearBugAnimation() {
  const bug = el("bug");

  BUG_ANIMATIONS.forEach(pair => {
    bug.classList.remove("fx-" + pair.in);
    bug.classList.remove("fx-" + pair.out);
  });

  BUG_IDLES.forEach(name => bug.classList.remove("idle-" + name));
}


/**
 * Takes the bug off screen at once, with no fade, and clears the animations.
 *
 * The instant part is the stylesheet's doing: the opacity transition lives on
 * #bug.up, so removing that class removes the transition in the same frame.
 */
function hideBug() {
  cutWhenHeadlineEnds = false;
  el("bug").classList.remove("up");
  clearBugAnimation();
}


/**
 * One Apple lookup for everything the player needs about a song that the queue
 * sheet does not store: artwork, running time, album, and record label.
 *
 * The album relationship is included because the record label lives on the
 * album rather than the song, and the MTV-style lower third wants all four.
 */
async function songDetails(songId) {
  try {
    const response = await fetch(
      "https://api.music.apple.com/v1/catalog/us/songs/" + songId
        + "?include=albums",
      { headers: { Authorization: "Bearer " + DEVELOPER_TOKEN } }
    );
    const data = await response.json();
    const song = data.data[0];
    const attributes = song.attributes;

    let label = "";
    try {
      const album = song.relationships.albums.data[0];
      label = album.attributes.recordLabel || "";
    } catch (error) {
      // Some tracks have no album relationship. The line is simply left off.
    }

    let albumTracks = 0;
    let albumReleased = "";
    let copyright = "";
    try {
      const album = song.relationships.albums.data[0].attributes;
      albumTracks = album.trackCount || 0;
      albumReleased = album.releaseDate || "";
      copyright = album.copyright || "";
    } catch (error) {
      // Same as the label above: no album relationship, so these are skipped.
    }

    return {
      artwork: attributes.artwork.url,
      durationMs: attributes.durationInMillis || 0,
      album: attributes.albumName || "",
      label: label,

      // Apple's own spelling of the song and the act. The sheet's copy passes
      // through Google Sheets, which reinterprets anything that looks like a
      // date or a time, so "3AM" arrives as 1899-12-30T08:00:00.000Z. These
      // never go near a spreadsheet.
      name: attributes.name || "",
      artistName: attributes.artistName || "",

      // Everything below is only used to write pop-up nuggets. It costs
      // nothing extra: it all arrives in the same response the lower third
      // already asks for.
      released: attributes.releaseDate || "",
      genres: attributes.genreNames || [],
      composer: attributes.composerName || "",
      trackNumber: attributes.trackNumber || 0,
      discNumber: attributes.discNumber || 0,
      albumTracks: albumTracks,
      albumReleased: albumReleased,
      copyright: copyright
    };
  } catch (error) {
    return {
      artwork: null, durationMs: 0, album: "", label: "",
      released: "", genres: [], composer: "", trackNumber: 0,
      discNumber: 0, albumTracks: 0, albumReleased: "", copyright: ""
    };
  }
}

/** Turns Apple's artwork template into a real URL at the size we want. */
function sized(template, pixels) {
  if (!template) return null;
  return template.replace("{w}", pixels).replace("{h}", pixels);
}


// ---------------------------------------------------------------------------
// Startup
// ---------------------------------------------------------------------------

/**
 * Sets MusicKit up, however it happens to arrive.
 *
 * THIS IS A RACE AND WE LOSE IT ABOUT HALF THE TIME.
 * The MusicKit script tag is async and sits above this code, so on a machine
 * where it is already cached it can load, run, and fire "musickitloaded"
 * BEFORE this file has registered a listener for it. The listener then never
 * fires, music stays null, and the page eventually reports that Apple's
 * library did not load when in fact it loaded perfectly and quickly.
 *
 * A slow machine, or a cold cache, or an incognito window loads it late enough
 * that the listener is ready in time and everything works. That is why this
 * only ever broke on one machine and looked like a network fault.
 *
 * So: if MusicKit is already here, use it. If not, wait for the event. Never
 * only the second one.
 */
async function setUpMusicKit() {
  if (music) return;

  try {
    music = await MusicKit.configure({
      developerToken: DEVELOPER_TOKEN,
      app: { name: "Cooney Provisions Video Jukebox", build: "1.0.0" }
    });
  } catch (error) {
    // Almost always the developer token: expired, or edited into something
    // Apple will not accept. Said out loud rather than left as a dead button.
    musicKitError = "Apple would not accept the developer token. "
      + "Re-run make_music_token.py and paste the new one in.";
    startMessage(musicKitError);
    debugLine("MusicKit.configure failed: " + (error.message || error));
    return;
  }

  // Try to start on our own. On a browser that allows unattended playback this
  // is the whole startup and nobody ever sees the button. On one that does not,
  // it fails harmlessly and the button is still sitting there.
  startMessage("");
  setStatus("ready to start");
  tryAutoStart();
}


// Both routes in, because either can be the one that happens.
if (window.MusicKit) {
  setUpMusicKit();
} else {
  document.addEventListener("musickitloaded", setUpMusicKit);
}


// If Apple's library never loads at all, nothing above ever runs and the page
// simply waits. Say so instead.
setTimeout(() => {
  if (music || musicKitError) return;

  // One last try before blaming anything. If the library is sitting right
  // there, we simply missed its announcement, and this recovers it.
  if (window.MusicKit) {
    debugLine("MusicKit was already loaded, its event was missed. Recovering.");
    setUpMusicKit();
    return;
  }

  musicKitError = "Apple's player did not load. Check this machine can reach "
    + "js-cdn.music.apple.com, then reload.";
  startMessage(musicKitError);
  debugLine("MusicKit never loaded after " + (MUSICKIT_WAIT_MS / 1000) + "s");
}, MUSICKIT_WAIT_MS);


/**
 * Waits for a promise, but not forever.
 *
 * Everything on the start path can hang rather than fail: a blocked popup, a
 * refused play, a player that never reports ready. A hang gives the room a
 * dead button and gives us nothing to work from, so each step gets a limit and
 * a sentence explaining what did not happen.
 */
function withTimeout(promise, ms, message) {
  return Promise.race([
    promise,
    new Promise((resolve, reject) =>
      setTimeout(() => reject(new Error(message)), ms))
  ]);
}


el("startbtn").addEventListener("click", async () => {
  // WITHOUT THIS THE BUTTON JUST STOPS. If Apple's library has not loaded,
  // music is null, the next line throws reading isAuthorized, and the button
  // sits on "Starting" forever with nothing on screen explaining why. That is
  // a five minute problem presented as a dead jukebox.
  if (!music) {
    startMessage(musicKitError || "Apple's player has not loaded yet. Give it a "
      + "moment, then press start again.");
    el("startbtn").disabled = false;
    el("startbtn").textContent = "Start the jukebox";
    return;
  }

  el("startbtn").disabled = true;
  el("startbtn").textContent = "Starting";

  try {

  // authorize() opens a window, which only a real click is allowed to do. This
  // is the one part of startup that can never happen automatically, and it is
  // why a brand new browser always needs the button once.
  //
  // TIMED OUT ON PURPOSE. In kiosk or full-screen mode the browser refuses to
  // open that window, and Apple's promise then neither resolves nor rejects.
  // It simply hangs, so the button stays disabled reading "Starting" and looks
  // to everybody like a button that cannot be clicked. A rejection we can talk
  // about beats a wait we cannot.
  if (!music.isAuthorized) {
    // Said before the wait, not after it. Whatever happens next, the screen is
    // never silently doing nothing.
    startMessage("Signing in to Apple Music, a window should open");

    await withTimeout(
      music.authorize(),
      AUTHORIZE_TIMEOUT_MS,
      "Apple's sign-in window did not open. Kiosk and full screen block it. "
      + "Leave kiosk, press start once to sign in, then go back."
    );
  }

    startMessage("Starting playback");

    // TIME LIMITED, ALL OF IT. Neither of these throws when playback is
    // refused: they simply never come back. The button then sits disabled
    // reading "Starting" forever, which from in front of the screen is
    // indistinguishable from a button that cannot be pressed. Every await on
    // this path now either finishes or says why it did not.
    await withTimeout(unlockAudio(), UNLOCK_TIMEOUT_MS,
      "The browser would not let audio start. Reload and press start again.");

    await withTimeout(unlockYouTube(), UNLOCK_TIMEOUT_MS,
      "The video player would not start. Reload and press start again.");

    goLive(false);
  } catch (error) {
    // Anything at all going wrong here used to leave a disabled button reading
    // "Starting" and no way back short of a reload.
    debugLine("start failed: " + (error.message || error));
    startMessage(error.message || String(error));
    el("startbtn").disabled = false;
    el("startbtn").textContent = "Start the jukebox";
  }
});


/**
 * Starts the jukebox without anybody touching the screen, if the browser lets
 * us. Returns quietly and leaves the Start screen up if it does not.
 *
 * WHY THIS IS A TRY RATHER THAN A SETTING.
 * Whether audio may start on its own is the browser's decision and there is no
 * way to ask it in advance. So we simply attempt it and watch: if a silent
 * track really reaches the playing state, unattended playback is allowed here
 * and the rest of startup can run. If it does not, the Start button is still
 * on screen and works exactly as it always has.
 *
 * That is what makes this safe to run everywhere. Chrome launched in kiosk mode
 * with --autoplay-policy=no-user-gesture-required starts on its own. iPadOS
 * Safari refuses, every time, and shows the button. Neither needs a different
 * build of this file and neither needs a flag set by hand.
 */
async function tryAutoStart() {
  // Signing in cannot be automated: authorize() opens a window and browsers
  // only allow that from a real click. Already signed in is the normal case,
  // because the authorisation is remembered.
  if (!music.isAuthorized) {
    debugLine("autostart: not signed in yet, the button is needed once");
    return;
  }

  const allowed = await audioWillStartOnItsOwn();

  if (!allowed) {
    debugLine("autostart: this browser wants a tap first");
    return;
  }

  debugLine("autostart: unattended playback allowed, starting");
  await unlockYouTube();
  goLive(true);
}


/**
 * Asks the browser, honestly, whether it will let audible sound start without
 * anybody touching the page.
 *
 * Full volume and not muted, on purpose. Turning the volume down would make
 * this pass everywhere and mean nothing. The clip itself is silence, so asking
 * the question costs no noise.
 */
async function audioWillStartOnItsOwn() {
  try {
    const probe = new Audio(SILENT_CLIP);
    probe.volume = 1;
    probe.muted = false;

    await probe.play();
    probe.pause();
    return true;
  } catch (error) {
    debugLine("autoplay refused: " + (error.name || error.message || error));
    return false;
  }
}


/**
 * Clears the Start screen and runs the jukebox. Called from the button and
 * from the automatic path, so both reach the same place by the same route.
 */
function goLive(automatic) {
  if (live) return;
  live = true;
  startedAutomatically = !!automatic;
  deadStarts = 0;

  el("start").style.display = "none";
  begin();
}


/**
 * Counts songs that never started, and puts the Start screen back if it keeps
 * happening after an automatic start.
 *
 * The probe can only ever be a good answer to the question at the moment it is
 * asked. If it is somehow wrong, or the browser changes its mind, the failure
 * mode without this is a jukebox that took its own button away and then played
 * nothing for the rest of the day. Two failures in a row is enough: real songs
 * fail occasionally for their own reasons, but not twice running.
 *
 * A run that a person started is left alone. If they pressed the button and
 * songs still will not play, the problem is not permission and putting the
 * button back would only hide the real one.
 */
function noteDeadStart() {
  if (!startedAutomatically) return;

  deadStarts++;
  if (deadStarts < 2) return;

  debugLine("autostart was wrong, asking for a tap");
  live = false;
  startedAutomatically = false;

  el("start").style.display = "";
  el("startbtn").disabled = false;
  el("startbtn").textContent = "Start the jukebox";
  setStatus("press start to allow sound");
}

/**
 * Browsers refuse to start audio unless a person clicked something. Songs get
 * started later by a timer, which does not count, so we play one track silently
 * during the button press to open the gate for everything after it.
 */
async function unlockAudio() {
  try {
    music.volume = 0;
    await music.setQueue({ song: UNLOCK_SONG, startPlaying: true });
    await new Promise(resolve => setTimeout(resolve, 400));
    music.stop();
  } catch (error) {
    debugLine("unlock failed: " + error.message);
  } finally {
    music.volume = 1;
  }
}

function begin() {
  watchPlaybackState();
  setStatus("waiting for requests", true);
  reportHome();
  loadCelebrations();
  setInterval(loadCelebrations, CELEBRATE_REFRESH_MS);
  setInterval(pollReactions, REACTION_POLL_MS);
  tick();
  setInterval(tick, POLL_MS);
  setInterval(paintProgress, 1000);
  setInterval(reportHome, 3600000);
}

/** Listens for Apple telling us a track ended, rather than guessing. */
function watchPlaybackState() {
  music.addEventListener("playbackStateDidChange", () => {
    const state = music.playbackState;
    const states = MusicKit.PlaybackStates || {};

    // Nothing counts while we are between songs.
    //
    // startingSong covers the window from stopping the old track to the new
    // one actually playing, which since the idents arrived can be several
    // seconds. Without it, our own music.stop() was reported as a finish while
    // the NEW song's QueueID was already set, so a request was marked played
    // before it had made a sound and the jukebox moved on to something else.
    // The sting then played again for the next song, which is what it looked
    // like from the room.
    if (startingSong) return;

    // Only "completed" and "ended" mean the track actually ran out.
    // "stopped" is deliberately NOT on this list, for the same reason.
    const done = [states.completed, states.ended]
      .filter(value => value !== undefined)
      .indexOf(state) !== -1;

    if (done && (currentQueueId || houseTrack)) {
      trackFinished = true;
      debugLine("track finished, advancing");

      // Look NOW rather than waiting for the next poll. The poll is every four
      // seconds, so a song ending a moment after one tick left the screen
      // blank for nearly that whole gap before the player even noticed. tick
      // refuses to run on top of itself, so calling it here is safe.
      tick();
    }
  });
}


/**
 * Tells the API what the shop's public address is. This machine only ever runs
 * on the shop network, so its address defines who is allowed to queue songs.
 * Re-reported hourly so an ISP address change heals on its own.
 */
async function reportHome() {
  const ip = await publicAddress();
  if (!ip) {
    debugLine("could not detect our own address");
    return;
  }
  await api("reportHome", { ip: ip });
}


// ---------------------------------------------------------------------------
// The player loop
// ---------------------------------------------------------------------------

async function tick() {
  // A tick can now take seconds rather than milliseconds, because a song start
  // holds for an ident or a celebration. setInterval does not care: it fires
  // again regardless, and a second tick arriving mid-start read the OLD track's
  // state as if it belonged to the new one, marked a request played before it
  // had made a sound, and started a second song on top of it.
  if (ticking) return;
  ticking = true;

  try {
    await tickOnce();
  } finally {
    ticking = false;
  }
}

let ticking = false;


async function tickOnce() {
  const state = await api("getQueue");
  if (!state || !state.ok) return;

  // The clean-content list is owned by the API, so the player always uses
  // whatever the server is currently enforcing rather than its own copy.
  if (state.banned) bannedWords = state.banned;

  // An admin is waiting and somebody else's song is on. Hand the floor over.
  // The displaced song goes back to waiting rather than being marked played,
  // so whoever asked for it keeps their turn and hears it next.
  //
  // A station track needs no handling here. Nothing is marked playing while
  // one is on, so the API never raises this flag, and the ordinary request
  // path already cuts the station off.
  if (state.interrupt && currentQueueId) {
    debugLine("admin request, handing the floor over");
    await api("requeue", { queueId: currentQueueId });
    currentQueueId = null;
    trackFinished = false;
    heardItPlaying = false;
    music.stop();
    stopYouTube();
  }

  if (currentQueueId) {
    if (trackFinished) {
      await api("markPlayed", { queueId: currentQueueId });
      currentQueueId = null;
      trackFinished = false;
      stopYouTube();
    } else if (onYouTube) {
      // YouTube announces its own ending through the player events, so none
      // of the silence-watching below applies while it is on screen.
      heardItPlaying = true;
      deadStarts = 0;
    } else if (music.isPlaying) {
      // Once we have actually heard it, silence later means it ended.
      heardItPlaying = true;
      deadStarts = 0;
    } else if (heardItPlaying) {
      await api("markPlayed", { queueId: currentQueueId });
      currentQueueId = null;
    } else if (Date.now() - startedAt > START_TIMEOUT_MS) {
      await api("markPlayed", { queueId: currentQueueId });
      currentQueueId = null;
      setStatus("a track would not start");
      noteDeadStart();
    }
  } else if (houseTrack && trackFinished) {
    // A station track finished. Nothing to report to the sheet, it just
    // clears the way for the next one.
    houseTrack = null;
    trackFinished = false;
    stopYouTube();
  }

  // The office skipped it out from under us.
  if (currentQueueId && !state.playing) {
    currentQueueId = null;
    music.stop();
    stopYouTube();
  }

  if (!currentQueueId && state.waiting.length > 0) {
    await playRequest(state.waiting[0]);
  } else if (!currentQueueId && !onYouTube && !music.isPlaying) {
    await playHouse();
  }

  paintQueue(state.waiting);
}

/**
 * Plays one song, with a video if one can be found, and paints the screen.
 *
 * Requested songs and house rotation tracks both come through here. That is
 * deliberate: when the house rotation had its own path it quietly skipped both
 * the video lookup and the explicit filter, and the two would drift apart
 * every time one of them was changed.
 */
async function playSong(songId, title, artist, by, dedication, holdUntil) {
  currentSongId = songId;

  const details = await songDetails(songId);

  music.stop();
  stopYouTube();
  attachScreen();

  const video = PLAY_VIDEOS
    ? await musicVideoFor(title, artist)
    : null;

  // APPLE'S TITLE WINS OVER THE SHEET'S.
  //
  // The row is written by Apps Script into Google Sheets, which quietly turns
  // anything resembling a date or a time into one. Matchbox Twenty's "3AM"
  // came back as 1899-12-30T08:00:00.000Z, so the wall showed that, the video
  // search looked for it, and the picker correctly rejected the real official
  // video because its title did not name the song.
  //
  // The catalog lookup we already make returns the proper name and artist and
  // never touches a spreadsheet, so from here on those are used for both the
  // search and the screen. Fixing the sheet's formatting stops new rows being
  // mangled; this makes it not matter.
  if (details.name) title = details.name;
  if (details.artistName) artist = details.artistName;

  // Apple first, always. YouTube is only asked about songs Apple has no
  // video for, and only once the player API has finished loading.
  const backup = (!video && PLAY_VIDEOS && ytApiReady)
    ? await youtubeVideoFor(songId, title, artist, details.durationMs)
    : null;

  // Everything above this line is lookups, and everything below it makes a
  // noise. holdUntil is the moment the ident or celebration finishes, so the
  // waiting happens HERE, after the slow part rather than before it. If the
  // lookups took longer than the sting there is nothing left to wait for.
  if (holdUntil) {
    const left = holdUntil - Date.now();
    if (left > 0) await new Promise(resolve => setTimeout(resolve, left));
  }

  if (video) {
    await music.setQueue({ musicVideo: String(video.id), startPlaying: true });
    showVideoStage(true, title, artist, by, details.album, details.label, dedication);
    chaseVideoElement();
    setStatus("playing a video", true);
  } else if (backup) {
    hideVideoElement();
    playYouTube(backup);
    showVideoStage(true, title, artist, by, details.album, details.label, dedication);
    setStatus("playing a video from YouTube", true);
  } else {
    await music.setQueue({ song: songId, startPlaying: true });
    hideVideoElement();
    showVideoStage(false);
    setStatus("no video, playing the track", true);
  }

  // Playing for real, so track endings count again. Cleared here rather than
  // back in the caller so the watcher is live from the first note.
  startingSong = false;

  paintNowPlaying(title, artist, by);
  paintArtwork(sized(details.artwork, 900));

  // Reported back so the house rotation can name the station without erasing
  // which of the three paths actually ran. That status line is the fastest way
  // to tell a video failure from a station failure.
  if (video) return "video";
  if (backup) return "video from YouTube";
  return "no video";
}


/** Plays one requested song and tells the sheet it started. */
async function playRequest(item) {
  currentQueueId = item.QueueID;
  houseTrack = null;
  heardItPlaying = false;
  trackFinished = false;
  startedAt = Date.now();
  playbackError = null;
  startingSong = true;

  // Silence BEFORE the ident, not after. Without this the previous track kept
  // playing underneath the sting, which sounded like two songs at once and,
  // worse, let the old track's ending be mistaken for the new one's.
  //
  // NOTE WHAT IS NOT HERE: showVideoStage(false).
  //
  // Hiding the stage reveals the artwork screen underneath, and that screen
  // still holds the title and cover of the song that just finished, because
  // paintNowPlaying does not run until the new song is ready. So the room saw
  // the previous song's no-video screen flash up in the middle of the change.
  //
  // The stage is left exactly as it is. playSong sets it correctly when the
  // new song starts, and the sting covers the gap in between.
  music.stop();
  stopYouTube();

  await api("markPlaying", { queueId: item.QueueID });

  // Between songs, never over one. Whatever plays here holds the picture and
  // the song starts after it, so nothing ever talks over somebody's request.
  //
  // A celebration wins when there is one. Two full-screen interruptions back
  // to back would be a pause rather than punctuation, so the ident stands down
  // on those songs: a dedication is already the moment, and it does not need
  // the channel clearing its throat first.
  let wait = playCelebration({
    by: item.RequestedBy,
    title: item.Title,
    artist: item.Artist,
    dedication: item.Dedication,
    dedicatedTo: item.DedicatedTo
  });

  if (!wait) wait = playIdent();

  // The lookups run DURING the sting rather than after it. Apple's catalog
  // call and the video search take a second or two, and adding that to three
  // seconds of ident is what made a request feel like it took forever to
  // start. playSong holds at the last possible moment instead, so by the time
  // the ident clears the song is ready to go.
  const holdUntil = Date.now() + wait;

  try {
    // Google Sheets hands back numeric IDs as numbers. MusicKit only accepts
    // strings and fails with "could not be resolved" on anything else.
    await playSong(
      String(item.SongID).trim(),
      item.Title,
      item.Artist,
      item.RequestedBy,
      item.Dedication,
      holdUntil
    );

    // The clock for "this would not start" begins when the song does, not when
    // the ident did.
    startedAt = Date.now();
    heardItPlaying = false;
  } catch (error) {
    playbackError = error && error.message ? error.message : String(error);
    debugLine("PLAYBACK FAILED: " + playbackError);
    await api("markPlayed", { queueId: item.QueueID });
    currentQueueId = null;
    setStatus("could not play: " + playbackError);
  } finally {
    // A flag left stuck on would mean no song ever ends again, so it is
    // cleared here whatever happened above. playSong clears it earlier, the
    // moment playback actually starts; this is only the backstop.
    startingSong = false;
  }
}

/**
 * True during the holiday window set at the top of the file. Written so the
 * window may run across the end of the year, for example 25 November to 6
 * January, without needing a special case.
 */
function inHolidaySeason() {
  const now = new Date();
  const month = now.getMonth() + 1;
  const day = now.getDate();

  const started = month > HOLIDAY_FROM.month
    || (month === HOLIDAY_FROM.month && day >= HOLIDAY_FROM.day);

  const notOver = month < HOLIDAY_UNTIL.month
    || (month === HOLIDAY_UNTIL.month && day <= HOLIDAY_UNTIL.day);

  return HOLIDAY_FROM.month <= HOLIDAY_UNTIL.month
    ? (started && notOver)
    : (started || notOver);
}


/** One station at random from whichever set belongs to today. */
function houseStation() {
  const holiday = inHolidaySeason() && HOLIDAY_STATIONS.length > 0;
  const pool = holiday ? HOLIDAY_STATIONS : HOUSE_STATIONS;

  if (pool.length === 0) return "";
  return pool[Math.floor(Math.random() * pool.length)];
}


// Station names resolve to the same playlist all day, so the answers are kept
// rather than searched for again every time the queue empties.
const stationMemo = new Map();

/**
 * Turns a station name into a playlist ID Apple will actually play.
 *
 * Apple's own playlists are preferred over anything else that matches, because
 * a search for "oldies" will happily return somebody's public playlist and we
 * would rather have the curated one going out over the dock.
 */
async function resolveStation(station) {
  if (!station) return "";
  if (station.indexOf("pl.") === 0) return station;
  if (stationMemo.has(station)) return stationMemo.get(station);

  try {
    const response = await music.api.music("/v1/catalog/us/search", {
      term: station,
      types: ["playlists"],
      limit: 10
    });

    const found = response.data.results.playlists;
    const playlists = found ? found.data : [];
    if (playlists.length === 0) return "";

    const curated = playlists.filter(item =>
      /apple music/i.test((item.attributes || {}).curatorName || "")
    );

    const chosen = (curated[0] || playlists[0]).id;
    stationMemo.set(station, chosen);
    debugLine("house station \"" + station + "\" -> " + chosen);

    return chosen;
  } catch (error) {
    debugLine("could not resolve station \"" + station + "\"");
    return "";
  }
}


/**
 * Pulls the songs out of a station's playlist, drops anything that cannot go
 * over the dock speakers, and shuffles what is left.
 *
 * Filtering here is the reason the rotation is driven track by track. When the
 * whole playlist was handed to Apple, none of it was checked, and Apple's hits
 * playlists do carry explicit tracks.
 */
async function stationTracks(playlistId) {
  try {
    const response = await music.api.music(
      "/v1/catalog/us/playlists/" + playlistId,
      { include: "tracks" }
    );

    const playlist = response.data.data[0];
    const tracks = playlist.relationships.tracks.data || [];

    const clean = tracks.filter(track => {
      const attributes = track.attributes || {};
      if (attributes.contentRating === "explicit") return false;
      if (isFoul(attributes.name)) return false;
      if (isFoul(attributes.artistName)) return false;
      return track.type === "songs";
    });

    // Shuffled so a station does not open with the same song every time.
    for (let i = clean.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const swap = clean[i];
      clean[i] = clean[j];
      clean[j] = swap;
    }

    return clean.map(track => ({
      id: String(track.id),
      title: track.attributes.name,
      artist: track.attributes.artistName
    }));
  } catch (error) {
    debugLine("could not read station tracks: " + (error.message || error));
    return [];
  }
}


/**
 * The next station track worth playing.
 *
 * With HOUSE_VIDEOS_ONLY on, tracks with no Apple music video are skipped, so
 * the wall keeps showing pictures between requests instead of album sleeves.
 * The lookups are memoised, so a track screened here costs nothing when it is
 * played a moment later, and nothing again the next time the station comes up.
 *
 * After HOUSE_VIDEO_TRIES misses it gives up and plays the next one regardless.
 * A station full of obscure material should sound like something rather than
 * search forever and leave the dock silent.
 */
async function nextHouseTrack() {
  if (!HOUSE_VIDEOS_ONLY || !PLAY_VIDEOS) {
    return houseQueue.shift() || null;
  }

  let looked = 0;

  while (houseQueue.length > 0 && looked < HOUSE_VIDEO_TRIES) {
    const track = houseQueue.shift();
    looked++;

    const video = await musicVideoFor(track.title, track.artist);
    if (video) return track;
  }

  if (looked >= HOUSE_VIDEO_TRIES) {
    debugLine("no videos in the last " + looked + " station tracks, playing anyway");
  }

  return houseQueue.shift() || null;
}


/** Falls back to the house rotation so the dock is never silent. */
async function playHouse() {
  startingSong = true;

  if (houseQueue.length === 0) {
    const station = houseStation();
    const playlist = await resolveStation(station);

    if (playlist) {
      houseQueue = await stationTracks(playlist);
      houseStationName = station;
    }
  }

  if (houseQueue.length === 0) {
    houseTrack = null;
    showVideoStage(false);
    paintNowPlaying("Nothing playing", "", "");
    paintArtwork(null);
    if (!playbackError) {
      setStatus("waiting for requests", true);
    }
    startingSong = false;
    return;
  }

  const track = await nextHouseTrack();

  if (!track) {
    houseTrack = null;
    showVideoStage(false);
    paintNowPlaying("Nothing playing", "", "");
    paintArtwork(null);
    if (!playbackError) {
      setStatus("waiting for requests", true);
    }
    startingSong = false;
    return;
  }

  houseTrack = track;
  trackFinished = false;

  try {
    const how = await playSong(track.id, track.title, track.artist, "", "");
    setStatus(houseStationName + ", " + how, true);
  } catch (error) {
    // One bad track should not stall the rotation. Drop it and let the next
    // tick take the one after it.
    debugLine("house track failed: " + (error.message || error));
    houseTrack = null;
  } finally {
    startingSong = false;
  }
}


// ---------------------------------------------------------------------------
// Painting the screen
// ---------------------------------------------------------------------------

function paintNowPlaying(title, artist, by) {
  el("title").textContent = title;
  el("artist").textContent = artist || "";
  el("eyebrow").style.visibility = artist ? "visible" : "hidden";

  const credit = el("credit");
  credit.textContent = by ? "Requested by " + by : "";
  credit.classList.toggle("on", !!by);
}

function paintArtwork(url) {
  const art = el("art");
  const backdrop = el("backdrop");

  if (!url) {
    art.classList.remove("on");
    backdrop.classList.remove("on");
    return;
  }

  art.classList.remove("on");
  const preload = new Image();
  preload.onload = () => {
    art.src = url;
    art.classList.add("on");
    backdrop.style.backgroundImage = 'url("' + url + '")';
    backdrop.classList.add("on");
  };
  preload.src = url;
}

function paintProgress() {
  let total = 0;
  let at = 0;

  if (onYouTube && ytPlayer && ytPlayer.getDuration) {
    total = ytPlayer.getDuration();
    at = ytPlayer.getCurrentTime();
  } else if (music) {
    total = music.currentPlaybackDuration;
    at = music.currentPlaybackTime;
  }

  const percent = total > 0 ? Math.min(100, (at / total) * 100) : 0;
  el("progress").style.width = percent + "%";
}

// Artwork never changes for a given song, and the queue repaints every four
// seconds, so the answers are kept rather than asked for again and again.
const artworkMemo = new Map();

async function artworkTemplate(songId) {
  if (artworkMemo.has(songId)) return artworkMemo.get(songId);

  const details = await songDetails(songId);
  artworkMemo.set(songId, details.artwork);
  return details.artwork;
}


// What the up-next list was last built from. Rebuilding it on every tick would
// reload the artwork and make the whole list blink every four seconds.
let lastNextSignature = null;

/**
 * The up-next list in the bottom right corner of a video, under the requester.
 *
 * It reads the same list the cards below use, which arrives from the API
 * already in fair-rotation order, so what is shown here is genuinely the order
 * things will play in.
 */
function paintVideoNext(waiting) {
  const box = el("vnext");

  const signature = waiting.map(item => item.QueueID).join(",");
  if (signature === lastNextSignature) return;
  lastNextSignature = signature;

  box.innerHTML = "";

  const head = document.createElement("div");
  head.className = "head";
  head.textContent = "Up next";
  box.appendChild(head);

  if (waiting.length === 0) {
    const none = document.createElement("div");
    none.className = "none";
    none.textContent = "Nothing else queued";
    box.appendChild(none);
    return;
  }

  // Every waiting song is built. Anything that will not fit is taken away
  // afterwards by measurement, because how many rows fit depends on the screen.
  waiting.forEach(item => {
    const row = document.createElement("div");
    row.className = "row";

    const art = document.createElement("img");
    art.alt = "";
    artworkTemplate(String(item.SongID).trim()).then(template => {
      const url = sized(template, 200);
      if (url) art.src = url;
    });

    const text = document.createElement("div");
    text.className = "rtext";
    const song = document.createElement("b");
    song.textContent = shorten(item.Title);
    const who = document.createElement("span");
    who.textContent = shorten(item.RequestedBy);
    text.append(song, who);

    row.append(text, art);
    box.appendChild(row);
  });

  trimToFit(box, waiting.length);
}


/**
 * Cuts a title or a name down to QUEUE_TEXT_MAX characters.
 *
 * Counted the way a person would count them: every character including spaces,
 * and the ellipsis counts as one of them, so nothing on the rail is ever wider
 * than the number in that constant.
 *
 * It backs up to a word boundary when one is within a few characters of the
 * cut, because a title that stops between words reads as a shorter title while
 * one that stops mid-word reads as broken.
 */
function shorten(text) {
  const full = String(text || "").trim();
  if (full.length <= QUEUE_TEXT_MAX) return full;

  const room = QUEUE_TEXT_MAX - 1;
  const cut = full.slice(0, room);
  const space = cut.lastIndexOf(" ");

  const kept = (space >= room - 4 && space > 0) ? cut.slice(0, space) : cut;

  return kept.replace(/[ ,.;:'-]+$/, "") + "\u2026";
}


/**
 * Keeps as many queued songs on screen as physically fit, and drops the rest.
 *
 * There is no fixed row count here on purpose. Row heights are in viewport
 * units, so how many fit depends on the screen the jukebox ends up on.
 * Measuring uses all the space without either wasting it or running rows off
 * the bottom of the picture.
 */
function trimToFit(box, total) {
  const rows = () => box.querySelectorAll(".row");

  // The ceiling first, then the measurement. Measurement alone would happily
  // fill a large screen top to bottom.
  while (rows().length > QUEUE_MAX_ROWS) {
    box.removeChild(rows()[rows().length - 1]);
  }

  while (box.scrollHeight > box.clientHeight && rows().length > 1) {
    box.removeChild(rows()[rows().length - 1]);
  }

  if (rows().length >= total) return;

  const more = document.createElement("div");
  more.className = "none";
  more.textContent = "and " + (total - rows().length) + " more";
  box.appendChild(more);

  // The note needs a line of its own, so give up a row if it does not fit.
  while (box.scrollHeight > box.clientHeight && rows().length > 1) {
    box.removeChild(rows()[rows().length - 1]);
    more.textContent = "and " + (total - rows().length) + " more";
  }
}


function paintQueue(waiting) {
  // Drop whatever is playing right now, by ID rather than by position.
  //
  // The API only lists songs still marked waiting, so on most ticks the first
  // entry IS the next song. The exception is the tick where playback starts:
  // the player picks up the first entry and paints from the same answer, in
  // which that song is still marked waiting. Skipping position zero handled
  // that one tick and hid the next song on every other one, which is why the
  // wall and the phones disagreed.
  const queued = waiting.filter(item => item.QueueID !== currentQueueId);

  paintVideoNext(queued);

  const cards = el("cards");
  const upcoming = queued.slice(0, 4);

  if (upcoming.length === 0) {
    cards.innerHTML = '<span class="idle">Nothing queued yet.</span>';
    return;
  }

  cards.innerHTML = "";
  upcoming.forEach((item, index) => {
    const card = document.createElement("div");
    card.className = "card";

    const pos = document.createElement("div");
    pos.className = "pos";
    pos.textContent = index + 1;

    const img = document.createElement("img");
    artworkTemplate(String(item.SongID).trim()).then(template => {
      const url = sized(template, 160);
      if (url) img.src = url;
    });

    const text = document.createElement("div");
    const name = document.createElement("b");
    name.textContent = item.Title;
    const who = document.createElement("span");
    who.textContent = item.RequestedBy;
    text.append(name, who);

    card.append(pos, img, text);
    cards.appendChild(card);
  });

  // The strip is a single row with hidden overflow, so anything past the edge
  // would just disappear without saying so.
  const overflow = queued.length - upcoming.length;
  if (overflow > 0) {
    const more = document.createElement("span");
    more.className = "idle";
    more.textContent = "and " + overflow + " more";
    cards.appendChild(more);
  }
}

</script>
